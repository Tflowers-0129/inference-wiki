<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1008" viewBox="0 0 720 1008" role="img" aria-labelledby="title desc">
  <title id="title">D2RH：先到 D 的 Host，再载入 D 的 HBM</title>
  <desc id="desc">独立的 MooncakeD2RHConnectorV1 PD 配置。第一跳由 D 发起 READ，将 P 的 NPU KV 复制到 D 机器的 pinned Host DRAM；有效 Host 缓存命中可省去对应传输。第一跳完成后通知 P，P 按完成计数释放源页。第二跳在同一台 D 机器上执行 H2D，D 本地 HBM 命中可减少复制；所需 KV 就绪后开始 Decode。所有 H2D 读取结束后解除 Host 页引用，无其他引用时才可淘汰复用。图为源码机制示意，不表示传输耗时；官方仅声明验证 Atlas 850E UBoE 与 DeepSeek-V4-Flash。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d;font-size:20px}
      .title{font-size:26px;font-weight:700}.label{font-size:22px;font-weight:700}
      .small{font-size:20px}.muted{fill:#475569}.blue{fill:#1d4ed8}.green{fill:#0f766e}.orange{fill:#b45309}
      .frame{fill:#fff;stroke:#64748b;stroke-width:1.6}.memory{fill:#e6f4f1;stroke:#438d81;stroke-width:1.6}
      .payload{fill:none;stroke:#b45309;stroke-width:3;marker-end:url(#data)}
      .control{fill:none;stroke:#1d4ed8;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#meta)}
    </style>
    <marker id="data" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b45309" stroke-width="1.7"/></marker>
    <marker id="meta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#1d4ed8" stroke-width="1.7"/></marker>
  </defs>
  <rect width="720" height="1008" rx="18" fill="#f8fafc"/>
  <text x="28" y="44" class="title">D2RH：先到 D 的 Host，再载入 HBM</text>
  <text x="28" y="78" class="small muted">独立 PD 配置 · MooncakeD2RHConnectorV1</text>
  <path d="M30 111H82" class="payload"/><text x="96" y="117" class="small orange">KV 数据</text>
  <path d="M260 111H312" class="control"/><text x="326" y="117" class="small blue">完成通知</text>

  <rect x="28" y="144" width="664" height="128" rx="12" class="frame"/>
  <text x="52" y="179" class="label blue">机器 P · Prefill</text>
  <rect x="60" y="198" width="600" height="50" rx="9" class="memory"/>
  <text x="84" y="231" class="label green">P NPU HBM · 已计算的 KV</text>

  <rect x="28" y="408" width="664" height="492" rx="12" class="frame"/>
  <text x="52" y="443" class="label blue">同一台机器 D · Host 与 NPU</text>
  <rect x="60" y="470" width="600" height="112" rx="9" class="memory"/>
  <text x="84" y="506" class="label green">D Host DRAM · pinned KV 暂存 / 缓存</text>
  <text x="84" y="548" class="small">有效 Host 命中：对应页不再从 P 搬入</text>

  <path d="M560 248V470" class="payload"/>
  <path d="M636 470V248" class="control"/>
  <text x="60" y="316" class="label orange">① D 发起 READ</text>
  <text x="60" y="349">P HBM → D Host，复制 KV 内容</text>
  <text x="60" y="386" class="small blue">首跳完成通知 P；源页按完成计数释放</text>

  <path d="M140 582V714" class="payload"/>
  <text x="178" y="625" class="label orange">② 同机 H2D，载入 D 的目标页</text>
  <text x="178" y="663" class="small">D 本地 HBM 命中：相应区段少搬</text>
  <rect x="60" y="714" width="600" height="104" rx="9" class="memory"/>
  <text x="84" y="750" class="label green">D NPU HBM · 接收 KV，随后追加</text>
  <text x="84" y="789">需要的 KV 就绪后，开始 Decode</text>
  <text x="60" y="851" class="small">所有 H2D 读取结束 → 解除 Host 页引用</text>
  <text x="60" y="880" class="small muted">无其他引用时可淘汰复用；有效缓存可保留。</text>

  <text x="28" y="941" class="small muted">官方验证：Atlas 850E UBoE · DeepSeek-V4-Flash</text>
  <text x="28" y="974" class="small muted">源码机制示意；其他配置与实际耗时待验证。</text>
</svg>
