<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">逻辑 block table 到共享物理 KV 块的引用映射</title><desc id="desc">运行时 A 与 B 的逻辑块0和1分别指向共享物理块 P0、P1，引用均为2；各自后缀 A2、B2引用为1。A结束后 P0、P1引用为1不能回收，A2引用为0可复用。两者完成后前缀引用为0，可保留缓存内容直到被复用或驱逐。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#60728d" stroke-width="1.1"/></marker><marker id="amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#d98b21" stroke-width="1.1"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}*{box-sizing:border-box}</style></defs><rect width="1200" height="650" rx="20" fill="#fbfaf7"/><text x="32" y="42" font-size="28" fill="#172b4d" font-weight="700">共享前缀：请求完成，释放的是引用</text><text x="32" y="72" font-size="14" fill="#60728d" font-weight="400">两张逻辑 Block Table 可以指向同一物理 KV 块；只有引用归零的块才可回收或复用。</text><rect x="32" y="102" width="552" height="344" rx="14" fill="#fff" stroke="#dce3eb" /><text x="52" y="133" font-size="20" fill="#172b4d" font-weight="700">① A、B 都在运行</text><text x="52" y="156" font-size="12" fill="#60728d" font-weight="400">P0 / P1 物理块各有 2 个活跃引用</text><rect x="616" y="102" width="552" height="344" rx="14" fill="#fff" stroke="#dce3eb" /><text x="636" y="133" font-size="20" fill="#172b4d" font-weight="700">② A 完成，B 继续</text><text x="636" y="156" font-size="12" fill="#60728d" font-weight="400">P0 / P1 仍被 B 引用，不能回收</text><text x="54" y="176" font-size="15" fill="#172b4d" font-weight="650">请求 A</text><text x="54" y="195" font-size="10" fill="#60728d" font-weight="400">逻辑块号 → 物理块号</text><rect x="54" y="207" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="71" y="233" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">0</text><path d="M87 214V240" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="129" y="233" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">P0</text><rect x="54" y="251" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="71" y="277" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">1</text><path d="M87 258V284" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="129" y="277" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">P1</text><rect x="54" y="295" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="71" y="321" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">2</text><path d="M87 302V328" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="129" y="321" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">A2</text><text x="446" y="176" font-size="15" fill="#172b4d" font-weight="650">请求 B</text><text x="446" y="195" font-size="10" fill="#60728d" font-weight="400">逻辑块号 → 物理块号</text><rect x="446" y="207" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="463" y="233" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">0</text><path d="M479 214V240" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="521" y="233" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">P0</text><rect x="446" y="251" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="463" y="277" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">1</text><path d="M479 258V284" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="521" y="277" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">P1</text><rect x="446" y="295" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="463" y="321" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">2</text><path d="M479 302V328" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="521" y="321" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">B2</text><text x="306" y="190" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">物理 KV 块</text><path d="M170 227C200 227 207 226 238 226" fill="none" stroke="#2473ec" stroke-width="1.7" /><path d="M170 271C200 271 207 274 238 274" fill="none" stroke="#2473ec" stroke-width="1.7" /><path d="M170 315C200 315 207 322 238 322" fill="none" stroke="#159c91" stroke-width="1.7" /><path d="M446 227C414 227 407 226 374 226" fill="none" stroke="#2473ec" stroke-width="1.7" /><path d="M446 271C414 271 407 274 374 274" fill="none" stroke="#2473ec" stroke-width="1.7" /><path d="M446 315C411 315 410 370 374 370" fill="none" stroke="#d98b21" stroke-width="1.7" /><rect x="238" y="207" width="136" height="38" rx="7" fill="#edf3ff" stroke="#2473ec" /><text x="251" y="232" font-size="15" fill="#1d4ed8" font-weight="700">P0</text><text x="360" y="232" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="end">ref=2</text><rect x="238" y="255" width="136" height="38" rx="7" fill="#edf3ff" stroke="#2473ec" /><text x="251" y="280" font-size="15" fill="#1d4ed8" font-weight="700">P1</text><text x="360" y="280" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="end">ref=2</text><rect x="238" y="303" width="136" height="38" rx="7" fill="#e8f6f3" stroke="#159c91" /><text x="251" y="328" font-size="15" fill="#0f766e" font-weight="700">A2</text><text x="360" y="328" font-size="13" fill="#0f766e" font-weight="600" text-anchor="end">ref=1</text><rect x="238" y="351" width="136" height="38" rx="7" fill="#fff4de" stroke="#d98b21" /><text x="251" y="376" font-size="15" fill="#92400e" font-weight="700">B2</text><text x="360" y="376" font-size="13" fill="#92400e" font-weight="600" text-anchor="end">ref=1</text><text x="54" y="419" font-size="12" fill="#1d4ed8" font-weight="600">共享前缀</text><path d="M121 415H211" fill="none" stroke="#2473ec" stroke-width="1" /><text x="238" y="419" font-size="12" fill="#60728d" font-weight="400">独立后缀 A2 / B2</text><text x="638" y="176" font-size="15" fill="#60728d" font-weight="650">请求 A 已结束</text><text x="638" y="195" font-size="10" fill="#60728d" font-weight="400">逻辑块号 → 物理块号</text><rect x="638" y="207" width="116" height="40" rx="5" fill="#f0f2f5" stroke="#dce3eb" /><text x="655" y="233" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">0</text><path d="M671 214V240" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="713" y="233" font-size="15" fill="#60728d" font-weight="600" text-anchor="middle">—</text><rect x="638" y="251" width="116" height="40" rx="5" fill="#f0f2f5" stroke="#dce3eb" /><text x="655" y="277" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">1</text><path d="M671 258V284" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="713" y="277" font-size="15" fill="#60728d" font-weight="600" text-anchor="middle">—</text><rect x="638" y="295" width="116" height="40" rx="5" fill="#f0f2f5" stroke="#dce3eb" /><text x="655" y="321" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">2</text><path d="M671 302V328" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="713" y="321" font-size="15" fill="#60728d" font-weight="600" text-anchor="middle">—</text><text x="1030" y="176" font-size="15" fill="#172b4d" font-weight="650">请求 B</text><text x="1030" y="195" font-size="10" fill="#60728d" font-weight="400">逻辑块号 → 物理块号</text><rect x="1030" y="207" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="1047" y="233" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">0</text><path d="M1063 214V240" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="1105" y="233" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">P0</text><rect x="1030" y="251" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="1047" y="277" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">1</text><path d="M1063 258V284" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="1105" y="277" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">P1</text><rect x="1030" y="295" width="116" height="40" rx="5" fill="#fff" stroke="#dce3eb" /><text x="1047" y="321" font-size="13" fill="#60728d" font-weight="400" text-anchor="middle">2</text><path d="M1063 302V328" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="1105" y="321" font-size="15" fill="#172b4d" font-weight="600" text-anchor="middle">B2</text><text x="890" y="190" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">物理 KV 块</text><path d="M1030 227C998 227 991 226 958 226" fill="none" stroke="#2473ec" stroke-width="1.7" /><path d="M1030 271C998 271 991 274 958 274" fill="none" stroke="#2473ec" stroke-width="1.7" /><path d="M1030 315C995 315 994 370 958 370" fill="none" stroke="#d98b21" stroke-width="1.7" /><rect x="822" y="207" width="136" height="38" rx="7" fill="#edf3ff" stroke="#2473ec" /><text x="835" y="232" font-size="15" fill="#1d4ed8" font-weight="700">P0</text><text x="944" y="232" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="end">ref=1</text><rect x="822" y="255" width="136" height="38" rx="7" fill="#edf3ff" stroke="#2473ec" /><text x="835" y="280" font-size="15" fill="#1d4ed8" font-weight="700">P1</text><text x="944" y="280" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="end">ref=1</text><rect x="822" y="303" width="136" height="38" rx="7" fill="#eef7f3" stroke="#159c91" stroke-dasharray="4 3"/><text x="835" y="328" font-size="15" fill="#0f766e" font-weight="700">A2</text><text x="944" y="328" font-size="13" fill="#0f766e" font-weight="600" text-anchor="end">ref=0</text><rect x="822" y="351" width="136" height="38" rx="7" fill="#fff4de" stroke="#d98b21" /><text x="835" y="376" font-size="15" fill="#92400e" font-weight="700">B2</text><text x="944" y="376" font-size="13" fill="#92400e" font-weight="600" text-anchor="end">ref=1</text><text x="638" y="348" font-size="12" fill="#0f766e" font-weight="600">A2 的引用归零</text><text x="638" y="368" font-size="12" fill="#60728d" font-weight="400">可复用给其他请求</text><text x="822" y="419" font-size="12" fill="#60728d" font-weight="400">A2：可复用；前缀：仍被 B 使用</text><rect x="32" y="471" width="1136" height="133" rx="14" fill="#eef2f8" /><text x="52" y="502" font-size="19" fill="#172b4d" font-weight="700">③ A、B 都完成后</text><text x="52" y="529" font-size="12" fill="#60728d" font-weight="400">没有活跃请求引用前缀</text><rect x="362" y="500" width="136" height="38" rx="7" fill="#edf3ff" stroke="#2473ec" /><text x="375" y="525" font-size="15" fill="#1d4ed8" font-weight="700">P0</text><text x="484" y="525" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="end">ref=0</text><rect x="514" y="500" width="136" height="38" rx="7" fill="#edf3ff" stroke="#2473ec" /><text x="527" y="525" font-size="15" fill="#1d4ed8" font-weight="700">P1</text><text x="636" y="525" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="end">ref=0</text><text x="430" y="565" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">可保留缓存内容</text><text x="582" y="565" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">可保留缓存内容</text><text x="704" y="517" font-size="15" fill="#172b4d" font-weight="650">ref = 0：允许复用，不要求立即清空内容。</text><text x="704" y="545" font-size="14" fill="#60728d" font-weight="400">前缀内容可保留，直到被复用或驱逐。</text><text x="704" y="574" font-size="12" fill="#60728d" font-weight="400">保留方式与淘汰策略依引擎实现和配置。</text><text x="32" y="633" font-size="12" fill="#60728d" font-weight="400">ref 表示这里的活跃引用计数；图中 A / B 的前两块前缀相同，各自的第三块后缀不同。</text></svg>