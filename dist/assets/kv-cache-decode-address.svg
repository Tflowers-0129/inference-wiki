<svg xmlns="http://www.w3.org/2000/svg" width="350" height="340" viewBox="0 0 350 340" role="img" aria-labelledby="title desc">
  <title id="title">请求 A 的写槽与分页读取</title>
  <desc id="desc">管理块与 kernel 块均有四个槽。请求 A 的 a0 到 a7 已缓存。块表 [7,2,9] 将三个逻辑块映射到三个物理块。本轮 a8 在位置 8，通过 slot_mapping 写到物理块 9 的第 0 行，即槽 36。Attention 按块表从三页分别读取 4、4、1 个有效位置。块 9 的三个虚线槽不计入有效长度。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .label{font-size:17px;font-weight:650}
      .minor{font-size:15px;fill:#475569}
      .field,.field text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}
      .center{text-anchor:middle}
      .blue{fill:#1d4ed8}
      .orange{fill:#9a3412}
      .teal{fill:#0f766e}
      .page{fill:#eff6ff;stroke:#64748b}
      .mapping{fill:none;stroke:#1d4ed8;stroke-width:1.5;marker-end:url(#map-arrow)}
      .gather{fill:none;stroke:#0f766e;stroke-width:1.6}
    </style>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/>
    </marker>
    <marker id="write-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309"/>
    </marker>
    <marker id="read-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="350" height="340" fill="#fff"/>
  <text x="16" y="28" class="label">请求 A</text>
  <text x="78" y="28" class="minor">每块 4 槽</text>
  <path d="M16 42H208" fill="none" stroke="#cbd5e1"/>

  <text x="16" y="65" class="field blue">block_table = [7, 2, 9]</text>
  <text x="222" y="28" class="label orange">a8 → 槽 36</text>
  <text x="222" y="48" class="field orange">slot_mapping</text>
  <path d="M262 55V160" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#write-arrow)"/>

  <text x="16" y="95" class="minor">逻辑位置</text>
  <g class="label center">
    <text x="116" y="95">0–3</text>
    <text x="204" y="95">4–7</text>
    <text x="299" y="95">8–11</text>
  </g>
  <path d="M116 104V125" class="mapping"/>
  <path d="M204 104V125" class="mapping"/>
  <path d="M299 104V125" class="mapping"/>

  <text x="16" y="148" class="minor">物理块</text>
  <g class="label center blue">
    <text x="116" y="148" class="blue">7</text>
    <text x="204" y="148" class="blue">2</text>
    <text x="299" y="148" class="blue">9</text>
  </g>

  <text x="16" y="184" class="minor">页内槽</text>
  <rect x="76" y="164" width="80" height="30" class="page"/>
  <rect x="164" y="164" width="80" height="30" class="page"/>
  <path d="M96 164V194M116 164V194M136 164V194M184 164V194M204 164V194M224 164V194"
        fill="none" stroke="#64748b"/>
  <rect x="272" y="164" width="60" height="30" fill="#f8fafc" stroke="#64748b" stroke-dasharray="3 2"/>
  <path d="M292 164V194M312 164V194" fill="none" stroke="#64748b" stroke-dasharray="3 2"/>
  <rect x="252" y="164" width="20" height="30" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <g class="field center">
    <text x="86" y="184">a0</text><text x="106" y="184">a1</text><text x="126" y="184">a2</text><text x="146" y="184">a3</text>
    <text x="174" y="184">a4</text><text x="194" y="184">a5</text><text x="214" y="184">a6</text><text x="234" y="184">a7</text>
    <text x="262" y="184" class="orange">a8</text>
  </g>

  <text x="16" y="230" class="minor">有效行</text>
  <path d="M76 200V207H156V200M164 200V207H244V200M252 200V207H272V200" class="gather"/>
  <g class="label center">
    <text x="116" y="230" class="teal">4</text>
    <text x="204" y="230" class="teal">4</text>
    <text x="262" y="230" class="teal">1</text>
  </g>
  <path d="M116 239V252H262V239M204 239V272" class="gather"/>
  <path d="M204 252V272" class="gather" marker-end="url(#read-arrow)"/>
  <text x="204" y="298" class="label teal center">Attention</text>
  <text x="204" y="320" class="field teal center">seq_lens = [9]</text>
</svg>
