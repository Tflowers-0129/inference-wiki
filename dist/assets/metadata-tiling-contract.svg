<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="800" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
  <title id="title">请求 metadata 怎样接到 Attention 的 tiling plan</title>
  <desc id="desc">上方区分请求语义与算子计划。下方对比 Host 精确长度消费和 Device 长度生成计划两条依赖链。有效 KV 起点十一，下一轮两行 query，有效长度十三。图是依赖示意，不表示实测时间或全部后端支持情况。</desc>
  <defs>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:27px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#475569}.blue{fill:#1d4ed8}.green{fill:#0f766e}.orange{fill:#9a3412}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1040" height="800" rx="20" fill="#f8fafc"/>
  <text x="32" y="47" class="title">metadata 描述本轮输入，tiling plan 安排算子执行</text>
  <text x="32" y="80" class="small">A 已有 11 个有效 KV，下一轮 [x,e1] 两行 query，Attention 有效长度为 13。</text>
  <rect x="32" y="110" width="456" height="174" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="52" y="145" class="head blue">请求与地址 metadata</text>
  <text x="52" y="182" class="body">query_start_loc = [0,2]</text>
  <text x="52" y="215" class="body">seq_lens = [13]</text>
  <text x="52" y="250" class="small">另有块表、positions、slot_mapping</text>
  <path d="M498 195H538" class="line"/>
  <rect x="552" y="110" width="456" height="174" rx="12" fill="#e6f4f1" stroke="#99c9bf"/>
  <text x="572" y="145" class="head green">算子专用 tiling plan</text>
  <text x="572" y="182" class="body">长度 + heads / mask / layout 等</text>
  <text x="572" y="215" class="body">→ flash_attn_metadata(...) → plan</text>
  <text x="572" y="250" class="small">Attention 同时接收 plan、Q 与 KV 地址</text>
  <text x="32" y="327" class="head">两条路径：精确长度在哪里被消费？</text>
  <rect x="32" y="350" width="976" height="140" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="52" y="380" class="body orange">Host 精确值路径</text>
  <rect x="52" y="405" width="214" height="57" rx="8" fill="#e6f4f1" stroke="#99c9bf"/>
  <text x="73" y="441" class="body">Device 真实长度</text>
  <path d="M275 434H388" class="line"/>
  <text x="289" y="417" class="small orange">D2H / 等待</text>
  <rect x="400" y="405" width="250" height="57" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="421" y="441" class="body">Host 列表 / tiling 接口</text>
  <path d="M660 434H748" class="line"/>
  <rect x="760" y="405" width="224" height="57" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="795" y="441" class="body">提交 Attention</text>
  <rect x="32" y="510" width="976" height="140" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="52" y="540" class="body green">支持 Device 长度的计划接口</text>
  <rect x="52" y="565" width="214" height="57" rx="8" fill="#e6f4f1" stroke="#99c9bf"/>
  <text x="73" y="601" class="body">Device 真实长度</text>
  <path d="M275 594H388" class="line"/>
  <text x="289" y="577" class="small">输入就绪</text>
  <rect x="400" y="565" width="250" height="57" rx="8" fill="#e6f4f1" stroke="#99c9bf"/>
  <text x="435" y="601" class="body">Device 生成 plan</text>
  <path d="M660 594H748" class="line"/>
  <text x="662" y="577" class="small">plan 就绪</text>
  <rect x="760" y="565" width="224" height="57" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="784" y="601" class="body">Attention 消费</text>
  <rect x="32" y="675" width="976" height="75" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="52" y="706" class="body orange">地址可稳定，长度与 plan 仍须对应本轮；消费结束后才允许覆写。</text>
  <text x="52" y="735" class="small">同一步、同组、兼容属性可跨层复用；shape 相同不代表跨轮计划仍有效。</text>
  <text x="32" y="783" class="small">依赖示意，无实测时间比例。具体 builder、算子与图生命周期的适用范围见正文。</text>
</svg>
