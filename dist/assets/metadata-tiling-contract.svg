<svg xmlns="http://www.w3.org/2000/svg" width="960" height="518" viewBox="0 0 960 518" role="img" aria-labelledby="title desc"><title id="title">Tiling 下沉移动的是精确长度的消费者</title><desc id="desc">两种依赖路径的对照，不是按毫秒绘制的性能比较。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:21px;font-weight:600}.head{font-size:16px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}.blue{font-size:16px;fill:#2763b0}.teal{font-size:16px;fill:#157b78}.orange{font-size:16px;fill:#a96524}</style></defs><rect width="960" height="518" fill="#fff"/><text x="32" y="38" class="title">Tiling 下沉移动的是精确长度的消费者</text><text x="32" y="65" class="small">两种依赖路径的对照，不是按毫秒绘制的性能比较。</text><text x="32" y="94" class="head">需要精确 Host 长度的路径</text><text x="32" y="142" class="small">Host</text><text x="32" y="219" class="small">Device</text><path d="M108 172 L928 172" fill="none" stroke="#d8e1eb" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="310" class="head">设备 tiling 路径</text><text x="32" y="358" class="small">Host</text><text x="32" y="435" class="small">Device</text><path d="M108 388 L928 388" fill="none" stroke="#d8e1eb" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="124" y="188" width="180" height="50" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="138" y="219" class="body">验证 → 精确长度</text><path d="M304 213 H344 V134 H380" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="308" y="162" class="small">D2H</text><rect x="382" y="112" width="218" height="50" rx="6" fill="#fff4e7" stroke="#d8e1eb"/><text x="396" y="143" class="body">等回读 · Host 准备计划</text><path d="M600 137 H650 V213 H706" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="654" y="171" class="small">提交</text><rect x="708" y="188" width="220" height="50" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="724" y="219" class="body">Attention 消费计划</text><text x="124" y="273" class="small">接受数在 Device 才确定；Host 消费精确长度会把这条依赖接回 CPU。</text><rect x="124" y="404" width="180" height="50" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="138" y="435" class="body">验证 → 精确长度</text><path d="M304 429 L380 429" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="382" y="404" width="218" height="50" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="396" y="435" class="body">metadata kernel → plan</text><path d="M600 429 L706 429" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="708" y="404" width="220" height="50" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="724" y="435" class="body">Attention 消费计划</text><text x="124" y="361" class="small">Host 传递 Tensor 引用与静态参数，不在此处读出每请求的精确长度。</text><text x="124" y="489" class="small">生产者与消费者仍须有序；结果输出的 D2H 是另一条路径。</text></svg>