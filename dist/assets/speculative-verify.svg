<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title desc">
<title id="title">一次投机验证怎样更新输入、输出与有效 KV</title><desc id="desc">目标模型已有位置零到七的有效 KV；已确认但未计算 KV 的 anchor t0 与三个候选一起验证。接受两个候选，拒绝第三个，输出两个接受 token 与纠正 token。有效 KV 回退到长度十一，纠正 token 下一轮作为 anchor。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="920" rx="20" fill="#f8fafc"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700">一次验证的 query 数，不等于这次提交的 token 数</text>
<text x="32" y="80" font-size="17" fill="#475569" font-weight="400">构造例：K = 3 个候选，接受 a = 2 个；单条请求、串行候选链，位置从 0 开始。</text>
<rect x="32" y="102" width="1056" height="178" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="136" font-size="21" fill="#172b4d" font-weight="700">① 验证前：已确认的 token，也可能还没有自己的 target KV</text>
<rect x="52" y="158" width="330" height="78" rx="12" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="217" y="188" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">已有 target KV</text>
<text x="217" y="219" font-size="18" fill="#172b4d" font-weight="500" text-anchor="middle">位置 0…7 · 有效长度 8</text>
<rect x="406" y="158" width="248" height="78" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="530" y="188" font-size="19" fill="#1d4ed8" font-weight="700" text-anchor="middle">anchor：t0 · 位置 8</text>
<text x="530" y="219" font-size="17" fill="#172b4d" font-weight="500" text-anchor="middle">已确认，尚无 target KV</text>
<rect x="678" y="158" width="390" height="78" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
<text x="873" y="188" font-size="20" fill="#9a3412" font-weight="700" text-anchor="middle">候选：d1 / d2 / d3</text>
<text x="873" y="219" font-size="17" fill="#172b4d" font-weight="500" text-anchor="middle">位置 9 / 10 / 11 · 尚未确认</text>
<text x="52" y="263" font-size="17" fill="#475569" font-weight="400">t0 已在此前确认；本轮新提交的输出不重复计算 t0。</text>
<rect x="32" y="300" width="1056" height="174" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="334" font-size="21" fill="#172b4d" font-weight="700">② target 验证输入：[t0, d1, d2, d3]，共 4 个 query</text>
<rect x="52" y="352" width="190" height="63" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
<text x="147" y="378" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">t0</text>
<text x="147" y="403" font-size="17" fill="#172b4d" font-weight="500" text-anchor="middle">位置 8</text>
<rect x="267" y="352" width="190" height="63" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
<text x="362" y="378" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">d1</text>
<text x="362" y="403" font-size="17" fill="#172b4d" font-weight="500" text-anchor="middle">位置 9</text>
<rect x="482" y="352" width="190" height="63" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
<text x="577" y="378" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">d2</text>
<text x="577" y="403" font-size="17" fill="#172b4d" font-weight="500" text-anchor="middle">位置 10</text>
<rect x="697" y="352" width="190" height="63" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
<text x="792" y="378" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">d3</text>
<text x="792" y="403" font-size="17" fill="#172b4d" font-weight="500" text-anchor="middle">位置 11</text>
<text x="52" y="449" font-size="18" fill="#475569" font-weight="600">query_start_loc = [0, 4]</text>
<text x="524" y="449" font-size="18" fill="#475569" font-weight="600">临时计算到长度 12，等待验证决定有效范围</text>
<rect x="32" y="494" width="1056" height="128" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="527" font-size="20" fill="#172b4d" font-weight="700">③ 验证与提交：接受前缀，拒绝点之后不继续沿原候选链提交</text>
<rect x="52" y="544" width="282" height="48" rx="7" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="193" y="575" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle">接受 d1、d2</text>
<rect x="354" y="544" width="230" height="48" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
<text x="469" y="575" font-size="21" fill="#b91c1c" font-weight="700" text-anchor="middle">拒绝 d3</text>
<rect x="604" y="544" width="464" height="48" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
<text x="836" y="575" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">本轮输出：[d1, d2, x] · 共 3 个</text>
<rect x="32" y="642" width="1056" height="169" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="676" font-size="21" fill="#172b4d" font-weight="700">④ 验证后：有效 target KV 为位置 0…10，长度 11</text>
<rect x="52" y="693" width="250" height="66" rx="7" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="177.0" y="720" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle">历史位置 0…7</text>
<text x="177.0" y="746" font-size="16" fill="#172b4d" font-weight="500" text-anchor="middle">原有 KV</text>
<rect x="314" y="693" width="118" height="66" rx="7" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="373.0" y="720" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle">t0 · 8</text>
<text x="373.0" y="746" font-size="16" fill="#172b4d" font-weight="500" text-anchor="middle">已算 KV</text>
<rect x="444" y="693" width="118" height="66" rx="7" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="503.0" y="720" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle">d1 · 9</text>
<text x="503.0" y="746" font-size="16" fill="#172b4d" font-weight="500" text-anchor="middle">已算 KV</text>
<rect x="574" y="693" width="118" height="66" rx="7" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="633.0" y="720" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle">d2 · 10</text>
<text x="633.0" y="746" font-size="16" fill="#172b4d" font-weight="500" text-anchor="middle">已算 KV</text>
<rect x="716" y="693" width="352" height="66" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
<text x="892" y="720" font-size="18" fill="#b91c1c" font-weight="700" text-anchor="middle">d3 · 位置 11：KV 逻辑无效</text>
<text x="892" y="746" font-size="16" fill="#475569" font-weight="500" text-anchor="middle">回退有效范围，不要求物理清零</text>
<text x="52" y="792" font-size="18" fill="#1d4ed8" font-weight="600">纠正 token x 位于位置 11：已确认，但还没有 target KV；下一轮作为 anchor。</text>
<text x="32" y="850" font-size="17" fill="#475569" font-weight="400">本例三个口径：候选数 K = 3；接受数 a = 2；本轮提交 3 个 token，验证 query 数为 4。</text>
<text x="32" y="880" font-size="17" fill="#475569" font-weight="400">验证时算出的 d3 的 KV，不能当成纠正 token x 的 KV：token 身份已经变了。</text>
<text x="32" y="907" font-size="16" fill="#475569" font-weight="400">示意一次接受结果；具体接受判据、附加 token 和缓存管理方式由投机算法与后端决定。</text>
</svg>
