<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="title desc">
<title id="title">第三个候选，由第二个候选所在行验证</title><desc id="desc">单请求贪心算例：三个候选接受两个；未触发 EOS 或长度上限。</desc>
<defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b;font-size:16px}.title{font-size:21px;font-weight:600}.head{font-weight:600}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}</style><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker></defs>
<rect width="960" height="556" fill="#fff"/>
<text x="32" y="38" class="title">第三个候选，由第二个候选所在行验证</text>
<text x="32" y="65" class="small">单请求贪心算例：三个候选接受两个；未触发 EOS 或长度上限。</text>
<text x="32" y="106" class="head">每行预测下一个位置；验证候选，要看前一个输入 Token 的 logits。</text>
<rect x="32" y="126" width="896" height="36" rx="6" fill="#f4f6f9" stroke="#d8e1eb"/>
<text x="50" y="150" class="small">Target 输入</text>
<text x="270" y="150" class="small">这一行预测谁</text>
<text x="570" y="150" class="small">本例的验证结果</text>
<rect x="32" y="162" width="896" height="44" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="50" y="190" class="mono">t0 @ 8</text>
<text x="270" y="190" class="">d1 @ 9</text>
<text x="570" y="190" class="">接受 d1</text>
<rect x="32" y="206" width="896" height="44" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="50" y="234" class="mono">d1 @ 9</text>
<text x="270" y="234" class="">d2 @ 10</text>
<text x="570" y="234" class="">接受 d2</text>
<rect x="32" y="250" width="896" height="44" rx="6" fill="#fff4e7" stroke="#d8e1eb"/>
<text x="50" y="278" class="mono">d2 @ 10</text>
<text x="270" y="278" class="">d3 @ 11</text>
<text x="570" y="278" class="">拒绝 d3，采样得到 x @ 11</text>
<rect x="32" y="294" width="896" height="44" rx="6" fill="#f4f6f9" stroke="#d8e1eb"/>
<text x="50" y="322" class="mono">d3 @ 11</text>
<text x="270" y="322" class="">若全接受，可预测 bonus @ 12</text>
<text x="570" y="322" class="">本例不采用这一行的预测</text>
<rect x="32" y="366" width="430" height="120" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="50" y="397" class="head">本轮新输出：d1、d2、x</text>
<text x="50" y="431" class="">t0 已在上一轮输出，不重复计数。</text>
<text x="50" y="465" class="small">x 刚被采样出来，还没有自己的 KV。</text>
<rect x="498" y="366" width="430" height="120" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="516" y="397" class="head">有效 Target KV：位置 0～10</text>
<text x="516" y="431" class="">长度 = 旧 8 + t0 的 1 + 接受的 2 = 11</text>
<text x="516" y="465" class="small">保留 t0、d1、d2 的 KV；d3 的 KV 无效。</text>
<text x="32" y="530" class="small">下一轮输入 x@11，才会计算 x 的 KV。一次算过 d3，并不等于算过 x。</text>
</svg>
