<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548" role="img" aria-labelledby="title desc">
<title id="title">本轮输入如何分段，新 KV 如何定位</title>
<desc id="desc">三条请求共 2050 个 Token：A 范围为 [0,1)，B 为 [1,2)，C 为 [2,2050)。只用 A 演示一次寻址：位置 4127 除以页长 128，得到页表下标 32 和页内偏移 31；查表得到物理页 81，slot_mapping 为 10399。</desc>
<defs>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:21px;font-weight:600}.head{font-size:16px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}.arrow{fill:none;stroke:#607086;stroke-width:1.5;marker-end:url(#arrow)}</style>
</defs>
<rect width="960" height="548" fill="#fff"/>
<text x="32" y="38" class="title">本轮输入如何分段，新 KV 如何定位</text>
<text x="32" y="65" class="small">三条请求共 2050 个 Token；下面只展开 A 的一次写入。</text>

<text x="32" y="104" class="head">本轮输入范围</text>
<rect x="32" y="120" width="224" height="78" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="50" y="149" class="head">A：1 个 Token</text>
<text x="50" y="179" class="mono">输入范围 [0,1)</text>
<rect x="272" y="120" width="224" height="78" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="290" y="149" class="head">B：1 个 Token</text>
<text x="290" y="179" class="mono">输入范围 [1,2)</text>
<rect x="512" y="120" width="416" height="78" rx="6" fill="#fff4e7" stroke="#d8e1eb"/>
<text x="530" y="149" class="head">C：2048 个 Token 的分块 Prefill</text>
<text x="530" y="179" class="mono">输入范围 [2,2050)</text>

<text x="32" y="247" class="head">只看 A：先算页表下标和页内偏移，再查页表</text>
<rect x="32" y="270" width="150" height="132" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="48" y="301" class="head">请求内的位置</text>
<text x="48" y="332" class="mono">position=4127</text>
<text x="48" y="377" class="small">每页 128 个 Token</text>
<path d="M182 336 H216" class="arrow"/>

<rect x="218" y="270" width="230" height="132" rx="6" fill="#f4f6f9" stroke="#d8e1eb"/>
<text x="234" y="301" class="head">除以每页 Token 数</text>
<text x="234" y="332" class="mono">4127 ÷ 128 = 32 余 31</text>
<text x="234" y="361" class="body">页表下标：32</text>
<text x="234" y="386" class="body">页内偏移：31</text>
<path d="M448 336 H482" class="arrow"/>

<rect x="484" y="270" width="195" height="132" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="500" y="301" class="head">查 A 的页表</text>
<text x="500" y="332" class="mono">block_table[32]</text>
<text x="500" y="361" class="mono">= 81</text>
<path d="M679 336 H713" class="arrow"/>

<rect x="715" y="270" width="213" height="132" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="731" y="301" class="head">物理页 81</text>
<text x="731" y="332" class="body">页内偏移：31</text>
<rect x="731" y="351" width="64" height="31" fill="#fff" stroke="#d8e1eb"/>
<rect x="795" y="351" width="48" height="31" fill="#bde4dc" stroke="#157b78"/>
<rect x="843" y="351" width="69" height="31" fill="#fff" stroke="#d8e1eb"/>
<text x="747" y="373" class="small">…</text>
<text x="809" y="373" class="mono">31</text>
<text x="866" y="373" class="small">…</text>

<path d="M822 402 V432" class="arrow"/>
<rect x="32" y="434" width="896" height="82" rx="6" fill="#f4f6f9" stroke="#d8e1eb"/>
<text x="50" y="463" class="body">slot_mapping = 物理页号 × 每页 Token 数 + 页内偏移</text>
<text x="50" y="494" class="mono">slot_mapping = 81 × 128 + 31 = 10399</text>
</svg>
