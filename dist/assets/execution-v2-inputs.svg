<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" role="img" aria-labelledby="title desc"><title id="title">从请求状态到五行输入与写槽</title><desc id="desc">单卡、无投机、无图填充；同一批次同时包含 Decode 与分块 Prefill。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:21px;font-weight:600}.head{font-size:16px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}.blue{font-size:16px;fill:#2763b0}.teal{font-size:16px;fill:#157b78}.orange{font-size:16px;fill:#a96524}</style></defs><rect width="960" height="576" fill="#fff"/><text x="32" y="38" class="title">从请求状态到五行输入与写槽</text><text x="32" y="65" class="small">单卡、无投机、无图填充；同一批次同时包含 Decode 与分块 Prefill。</text><rect x="32" y="90" width="896" height="78" rx="6" fill="#f4f6f9" stroke="#d8e1eb"/><text x="50" y="117" class="head">SchedulerOutput</text><text x="50" y="145" class="body">本轮请求 A / B / C；query 行数 1 / 1 / 3</text><text x="540" y="117" class="head">Worker 的持久状态</text><text x="540" y="145" class="body">状态槽 6 / 2 / 9；已有 KV 长度 8 / 5 / 2</text><path d="M480 170 L480 202" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="224" class="head">本轮紧凑输入</text><text x="540" y="224" class="mono">query_start_loc = [0,1,2,5]</text><rect x="32" y="240" width="896" height="36" rx="0" fill="#f4f6f9" stroke="#d8e1eb"/><text x="48" y="264" class="small">输入行</text><text x="164" y="264" class="small">请求 → 状态槽</text><text x="304" y="264" class="small">Token</text><text x="454" y="264" class="small">position</text><text x="622" y="264" class="small">逻辑块 / 偏移</text><text x="786" y="264" class="small">物理块 → slot</text><rect x="32" y="276" width="896" height="36" rx="0" fill="#edf4fe" stroke="white"/><text x="48" y="300" class="mono">0</text><text x="164" y="300" class="mono">A → 6</text><text x="304" y="300" class="mono">a8</text><text x="454" y="300" class="mono">8</text><text x="622" y="300" class="mono">2 / 0</text><text x="786" y="300" class="mono">9 → 36</text><rect x="32" y="312" width="896" height="36" rx="0" fill="#eaf6f3" stroke="white"/><text x="48" y="336" class="mono">1</text><text x="164" y="336" class="mono">B → 2</text><text x="304" y="336" class="mono">b5</text><text x="454" y="336" class="mono">5</text><text x="622" y="336" class="mono">1 / 1</text><text x="786" y="336" class="mono">6 → 25</text><rect x="32" y="348" width="896" height="36" rx="0" fill="#fff4e7" stroke="white"/><text x="48" y="372" class="mono">2</text><text x="164" y="372" class="mono">C → 9</text><text x="304" y="372" class="mono">c2</text><text x="454" y="372" class="mono">2</text><text x="622" y="372" class="mono">0 / 2</text><text x="786" y="372" class="mono">8 → 34</text><rect x="32" y="384" width="896" height="36" rx="0" fill="#fff4e7" stroke="white"/><text x="48" y="408" class="mono">3</text><text x="164" y="408" class="mono">C → 9</text><text x="304" y="408" class="mono">c3</text><text x="454" y="408" class="mono">3</text><text x="622" y="408" class="mono">0 / 3</text><text x="786" y="408" class="mono">8 → 35</text><rect x="32" y="420" width="896" height="36" rx="0" fill="#fff4e7" stroke="white"/><text x="48" y="444" class="mono">4</text><text x="164" y="444" class="mono">C → 9</text><text x="304" y="444" class="mono">c4</text><text x="454" y="444" class="mono">4</text><text x="622" y="444" class="mono">1 / 0</text><text x="786" y="444" class="mono">3 → 12</text><text x="32" y="489" class="mono">块大小 4：slot = block_table[position // 4] × 4 + position % 4</text><text x="32" y="518" class="mono">A 块表 [7,2,9]     B 块表 [5,6]     C 块表 [8,3]</text><text x="32" y="549" class="small">块表找历史页；slot_mapping 指定本轮新 KV 的写入行。槽位与块号均为教学构造。</text></svg>