<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 350 350" role="img" aria-labelledby="title desc">
<title id="title">MTP 从哪一行取下一个候选？</title><desc id="desc">单请求 R 的四行验证输入。拒绝最后一个候选后，草稿首步沿用四行的批次边界，在有效的前三行中取行号 2 预测 e1，后续一步只需一行。</desc>
<style>
text {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182d48}
.heading{font-size:18px;font-weight:700}.sub{font-size:13px;fill:#475569}.label{font-size:15px;font-weight:650}.cell{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}.field{font-size:13px;font-variant-numeric:tabular-nums}.soft{fill:#4c5d71}
</style>
<rect width="350" height="350" fill="#f8fafc"/>
<text x="14" y="27" text-anchor="start" class="heading">MTP 从哪一行取下一个候选？</text>
<text x="14" y="51" text-anchor="start" class="sub">请求 R · 已有 8 个有效 KV 位置 · K = 3</text>
<text x="14" y="81" text-anchor="start" class="label">上一轮 Target 输入</text>
<rect x="14.0" y="89" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="52.375" y="109" text-anchor="middle" class="cell">t0</text>
<text x="52.375" y="128" text-anchor="middle" class="sub">位置 8</text>
<rect x="95.75" y="89" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="134.125" y="109" text-anchor="middle" class="cell">d1</text>
<text x="134.125" y="128" text-anchor="middle" class="sub">位置 9</text>
<rect x="177.5" y="89" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="215.875" y="109" text-anchor="middle" class="cell">d2</text>
<text x="215.875" y="128" text-anchor="middle" class="sub">位置 10</text>
<rect x="259.25" y="89" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="297.625" y="109" text-anchor="middle" class="cell">d3</text>
<text x="297.625" y="128" text-anchor="middle" class="sub">位置 11</text>
<path d="M20 146v13m-4 -4 4 4 4 -4" fill="none" stroke="#64748b" stroke-width="1.7"/>
<text x="34" y="159" text-anchor="start" class="field">接受 d1、d2；拒绝 d3，采到 x@11</text>
<text x="14" y="191" text-anchor="start" class="label">MTP 首步沿用四行，用第 2 行出候选</text>
<rect x="14.0" y="200" width="76.75" height="49" rx="5" fill="#e4f4ef" stroke="#7ca99b"/>
<text x="52.375" y="220" text-anchor="middle" class="cell">d1</text>
<text x="52.375" y="239" text-anchor="middle" class="sub">配 H(t0)</text>
<rect x="95.75" y="200" width="76.75" height="49" rx="5" fill="#e4f4ef" stroke="#7ca99b"/>
<text x="134.125" y="220" text-anchor="middle" class="cell">d2</text>
<text x="134.125" y="239" text-anchor="middle" class="sub">配 H(d1)</text>
<rect x="177.5" y="200" width="76.75" height="49" rx="5" fill="#e4f4ef" stroke="#7ca99b"/>
<text x="215.875" y="220" text-anchor="middle" class="cell">x</text>
<text x="215.875" y="239" text-anchor="middle" class="sub">配 H(d2)</text>
<rect x="259.25" y="200" width="76.75" height="49" rx="5" fill="#f3f4f6" stroke="#a5afbb"/>
<text x="297.625" y="220" text-anchor="middle" class="cell">—</text>
<text x="297.625" y="239" text-anchor="middle" class="sub">跳过采样</text>
<text x="14" y="269" text-anchor="start" class="field">行号从 0 起算：(4 行 − 1 个拒绝) − 1 = 2</text>
<path d="M20 278v13m-4 -4 4 4 4 -4" fill="none" stroke="#64748b" stroke-width="1.7"/>
<text x="34" y="292" text-anchor="start" class="field">第 2 行的 logits 给出 e1@12</text>
<rect x="14" y="308" width="322" height="30" rx="5" fill="#fff4e4" stroke="#cda675"/>
<text x="175" y="328" text-anchor="middle" class="field">后续一步：每个请求 1 行，继续预测 e2</text>
</svg>
