<svg xmlns="http://www.w3.org/2000/svg" width="340" height="674" viewBox="0 0 480 952" role="img" aria-labelledby="title desc">
  <title id="title">P 机 A 与 P 机 B 各贡献 Host DRAM 段，共同组成一个逻辑 Store</title>
  <desc id="desc">P 机 A 运行 P0，P 机 B 运行 P1。两台机器各提供一段主机内存，组成同一个 Mooncake Store。图中公共前缀的 KV 保存在 A 段，P1 可以从 B 机读取它。另一台机器运行 D0 和 D1，分别接收 R1 和 R2 的 KV 后继续生成。每个实例使用一块 NPU。D Worker 的 global_segment_size 为 0，不向共享池提供容量。</desc>
  <defs><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
    .title{font-size:30px;font-weight:700}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.note{font-size:22px;fill:#475569}
    .blue{fill:#1d4ed8}.teal{fill:#0f766e}.center{text-anchor:middle}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .machine{fill:#fff;stroke:#64748b;stroke-width:2}.card{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.hbm{fill:#fff;stroke:#1d4ed8;stroke-width:2}.store{fill:#e6f4f1;stroke:#0f766e;stroke-width:2}
  </style></defs>
  <rect width="480" height="952" rx="16" fill="#f8fafc"/>
  <text x="20" y="44" class="title">两台 P 机，共享一个 Store</text>
  <text x="20" y="84" class="body">每个实例使用一块 NPU</text>

  <g id="machine-a">
    <rect x="20" y="114" width="440" height="260" rx="12" class="machine"/>
    <text x="36" y="166" class="heading blue">P 机 A · P0</text>
    <g id="instance-p0">
      <rect x="36" y="184" width="188" height="148" rx="8" class="card"/>
      <text x="130" y="224" class="heading blue center">P0 · NPU</text>
      <rect x="52" y="248" width="156" height="60" rx="6" class="hbm"/>
      <text x="130" y="286" class="body center">本卡 HBM</text>
    </g>
    <g id="store-segment-a">
      <rect x="240" y="184" width="204" height="148" rx="8" class="store"/>
      <text x="342" y="222" class="body teal center">Host DRAM</text>
      <text x="342" y="260" class="body teal center">Store 段 A</text>
      <rect x="256" y="278" width="172" height="36" rx="5" fill="#fff" stroke="#0f766e" stroke-width="2"/>
      <text x="342" y="304" class="note center">公共前缀 KV</text>
    </g>
    <text x="36" y="360" class="note">R1 的前缀写入本机的 A 段</text>
  </g>

  <text x="240" y="398" class="body teal center">A、B 两段组成同一个 Store</text>

  <g id="machine-b" transform="translate(0,-24)">
    <rect x="20" y="444" width="440" height="196" rx="12" class="machine"/>
    <text x="36" y="484" class="heading blue">P 机 B · P1</text>
    <g id="instance-p1">
      <rect x="36" y="502" width="188" height="120" rx="8" class="card"/>
      <text x="130" y="542" class="heading blue center">P1 · NPU</text>
      <rect x="52" y="556" width="156" height="48" rx="6" class="hbm"/>
      <text x="130" y="588" class="body center">本卡 HBM</text>
    </g>
    <g id="store-segment-b">
      <rect x="240" y="502" width="204" height="120" rx="8" class="store"/>
      <text x="342" y="550" class="body teal center">Host DRAM</text>
      <text x="342" y="590" class="body teal center">Store 段 B</text>
    </g>
  </g>

  <g id="decode-machine" transform="translate(0,-82)">
    <rect x="20" y="724" width="440" height="248" rx="12" class="machine"/>
    <text x="36" y="766" class="heading blue">Decode 机 · 接收 KV，继续生成</text>
    <g id="instance-d0">
      <rect x="36" y="786" width="196" height="132" rx="8" class="card"/>
      <text x="134" y="822" class="heading blue center">D0 · NPU</text>
      <rect x="52" y="838" width="164" height="56" rx="6" class="hbm"/>
      <text x="134" y="874" class="body center">本卡 HBM</text>
    </g>
    <g id="instance-d1">
      <rect x="248" y="786" width="196" height="132" rx="8" class="card"/>
      <text x="346" y="822" class="heading blue center">D1 · NPU</text>
      <rect x="264" y="838" width="164" height="56" rx="6" class="hbm"/>
      <text x="346" y="874" class="body center">本卡 HBM</text>
    </g>
    <text x="36" y="952" class="note">D Worker 不向 Store 提供容量</text>
  </g>
  <text x="20" y="926" class="note">Host DRAM 在主机上，HBM 在卡上。</text>
</svg>
