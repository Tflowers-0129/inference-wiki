<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110" role="img" aria-labelledby="title desc">
<title id="title">同样五段工作，融合的边界有多大？</title><desc id="desc">教学边界示意，非实测。dispatch、GMM1、activation、GMM2、combine是五个语义阶段，不代表默认Kernel数。普通MC2的W8A8默认局部融合GMM1、SwiGLU和量化，Dispatch、GMM2、Combine分别调用；自定义Fused-MC2与CANN MegaMoE都可覆盖五个语义阶段，各自内部调度另行核对。融合不取消数据依赖，且不能推出全部通信被隐藏或端到端加速。</desc>
<rect width="1120" height="1110" fill="#f8fafc"/>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .t{fill:#172b4d} .muted{fill:#475569}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<text x="32" y="47" font-size="28" fill="#172b4d" font-weight="700">同样五段工作，融合的边界有多大？</text>
<text x="32" y="80" font-size="18" fill="#475569" font-weight="400">教学示意，非实测 · 每行保持相同的语义顺序；只画实现边界，不用块宽表示时长。</text>
<text x="144.0" y="132" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">dispatch</text>
<text x="144.0" y="163" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">激活到达专家</text>
<text x="352.0" y="132" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">GMM1</text>
<text x="352.0" y="163" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">第一段矩阵计算</text>
<text x="560.0" y="132" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">activation</text>
<text x="560.0" y="163" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">专家中间变换</text>
<text x="768.0" y="132" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">GMM2</text>
<text x="768.0" y="163" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">第二段矩阵计算</text>
<text x="976.0" y="132" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">combine</text>
<text x="976.0" y="163" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">结果返回原行</text>
<rect x="32" y="202" width="1056" height="208" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52" y="238" font-size="23" fill="#172b4d" font-weight="700">① 分离语义阶段：用于识别依赖，不代表默认 Kernel 数</text>
<rect x="56" y="280" width="176" height="82" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="144.0" y="328.0" font-size="21" fill="#6d28d9" font-weight="600" text-anchor="middle">dispatch</text>
<path d="M235 321.0L259 321.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="264" y="280" width="176" height="82" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="352.0" y="328.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">GMM1</text>
<path d="M443 321.0L467 321.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="472" y="280" width="176" height="82" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="560.0" y="328.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">activation</text>
<path d="M651 321.0L675 321.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="280" width="176" height="82" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="768.0" y="328.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">GMM2</text>
<path d="M859 321.0L883 321.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="888" y="280" width="176" height="82" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="976.0" y="328.0" font-size="21" fill="#6d28d9" font-weight="600" text-anchor="middle">combine</text>
<text x="56" y="392" font-size="18" fill="#475569" font-weight="400">dispatch 就绪 → GMM1 → activation → GMM2 → combine；前一生产者为后一消费者供数。</text>
<rect x="32" y="446" width="1056" height="208" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52" y="482" font-size="23" fill="#172b4d" font-weight="700">② MC2 路径：通信与专家 FFN 仍是不同调用边界</text>
<rect x="252" y="500" width="408" height="116" rx="8" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="456" y="519" font-size="16" fill="#0f766e" font-weight="600" text-anchor="middle">W8A8 默认：GMM1 + SwiGLU + Quant</text>
<rect x="48" y="511" width="192" height="108" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="144.0" y="539" font-size="18" fill="#6d28d9" font-weight="600" text-anchor="middle">MC2 算子</text>
<text x="144.0" y="579" font-size="21" fill="#6d28d9" font-weight="700" text-anchor="middle">dispatch</text>
<path d="M235 565.0L259 565.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="264" y="524" width="176" height="82" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="352.0" y="572.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">GMM1</text>
<path d="M443 565.0L467 565.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="472" y="524" width="176" height="82" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="560.0" y="572.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">activation</text>
<path d="M651 565.0L675 565.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="524" width="176" height="82" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="768.0" y="572.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">GMM2</text>
<path d="M859 565.0L883 565.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="880" y="511" width="192" height="108" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="976.0" y="539" font-size="18" fill="#6d28d9" font-weight="600" text-anchor="middle">MC2 算子</text>
<text x="976.0" y="579" font-size="21" fill="#6d28d9" font-weight="700" text-anchor="middle">combine</text>
<text x="56" y="636" font-size="18" fill="#475569" font-weight="400">虚线框是默认局部融合；Dispatch、GMM2、Combine 仍分别调用。</text>
<rect x="32" y="714" width="1056" height="208" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52" y="750" font-size="23" fill="#172b4d" font-weight="700">③ Fused-MC2：整体融合边界覆盖交换与专家 FFN</text>
<rect x="46" y="770" width="1028" height="128" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2.2"/>
<text x="68" y="797" font-size="18" fill="#0f766e" font-weight="600">全链路融合算子边界</text>
<rect x="56" y="814" width="176" height="66" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="144.0" y="854.0" font-size="21" fill="#6d28d9" font-weight="600" text-anchor="middle">dispatch</text>
<path d="M235 847.0L259 847.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="264" y="814" width="176" height="66" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="352.0" y="854.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">GMM1</text>
<path d="M443 847.0L467 847.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="472" y="814" width="176" height="66" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="560.0" y="854.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">activation</text>
<path d="M651 847.0L675 847.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="814" width="176" height="66" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="768.0" y="854.0" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="middle">GMM2</text>
<path d="M859 847.0L883 847.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="888" y="814" width="176" height="66" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="976.0" y="854.0" font-size="21" fill="#6d28d9" font-weight="600" text-anchor="middle">combine</text>
<rect x="32" y="962" width="1056" height="112" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="52" y="998" font-size="22" fill="#b45309" font-weight="700">更大的融合边界，提供更细的分块协作空间；依赖仍然存在。</text>
<text x="52" y="1034" font-size="19" fill="#172b4d" font-weight="400">下一张泳道按专家与激活分组追依赖：输入就绪才能算，结果就绪才能回传。</text>
<text x="52" y="1063" font-size="18" fill="#475569" font-weight="400">“整体融合”不能直接换算为通信全隐藏、固定加速比或服务端收益。</text>
</svg>
