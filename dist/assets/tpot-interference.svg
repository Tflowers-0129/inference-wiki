<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">混部轮次和首 token 后的输出间隔</title><desc id="desc">示意时间轴中，目标请求首 token 前是 TTFT，首 token 后的 D-only 轮次较短，含其他请求 Prefill 的 P+D 轮次较长，目标 Decode 输出间隔随之延长。Decode 优先是预算分配优先，非独占执行。100毫秒额外停顿除以63和1023个间隔，分别约为1.59与0.098毫秒。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#60728d" stroke-width="1.1"/></marker><marker id="amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#d98b21" stroke-width="1.1"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}*{box-sizing:border-box}</style></defs><rect width="1120" height="650" rx="20" fill="#fbfaf7"/><text x="32" y="42" font-size="28" fill="#172b4d" font-weight="700">当混部轮次更长时，D 的输出间隔也被拉长</text><text x="32" y="72" font-size="14" fill="#60728d" font-weight="400">示意：目标请求进入 Decode 后每轮生成 1 token；P 表示同批中其他请求的 Prefill。</text><rect x="150" y="100" width="220" height="271" rx="10" fill="#edf0f4" /><text x="260" y="127" font-size="17" fill="#60728d" font-weight="700" text-anchor="middle">TTFT</text><text x="260" y="148" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">请求到达 → 首 token</text><text x="150" y="176" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">请求到达</text><text x="1010" y="176" font-size="12" fill="#60728d" font-weight="400" text-anchor="end">时间 →</text><rect x="150" y="190" width="220" height="60" rx="0" fill="#dce3eb" stroke="#fff" /><text x="260.0" y="226" font-size="18" fill="#60728d" font-weight="650" text-anchor="middle">排队 + Prefill</text><rect x="370" y="190" width="100" height="60" rx="0" fill="#e1f3ef" stroke="#fff" /><text x="420.0" y="226" font-size="18" fill="#159c91" font-weight="650" text-anchor="middle">D</text><rect x="470" y="190" width="220" height="60" rx="0" fill="#e6effe" stroke="#fff" /><text x="580.0" y="226" font-size="18" fill="#2473ec" font-weight="650" text-anchor="middle">P + D</text><rect x="690" y="190" width="100" height="60" rx="0" fill="#e1f3ef" stroke="#fff" /><text x="740.0" y="226" font-size="18" fill="#159c91" font-weight="650" text-anchor="middle">D</text><rect x="790" y="190" width="220" height="60" rx="0" fill="#e6effe" stroke="#fff" /><text x="900.0" y="226" font-size="18" fill="#2473ec" font-weight="650" text-anchor="middle">P + D</text><path d="M370 250V305" fill="none" stroke="#c5cedb" stroke-width="1" stroke-dasharray="3 4"/><circle cx="370" cy="290" r="6" fill="#159c91"/><text x="370" y="317" font-size="14" fill="#159c91" font-weight="600" text-anchor="middle">t1</text><path d="M470 250V305" fill="none" stroke="#c5cedb" stroke-width="1" stroke-dasharray="3 4"/><circle cx="470" cy="290" r="6" fill="#159c91"/><text x="470" y="317" font-size="14" fill="#159c91" font-weight="600" text-anchor="middle">t2</text><path d="M690 250V305" fill="none" stroke="#c5cedb" stroke-width="1" stroke-dasharray="3 4"/><circle cx="690" cy="290" r="6" fill="#159c91"/><text x="690" y="317" font-size="14" fill="#159c91" font-weight="600" text-anchor="middle">t3</text><path d="M790 250V305" fill="none" stroke="#c5cedb" stroke-width="1" stroke-dasharray="3 4"/><circle cx="790" cy="290" r="6" fill="#159c91"/><text x="790" y="317" font-size="14" fill="#159c91" font-weight="600" text-anchor="middle">t4</text><path d="M1010 250V305" fill="none" stroke="#c5cedb" stroke-width="1" stroke-dasharray="3 4"/><circle cx="1010" cy="290" r="6" fill="#159c91"/><text x="1010" y="317" font-size="14" fill="#159c91" font-weight="600" text-anchor="middle">t5</text><text x="32" y="220" font-size="14" fill="#60728d" font-weight="400">调度轮次</text><text x="32" y="294" font-size="14" fill="#60728d" font-weight="400">目标请求输出</text><path d="M150 290H1028" fill="none" stroke="#bbc8d8" stroke-width="1.3" marker-end="url(#arrow)"/><circle cx="370" cy="290" r="6" fill="#159c91"/><circle cx="470" cy="290" r="6" fill="#159c91"/><circle cx="690" cy="290" r="6" fill="#159c91"/><circle cx="790" cy="290" r="6" fill="#159c91"/><circle cx="1010" cy="290" r="6" fill="#159c91"/><text x="420" y="271" font-size="12" fill="#159c91" font-weight="400" text-anchor="middle">较短</text><text x="580" y="271" font-size="12" fill="#2473ec" font-weight="400" text-anchor="middle">含 P 的轮次较长</text><text x="740" y="271" font-size="12" fill="#159c91" font-weight="400" text-anchor="middle">较短</text><text x="900" y="271" font-size="12" fill="#2473ec" font-weight="400" text-anchor="middle">输出间隔随之变长</text><path d="M370 330V343H1010V330" fill="none" stroke="#159c91" stroke-width="1.7" /><text x="690" y="366" font-size="15" fill="#159c91" font-weight="650" text-anchor="middle">TPOT 只统计首 token 之后的间隔</text><text x="32" y="401" font-size="15" fill="#172b4d" font-weight="650">Decode 优先：先分配 D 的 token 预算，再用剩余预算安排 P；同一轮仍可包含 P 和 D。</text><text x="32" y="425" font-size="12" fill="#60728d" font-weight="400">轮次宽度仅表达长短关系，未使用实测时间；这里不表示 P、D 必须串行执行。</text><path d="M32 446H1088" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="32" y="476" font-size="19" fill="#172b4d" font-weight="700">同一次 100 ms 额外停顿，对平均间隔的摊销</text><text x="32" y="499" font-size="14" fill="#60728d" font-weight="400">TPOT = (末 token 时间 − 首 token 时间) ÷ (输出 token 数 − 1)</text><text x="52" y="542" font-size="16" fill="#172b4d" font-weight="600">64 个输出 token → 63 个间隔</text><text x="52" y="578" font-size="26" fill="#159c91" font-weight="700">100 ms ÷ 63 ≈ 1.59 ms</text><path d="M555 519V588" fill="none" stroke="#dce3eb" stroke-width="1" /><text x="593" y="542" font-size="16" fill="#172b4d" font-weight="600">1024 个输出 token → 1023 个间隔</text><text x="593" y="578" font-size="26" fill="#159c91" font-weight="700">100 ms ÷ 1023 ≈ 0.098 ms</text><text x="32" y="622" font-size="12" fill="#60728d" font-weight="400">纯算术示例：假设这 100 ms 停顿完整落在首 token 之后；不是实验数据或性能收益承诺。</text></svg>