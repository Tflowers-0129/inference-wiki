<svg xmlns="http://www.w3.org/2000/svg" width="960" height="445" viewBox="0 0 960 445" role="img" aria-labelledby="title desc"><title id="title">Tiling 把一次 Attention 组织成可执行的工作</title><desc id="desc">先决定分块、循环边界与工作分配，再让 kernel 按计划处理张量。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:21px;font-weight:600}.head{font-size:16px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}.blue{font-size:16px;fill:#2763b0}.teal{font-size:16px;fill:#157b78}.orange{font-size:16px;fill:#a96524}</style></defs><rect width="960" height="445" fill="#fff"/><text x="32" y="38" class="title">Tiling 把一次 Attention 组织成可执行的工作</text><text x="32" y="65" class="small">先决定分块、循环边界与工作分配，再让 kernel 按计划处理张量。</text><text x="32" y="109" class="head">无因果掩码的教学配置：Q=4，KV=130；query tile=2，KV tile=64</text><text x="192" y="147" class="small">位置 0–63：64 行</text><text x="436" y="147" class="small">位置 64–127：64 行</text><text x="680" y="147" class="small">位置 128–129：2 行</text><text x="32" y="201" class="body">query 0、1</text><rect x="192" y="164" width="236" height="54" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="208" y="198" class="body">第 1 段</text><rect x="436" y="164" width="236" height="54" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="452" y="198" class="body">第 2 段</text><rect x="680" y="164" width="204" height="54" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="696" y="198" class="body">尾段</text><path d="M428 191 L436 191" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M672 191 L680 191" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="275" class="body">query 2、3</text><rect x="192" y="238" width="236" height="54" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="208" y="272" class="body">第 1 段</text><rect x="436" y="238" width="236" height="54" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="452" y="272" class="body">第 2 段</text><rect x="680" y="238" width="204" height="54" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="696" y="272" class="body">尾段</text><path d="M428 265 L436 265" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M672 265 L680 265" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="192" y="332" class="body">每组 query 逐段读取 KV，累计最大值、归一化分母和加权 V。</text><path d="M32 353 H928" fill="none" stroke="#607086"/><text x="32" y="384" class="orange">长度变为 129 → 尾段有效数由 2 变为 1；相同容量不保证相同计划仍可使用。</text><text x="32" y="417" class="small">实际因果 Attention 另加 mask；物理页由块表寻址，计算 tile 由算子决定。</text></svg>