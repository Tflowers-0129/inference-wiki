<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">Block Table 与 slot mapping 的不同用途</title><desc id="desc">假设每个物理块保存四个 token。请求 A 的三个逻辑块指向物理块 7、2、9。位置 9 映射到逻辑块 2、偏移 1，最终是物理块 9 的偏移 1。两个请求可共享相同前缀块，同时保留各自独立后缀。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="900" rx="20" fill="#f8fafc"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700">连续的 token 位置，怎样找到分散的物理 KV？</text>
<text x="32" y="80" font-size="17" fill="#475569" font-weight="400">紧接下轮查位置 9；每块 B = 4 个 token，所有块号与偏移从 0 开始。</text>
<rect x="32" y="104" width="1056" height="267" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="139" font-size="21" fill="#172b4d" font-weight="700">请求 A 的 Block Table</text>
<text x="678" y="139" font-size="20" fill="#172b4d" font-weight="700">物理 KV 块：每行有 4 个槽位</text>
<rect x="52" y="161" width="306" height="47" rx="7" fill="#fff" stroke="#cbd5e1"/>
<text x="68" y="192" font-size="19" fill="#172b4d" font-weight="600">逻辑块 0</text>
<text x="240" y="192" font-size="20" fill="#1d4ed8" font-weight="700">→ 7</text>
<path d="M359 185L646 185" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<text x="676" y="192" font-size="19" fill="#1d4ed8" font-weight="650">物理 7</text>
<rect x="783" y="161" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="811" y="192" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">0</text>
<rect x="848" y="161" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="876" y="192" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">1</text>
<rect x="913" y="161" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="941" y="192" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">2</text>
<rect x="978" y="161" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1006" y="192" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">3</text>
<rect x="52" y="223" width="306" height="47" rx="7" fill="#fff" stroke="#cbd5e1"/>
<text x="68" y="254" font-size="19" fill="#172b4d" font-weight="600">逻辑块 1</text>
<text x="240" y="254" font-size="20" fill="#1d4ed8" font-weight="700">→ 2</text>
<path d="M359 247L646 247" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<text x="676" y="254" font-size="19" fill="#1d4ed8" font-weight="650">物理 2</text>
<rect x="783" y="223" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="811" y="254" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">0</text>
<rect x="848" y="223" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="876" y="254" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">1</text>
<rect x="913" y="223" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="941" y="254" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">2</text>
<rect x="978" y="223" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1006" y="254" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">3</text>
<rect x="52" y="285" width="306" height="47" rx="7" fill="#fff" stroke="#cbd5e1"/>
<text x="68" y="316" font-size="19" fill="#172b4d" font-weight="600">逻辑块 2</text>
<text x="240" y="316" font-size="20" fill="#1d4ed8" font-weight="700">→ 9</text>
<path d="M359 309L646 309" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="676" y="316" font-size="19" fill="#0f766e" font-weight="650">物理 9</text>
<rect x="783" y="285" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="811" y="316" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">0</text>
<rect x="848" y="285" width="57" height="47" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
<text x="876" y="316" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">1</text>
<rect x="913" y="285" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="941" y="316" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">2</text>
<rect x="978" y="285" width="57" height="47" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1006" y="316" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">3</text>
<text x="52" y="353" font-size="17" fill="#475569" font-weight="400">Block Table 描述块的地址映射；它本身不存放 K/V 张量。</text>
<rect x="32" y="391" width="1056" height="114" rx="12" fill="#ecfdf5" stroke="#99c9bf"/>
<text x="52" y="426" font-size="21" fill="#0f766e" font-weight="700">查找 token 位置 9</text>
<text x="52" y="464" font-size="20" fill="#172b4d" font-weight="600">9 ÷ 4 → 逻辑块 2，偏移 1</text>
<path d="M455 457L536 457" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="562" y="448" font-size="20" fill="#0f766e" font-weight="700">Block Table[2] = 9</text>
<text x="562" y="481" font-size="20" fill="#172b4d" font-weight="600">最终位置：物理块 9，块内偏移 1</text>
<rect x="32" y="525" width="1056" height="193" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="561" font-size="21" fill="#172b4d" font-weight="700">共享相同前缀，不要求后缀相同</text>
<rect x="52" y="581" width="290" height="75" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="72" y="611" font-size="20" fill="#1d4ed8" font-weight="700">请求 A：[7, 2, 9]</text>
<text x="72" y="640" font-size="17" fill="#172b4d" font-weight="400">后缀使用物理块 2、9</text>
<rect x="778" y="581" width="290" height="75" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="798" y="611" font-size="20" fill="#1d4ed8" font-weight="700">请求 S：[7, 5, 11]</text>
<text x="798" y="640" font-size="17" fill="#172b4d" font-weight="400">后缀使用物理块 5、11</text>
<rect x="440" y="581" width="240" height="75" rx="12" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="560" y="611" font-size="19" fill="#0f766e" font-weight="700" text-anchor="middle">共同指向物理块 7</text>
<text x="560" y="640" font-size="17" fill="#172b4d" font-weight="500" text-anchor="middle">共享完整前缀块</text>
<path d="M342 613L435 613" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<path d="M778 613L685 613" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="52" y="694" font-size="17" fill="#475569" font-weight="400">这里两条请求的前 4 个 token 相同；各自后缀分开存放，新增内容不会覆盖共享前缀。</text>
<rect x="32" y="739" width="516" height="106" rx="12" fill="#ecfdf5" stroke="#99c9bf"/>
<text x="52" y="773" font-size="20" fill="#0f766e" font-weight="700">读上下文：Block Table</text>
<text x="52" y="807" font-size="18" fill="#172b4d" font-weight="400">Attention 用块表找到一段历史 K/V。</text>
<rect x="572" y="739" width="516" height="106" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="592" y="773" font-size="20" fill="#1d4ed8" font-weight="700">写当前 KV：slot_mapping</text>
<text x="592" y="807" font-size="18" fill="#172b4d" font-weight="400">位置 9 → 物理块 9 / 偏移 1。</text>
<text x="32" y="880" font-size="16" fill="#475569" font-weight="400">若后端按物理 token 槽位编号，此例为 9 × 4 + 1 = 37；实际字段格式由后端决定。</text>
</svg>
