<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">连续批处理前三轮的真比例 token 预算</title><desc id="desc">8192-token 预算前三轮。第一轮 R1、R2 各4096；第二轮 Decode 2、R3 4096、R4 4094；第三轮 Decode 3、R4 尾2、R5 4096、R6 4091。R4 跨轮续接，R6 还剩5。所有条长均按真实 token 比例。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#60728d" stroke-width="1.1"/></marker><marker id="amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#d98b21" stroke-width="1.1"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}*{box-sizing:border-box}</style></defs><rect width="1120" height="620" rx="20" fill="#fbfaf7"/><text x="32" y="42" font-size="28" fill="#172b4d" font-weight="700">前三轮：每次先扣 Decode，再装入 Prefill</text><text x="32" y="72" font-size="14" fill="#60728d" font-weight="400">示例：每个请求输入 4096 tokens；每轮最多调度 8192 tokens；活跃 Decode 请求每轮计 1 token。</text><rect x="32" y="94" width="10" height="10" rx="2" fill="#159c91" /><text x="49" y="104" font-size="12" fill="#60728d" font-weight="400">Decode</text><rect x="130" y="94" width="10" height="10" rx="2" fill="#2473ec" /><text x="147" y="104" font-size="12" fill="#60728d" font-weight="400">Prefill</text><rect x="222" y="94" width="10" height="10" rx="2" fill="#d98b21" /><text x="239" y="104" font-size="12" fill="#60728d" font-weight="400">R4 的两段 Prefill</text><text x="1060" y="104" font-size="12" fill="#60728d" font-weight="400" text-anchor="end">长度单位：token</text><path d="M146 144H966" fill="none" stroke="#c4cedb" stroke-width="1" /><path d="M146.0 138V449" fill="none" stroke="#e0e6ee" stroke-width="1" stroke-dasharray="3 5"/><text x="146.0" y="133" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">0</text><path d="M351.0 138V449" fill="none" stroke="#e0e6ee" stroke-width="1" stroke-dasharray="3 5"/><text x="351.0" y="133" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">2048</text><path d="M556.0 138V449" fill="none" stroke="#e0e6ee" stroke-width="1" stroke-dasharray="3 5"/><text x="556.0" y="133" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">4096</text><path d="M761.0 138V449" fill="none" stroke="#e0e6ee" stroke-width="1" stroke-dasharray="3 5"/><text x="761.0" y="133" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">6144</text><path d="M966.0 138V449" fill="none" stroke="#e0e6ee" stroke-width="1" stroke-dasharray="3 5"/><text x="966.0" y="133" font-size="12" fill="#60728d" font-weight="400" text-anchor="middle">8192</text><text x="32" y="206" font-size="19" fill="#172b4d" font-weight="700">Step 1</text><rect x="146" y="177" width="820" height="46" rx="0" fill="#edf1f6" /><rect x="146" y="177" width="410.0" height="46" rx="0" fill="#2473ec" /><text x="351.0" y="206" font-size="17" fill="#fff" font-weight="650" text-anchor="middle">R1  ·  4096</text><rect x="556.0" y="177" width="410.0" height="46" rx="0" fill="#89b2f4" /><text x="761.0" y="206" font-size="17" fill="#172b4d" font-weight="650" text-anchor="middle">R2  ·  4096</text><text x="991" y="206" font-size="17" fill="#172b4d" font-weight="650">8192</text><text x="1043" y="206" font-size="12" fill="#60728d" font-weight="400">/ 8192</text><text x="32" y="316" font-size="19" fill="#172b4d" font-weight="700">Step 2</text><rect x="146" y="287" width="820" height="46" rx="0" fill="#edf1f6" /><rect x="146" y="287" width="0.2001953125" height="46" rx="0" fill="#159c91" /><rect x="146.2001953125" y="287" width="410.0" height="46" rx="0" fill="#2473ec" /><text x="351.2001953125" y="316" font-size="17" fill="#fff" font-weight="650" text-anchor="middle">R3  ·  4096</text><rect x="556.2001953125" y="287" width="409.7998046875" height="46" rx="0" fill="#d98b21" /><text x="761.10009765625" y="316" font-size="17" fill="#fff" font-weight="650" text-anchor="middle">R4  ·  4094</text><text x="991" y="316" font-size="17" fill="#172b4d" font-weight="650">8192</text><text x="1043" y="316" font-size="12" fill="#60728d" font-weight="400">/ 8192</text><text x="32" y="426" font-size="19" fill="#172b4d" font-weight="700">Step 3</text><rect x="146" y="397" width="820" height="46" rx="0" fill="#edf1f6" /><rect x="146" y="397" width="0.30029296875" height="46" rx="0" fill="#159c91" /><rect x="146.30029296875" y="397" width="0.2001953125" height="46" rx="0" fill="#d98b21" /><rect x="146.50048828125" y="397" width="410.0" height="46" rx="0" fill="#2473ec" /><text x="351.50048828125" y="426" font-size="17" fill="#fff" font-weight="650" text-anchor="middle">R5  ·  4096</text><rect x="556.50048828125" y="397" width="409.49951171875" height="46" rx="0" fill="#89b2f4" /><text x="761.250244140625" y="426" font-size="17" fill="#172b4d" font-weight="650" text-anchor="middle">R6  ·  4091</text><text x="991" y="426" font-size="17" fill="#172b4d" font-weight="650">8192</text><text x="1043" y="426" font-size="12" fill="#60728d" font-weight="400">/ 8192</text><text x="146" y="246" font-size="14" fill="#60728d" font-weight="400">账本：P(R1) 4096  +  P(R2) 4096  =  8192</text><text x="146" y="356" font-size="14" fill="#60728d" font-weight="400">账本：D(R1,R2) 2  +  P(R3) 4096  +  P(R4) 4094  =  8192</text><text x="146" y="466" font-size="14" fill="#60728d" font-weight="400">账本：D(R1,R2,R3) 3  +  P(R4 尾) 2  +  P(R5) 4096  +  P(R6) 4091  =  8192</text><path d="M761 333V377H146.4V393" fill="none" stroke="#d98b21" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#amber)"/><text x="773" y="379" font-size="13" fill="#92400e" font-weight="600">R4：4094 + 2 = 4096</text><text x="966" y="491" font-size="12" fill="#60728d" font-weight="400" text-anchor="end">R6 尚余 5 tokens，继续留待下一轮</text><rect x="32" y="516" width="1056" height="78" rx="12" fill="#edf2f8" /><text x="52" y="545" font-size="16" fill="#172b4d" font-weight="650">条长表示 token 预算，不表示执行时长。三轮都用满 8192-token 预算。</text><text x="52" y="574" font-size="14" fill="#60728d" font-weight="400">D=2、D=3 与 R4 尾块=2 均按真比例绘制，宽度不足 1 px；微小段的精确值见各轮账本。</text></svg>