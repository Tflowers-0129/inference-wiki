<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">一轮混合批次怎样构造输入和 Attention 元数据</title><desc id="desc">构造示例：A、B 为普通解码，各计算一个 token；C 为分块 Prefill，计算三个 token。展示打包输入、位置、查询边界和计算后序列长度。Block Table 用于找到上下文，slot mapping 用于写入当前 KV。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="900" rx="20" fill="#f8fafc"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700">排好本轮 token，还要保留每条请求的边界</text>
<text x="32" y="80" font-size="18" fill="#475569" font-weight="400">构造示例：位置从 0 开始；这里的 seq_lens 按“本轮计算后”定义。</text>
<rect x="32" y="104" width="1056" height="196" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="136" font-size="17" fill="#475569" font-weight="600">请求 / 阶段</text>
<text x="179" y="136" font-size="17" fill="#475569" font-weight="600">已有上下文 token</text>
<text x="400" y="136" font-size="17" fill="#475569" font-weight="600">本轮 query 数</text>
<text x="624" y="136" font-size="17" fill="#475569" font-weight="600">本轮位置</text>
<text x="866" y="136" font-size="17" fill="#475569" font-weight="600">计算后长度</text>
<path d="M48 149L1072 149" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="182" font-size="20" fill="#0f766e" font-weight="700">A · D</text>
<text x="179" y="182" font-size="20" fill="#172b4d" font-weight="400">8</text>
<text x="400" y="182" font-size="20" fill="#172b4d" font-weight="400">1</text>
<text x="624" y="182" font-size="20" fill="#172b4d" font-weight="400">[8]</text>
<text x="866" y="182" font-size="20" fill="#172b4d" font-weight="400">9</text>
<text x="52" y="230" font-size="20" fill="#0f766e" font-weight="700">B · D</text>
<text x="179" y="230" font-size="20" fill="#172b4d" font-weight="400">5</text>
<text x="400" y="230" font-size="20" fill="#172b4d" font-weight="400">1</text>
<text x="624" y="230" font-size="20" fill="#172b4d" font-weight="400">[5]</text>
<text x="866" y="230" font-size="20" fill="#172b4d" font-weight="400">6</text>
<text x="52" y="278" font-size="20" fill="#1d4ed8" font-weight="700">C · P</text>
<text x="179" y="278" font-size="20" fill="#172b4d" font-weight="400">2</text>
<text x="400" y="278" font-size="20" fill="#172b4d" font-weight="400">3</text>
<text x="624" y="278" font-size="20" fill="#172b4d" font-weight="400">[2, 3, 4]</text>
<text x="866" y="278" font-size="20" fill="#172b4d" font-weight="400">5</text>
<rect x="32" y="320" width="1056" height="172" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="352" font-size="20" fill="#172b4d" font-weight="700">打包输入：把 5 个本轮 token 连起来，历史 token 留在 KV Cache 中</text>
<rect x="236" y="372" width="138" height="54" rx="8" fill="#e6f4f1" stroke="#0f766e"/>
<text x="305" y="406" font-size="23" fill="#0f766e" font-weight="650" text-anchor="middle">a8</text>
<text x="305" y="461" font-size="20" fill="#172b4d" font-weight="500" text-anchor="middle">8</text>
<rect x="390" y="372" width="138" height="54" rx="8" fill="#e6f4f1" stroke="#0f766e"/>
<text x="459" y="406" font-size="23" fill="#0f766e" font-weight="650" text-anchor="middle">b5</text>
<text x="459" y="461" font-size="20" fill="#172b4d" font-weight="500" text-anchor="middle">5</text>
<rect x="544" y="372" width="138" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="613" y="406" font-size="23" fill="#1d4ed8" font-weight="650" text-anchor="middle">c2</text>
<text x="613" y="461" font-size="20" fill="#172b4d" font-weight="500" text-anchor="middle">2</text>
<rect x="698" y="372" width="138" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="767" y="406" font-size="23" fill="#1d4ed8" font-weight="650" text-anchor="middle">c3</text>
<text x="767" y="461" font-size="20" fill="#172b4d" font-weight="500" text-anchor="middle">3</text>
<rect x="852" y="372" width="138" height="54" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="921" y="406" font-size="23" fill="#1d4ed8" font-weight="650" text-anchor="middle">c4</text>
<text x="921" y="461" font-size="20" fill="#172b4d" font-weight="500" text-anchor="middle">4</text>
<text x="52" y="406" font-size="19" fill="#475569" font-weight="600">input_ids</text>
<text x="52" y="461" font-size="19" fill="#475569" font-weight="600">positions</text>
<rect x="32" y="512" width="650" height="190" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="546" font-size="21" fill="#172b4d" font-weight="700">请求边界与长度</text>
<text x="52" y="587" font-size="19" fill="#475569" font-weight="600">query lengths</text>
<text x="333" y="587" font-size="21" fill="#172b4d" font-weight="600">[1, 1, 3]</text>
<text x="52" y="628" font-size="19" fill="#475569" font-weight="600">query_start_loc</text>
<text x="333" y="628" font-size="21" fill="#172b4d" font-weight="600">[0, 1, 2, 5]</text>
<text x="52" y="669" font-size="19" fill="#475569" font-weight="600">seq_lens</text>
<text x="333" y="669" font-size="21" fill="#172b4d" font-weight="600">[9, 6, 5]</text>
<rect x="706" y="512" width="382" height="190" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="726" y="546" font-size="21" fill="#1d4ed8" font-weight="700">边界不能丢</text>
<text x="726" y="580" font-size="17" fill="#172b4d" font-weight="400">A 占 [0, 1)，B 占 [1, 2)</text>
<text x="726" y="611" font-size="17" fill="#172b4d" font-weight="400">C 占 [2, 5)，共 3 个 query</text>
<text x="726" y="650" font-size="17" fill="#172b4d" font-weight="400">query 长度 ≠ 可见上下文长度</text>
<text x="726" y="681" font-size="17" fill="#172b4d" font-weight="400">每条请求有自己的因果边界</text>
<rect x="32" y="724" width="516" height="100" rx="12" fill="#ecfdf5" stroke="#99c9bf"/>
<text x="52" y="757" font-size="20" fill="#0f766e" font-weight="700">Block Table → 找到上下文 KV</text>
<text x="52" y="791" font-size="17" fill="#172b4d" font-weight="400">逻辑块号映射到物理块号，供 Attention 访问。</text>
<rect x="572" y="724" width="516" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="592" y="757" font-size="20" fill="#1d4ed8" font-weight="700">slot_mapping → 写入本轮 KV</text>
<text x="592" y="788" font-size="17" fill="#172b4d" font-weight="400">逐 token 指向当前 K/V 的目标存储槽位。</text>
<text x="592" y="815" font-size="16" fill="#475569" font-weight="400">配套块表示例：[36, 25, 34, 35, 12]</text>
<text x="32" y="856" font-size="17" fill="#475569" font-weight="400">图中字段用于解释信息含义；实际字段名、布局和构造顺序由执行后端决定。</text>
<text x="32" y="884" font-size="16" fill="#475569" font-weight="400">a8 / b5 / c2 是 token 的示意名称，不是实际词表 ID。</text>
</svg>
