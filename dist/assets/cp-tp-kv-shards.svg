<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1020" viewBox="0 0 1120 1020" role="img" aria-labelledby="title desc">
<title id="title">TP 按 KV head 划分；DCP 再沿序列划分</title>
<desc id="desc">教学拓扑，GQA有16个query heads、2个KV heads、TP4。rank0的初始Q heads为0到3，rank1为4到7，rank2为8到11，rank3为12到15。TP4时rank0和rank1各保存KV head0的全序列，rank2和rank3各保存KV head1的全序列。加入DCP2，组0、1和组2、3分别按位置奇偶切分同一KV head，每rank的本地KV位置数从8变为4，不增加设备。query还需组内交换，局部Attention结果需要归并。图表示数据归属，不是profiling或执行时间线。</desc>
