<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc">
<title id="title">局部 Attention 输出，为什么不能直接平均？</title>
<desc id="desc">教学算例，同一个query和head。分片0的scores是0、0，values是0、2，归一化分母Z0为2，局部输出O0为1，LSE为ln2。分片1的scores是ln3、ln3，values是10、14，Z1为6，O1为12，LSE为ln6。稳定归并以ln6为最大LSE，得到未归一化权重1/3和1，归一化权重1/4和3/4，最终输出9.25。直接平均局部输出得到6.5，是错误结果。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1120" height="810" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">局部 Attention 输出，为什么不能直接平均？</text>
<text x="32" y="82" font-size="19" fill="#475569" font-weight="400" text-anchor="start">教学算例 · 同一 query / head，两片 KV；LSE 记录各片 softmax 的归一化规模</text>
<rect x="32" y="112" width="480" height="264" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="52" y="150" font-size="23" fill="#1d4ed8" font-weight="700" text-anchor="start">KV 分片 0</text>
<text x="52" y="192" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">scores = [0, 0]</text>
<text x="52" y="229" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">values = [0, 2]</text>
<text x="52" y="266" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">exp(scores) = [1, 1]</text>
<text x="52" y="303" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="start">Z₀ = 2，L₀ = ln 2</text>
<text x="52" y="340" font-size="21" fill="#1d4ed8" font-weight="600" text-anchor="start">O₀ = (0 + 2) / 2 = 1</text>
<rect x="608" y="112" width="480" height="264" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="628" y="150" font-size="23" fill="#0f766e" font-weight="700" text-anchor="start">KV 分片 1</text>
<text x="628" y="192" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">scores = [ln 3, ln 3]</text>
<text x="628" y="229" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">values = [10, 14]</text>
<text x="628" y="266" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">exp(scores) = [3, 3]</text>
<text x="628" y="303" font-size="21" fill="#0f766e" font-weight="600" text-anchor="start">Z₁ = 6，L₁ = ln 6</text>
<text x="628" y="340" font-size="21" fill="#0f766e" font-weight="600" text-anchor="start">O₁ = (3×10 + 3×14) / 6 = 12</text>
<path d="M272 376V404H478V440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M848 376V404H642V440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="318" y="398" font-size="19" fill="#1d4ed8" font-weight="600" text-anchor="start">O₀、L₀</text>
<text x="718" y="398" font-size="19" fill="#0f766e" font-weight="600" text-anchor="start">O₁、L₁</text>
<rect x="168" y="452" width="784" height="194" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="192" y="488" font-size="22" fill="#172b4d" font-weight="600" text-anchor="start">稳定归并：m = max(L₀, L₁) = ln 6</text>
<text x="192" y="526" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">w₀ = exp(L₀ − m) = 1/3，w₁ = exp(L₁ − m) = 1</text>
<text x="192" y="564" font-size="22" fill="#172b4d" font-weight="600" text-anchor="start">归一化权重：[1/4, 3/4]</text>
<text x="192" y="612" font-size="27" fill="#1d4ed8" font-weight="700" text-anchor="start">O = (1/4)×1 + (3/4)×12 = 9.25</text>
<text x="32" y="696" font-size="22" fill="#0f766e" font-weight="600" text-anchor="start">四项一起算：(0 + 2 + 3×10 + 3×14) / (1+1+3+3) = 9.25</text>
<rect x="32" y="722" width="1056" height="54" rx="7" fill="#fff7ed" stroke="#d7ae63" stroke-width="1.5"/>
<text x="52" y="758" font-size="22" fill="#92400e" font-weight="600" text-anchor="start">错误做法：直接平均局部输出，(1 + 12) / 2 = 6.5。</text>
</svg>
