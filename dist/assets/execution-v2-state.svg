<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" aria-labelledby="title desc"><title id="title">采样结果怎样接回下一轮</title><desc id="desc">同一请求 A：计算过的位置、有效 KV 范围与已确认输出分别计数。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:21px;font-weight:600}.head{font-size:16px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}.blue{font-size:16px;fill:#2763b0}.teal{font-size:16px;fill:#157b78}.orange{font-size:16px;fill:#a96524}</style></defs><rect width="960" height="495" fill="#fff"/><text x="32" y="38" class="title">采样结果怎样接回下一轮</text><text x="32" y="65" class="small">同一请求 A：计算过的位置、有效 KV 范围与已确认输出分别计数。</text><text x="32" y="108" class="head">Target 验证本轮</text><text x="486" y="108" class="head">V2 更新持久状态槽 6</text><rect x="32" y="126" width="382" height="164" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="50" y="153" class="body">旧 KV：8 个位置</text><text x="50" y="185" class="mono">输入 [a8,d1,d2,d3]</text><text x="50" y="217" class="body">接受 d1、d2；第三处采样 x</text><text x="50" y="260" class="mono">num_sampled=3；num_rejected=1</text><path d="M414 207 L468 207" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="486" y="126" width="442" height="164" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="504" y="153" class="mono">post_update(idx_mapping, …)</text><text x="504" y="191" class="mono">num_computed_tokens = 8 + 4 − 1 = 11</text><text x="504" y="229" class="mono">last_sampled_tokens = x</text><text x="504" y="266" class="small">有效 KV 到位置 10；x@11 尚无自身 KV</text><path d="M708 290 V322 H238 V344" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="32" y="346" width="896" height="87" rx="6" fill="#fff4e7" stroke="#d8e1eb"/><text x="50" y="374" class="head">下一轮 K=1</text><text x="220" y="374" class="mono">query=[x,e1]    positions=[11,12]    seq_len=13</text><text x="50" y="408" class="body">旧候选 d3@11 的 KV 不再有效；下一轮由 x@11 覆写，位置 12 使用新块。</text><text x="32" y="469" class="small">当前批次重排时，idx_mapping 重新指向持久槽；不会把临时长度 12 当成下一轮起点。</text></svg>