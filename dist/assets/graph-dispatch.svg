<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
  <title id="title">每轮选图：看形状，不看 Decode 比例</title>
  <desc id="desc">Scheduler 确定本轮全部 token 工作量后，Runner 在前向开始前选择 NONE、PIECEWISE 或 FULL。以 vLLM v0.21.0 的 GPU 配置为例：max_num_seqs 为 200，max_num_batched_tokens 为 8192，普通单 token Decode，默认捕获上限 400，模式为 FULL_AND_PIECEWISE，且后端兼容。8192-token 混合批次、199 个 Decode 加 4096 个 Prefill tokens 均超出上限，选择 NONE；199 个 Decode 加 128 个 Prefill tokens 合计 327，可填充到 bucket 336 并选择 PIECEWISE；200 个 Decode tokens 可命中 bucket 200 并选择 FULL。后两项还需对应图已捕获且功能兼容。这里是构造批次，不对应播放器的固定轮次；Ascend 应核对配套版本。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#60728d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #172b4d; }
      .muted { fill: #60728d; }
      .label { font-size: 17px; font-weight: 650; }
      .body { font-size: 16px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1120" height="880" rx="20" fill="#fbfaf7"/>
  <text x="32" y="48" font-size="30" font-weight="700" class="ink">每轮选图：看形状，不看 Decode 比例</text>
  <text x="32" y="80" font-size="17" class="muted">同一轮先排出完整批次，再决定怎样执行；不会在 forward 半途临时换成整图。</text>

  <rect x="32" y="104" width="1056" height="76" rx="12" fill="#edf2f8"/>
  <text x="50" y="134" font-size="17" font-weight="650" class="ink">vLLM v0.21.0 · GPU 参考示例</text>
  <text x="410" y="134" class="body muted">ms = 200 · mbt = 8192 · 普通单 token Decode</text>
  <text x="50" y="162" class="body muted">FULL_AND_PIECEWISE · 默认捕获上限 400 tokens · 使用兼容后端</text>

  <rect x="32" y="208" width="250" height="108" rx="13" fill="#e8f0fd" stroke="#a9c5ef"/>
  <text x="50" y="240" font-size="22" font-weight="700" class="ink">Scheduler</text>
  <text x="50" y="270" class="body ink">确定本轮请求与 token</text>
  <text x="50" y="295" class="body muted">P 和 D 全部计入总量</text>

  <path d="M289 262H320" fill="none" stroke="#60728d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="328" y="208" width="300" height="108" rx="13" fill="#e8f5f2" stroke="#9cd2ca"/>
  <text x="346" y="240" font-size="22" font-weight="700" class="ink">Runner 轮前判定</text>
  <text x="346" y="270" class="body ink">捕获范围 → bucket → 批次结构</text>
  <text x="346" y="295" class="body muted">同时检查后端与功能兼容性</text>

  <path d="M635 262H666" fill="none" stroke="#60728d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="674" y="208" width="414" height="108" rx="13" fill="#fff" stroke="#d3dce8"/>
  <text x="692" y="240" font-size="22" font-weight="700" class="ink">本轮执行</text>
  <rect x="692" y="258" width="94" height="38" rx="8" fill="#edf1f6"/>
  <text x="739" y="283" text-anchor="middle" font-size="17" font-weight="700" class="muted mono">NONE</text>
  <rect x="797" y="258" width="153" height="38" rx="8" fill="#e8f0fd"/>
  <text x="873.5" y="283" text-anchor="middle" font-size="17" font-weight="700" fill="#2473ec" class="mono">PIECEWISE</text>
  <rect x="961" y="258" width="109" height="38" rx="8" fill="#e8f5f2"/>
  <text x="1015.5" y="283" text-anchor="middle" font-size="17" font-weight="700" fill="#108579" class="mono">FULL</text>

  <text x="50" y="356" class="label ink">构造的本轮工作量</text>
  <text x="450" y="356" class="label ink">轮前检查</text>
  <text x="944" y="356" text-anchor="middle" class="label ink">条件成立时</text>

  <rect x="32" y="374" width="1056" height="60" rx="10" fill="#f0f2f5"/>
  <text x="50" y="411" font-size="19" font-weight="650" class="ink">Mixed：总计 8192 tokens</text>
  <text x="450" y="411" font-size="17" class="muted">8192 &gt; 捕获上限 400</text>
  <text x="944" y="411" text-anchor="middle" font-size="19" font-weight="700" class="muted mono">NONE</text>

  <rect x="32" y="446" width="1056" height="60" rx="10" fill="#f0f2f5"/>
  <text x="50" y="483" font-size="19" font-weight="650" class="ink">199 D + 4096 P = 4295</text>
  <text x="450" y="483" font-size="17" class="muted">4295 &gt; 捕获上限 400</text>
  <text x="944" y="483" text-anchor="middle" font-size="19" font-weight="700" class="muted mono">NONE</text>

  <rect x="32" y="518" width="1056" height="60" rx="10" fill="#e8f0fd"/>
  <text x="50" y="555" font-size="19" font-weight="650" class="ink">199 D + 128 P = 327</text>
  <text x="450" y="555" font-size="17" class="ink">padding → bucket 336</text>
  <text x="944" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#2473ec" class="mono">PIECEWISE</text>

  <rect x="32" y="590" width="1056" height="60" rx="10" fill="#e8f5f2"/>
  <text x="50" y="627" font-size="19" font-weight="650" class="ink">200 D = 200</text>
  <text x="450" y="627" font-size="17" class="ink">bucket 200；uniform decode</text>
  <text x="944" y="627" text-anchor="middle" font-size="19" font-weight="700" fill="#108579" class="mono">FULL</text>

  <text x="50" y="679" font-size="15" class="muted">D：每个 Decode 请求的 1 个新 token；P：本轮调度的 Prefill token 数。表中数字均为 token 数。</text>

  <rect x="32" y="705" width="1056" height="145" rx="12" fill="#fff" stroke="#d3dce8"/>
  <text x="50" y="736" font-size="18" font-weight="650" class="ink">后两行还要满足：对应 bucket 的图已捕获，且本轮功能兼容。</text>
  <text x="50" y="766" class="body muted">PIECEWISE 按算子可捕获的边界分段，不是只把批次里的 Decode 请求单独放进图。</text>
  <text x="50" y="796" class="body muted">这是用于说明判定规则的构造批次，不对应播放器的固定轮次。</text>
  <text x="50" y="826" class="body muted">Ascend 的捕获范围、支持后端和模式分派，请核对实际部署的配套版本与配置。</text>
</svg>
