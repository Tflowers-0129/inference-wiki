<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" role="img" aria-labelledby="title desc">
<title id="title">一次收到多个 Token，事件间隔和 TPOT 怎样不同？</title><desc id="desc">先确定测量的是哪次收到内容，再选择计数分母。</desc>
<defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b;font-size:16px}.title{font-size:21px;font-weight:600}.head{font-weight:600}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}</style><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker></defs>
<rect width="960" height="506" fill="#fff"/>
<text x="32" y="38" class="title">一次收到多个 Token，事件间隔和 TPOT 怎样不同？</text>
<text x="32" y="65" class="small">先确定测量的是哪次收到内容，再选择计数分母。</text>
<text x="32" y="110" class="head">同一请求收到 7 个 Token，分三次内容事件到达。</text>
<path d="M100 172 H905" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="100" cy="172" r="5" fill="#2763b0"/>
<text x="72" y="147" class="">0 ms</text>
<text x="56" y="203" class="small">发出请求</text>
<circle cx="455" cy="172" r="5" fill="#2763b0"/>
<text x="427" y="147" class="">100 ms</text>
<text x="411" y="203" class="small">收到 1 Token</text>
<circle cx="668" cy="172" r="5" fill="#2763b0"/>
<text x="640" y="147" class="">160 ms</text>
<text x="624" y="203" class="small">收到 3 Token</text>
<circle cx="880" cy="172" r="5" fill="#2763b0"/>
<text x="852" y="147" class="">220 ms</text>
<text x="836" y="203" class="small">收到 3 Token</text>
<text x="235" y="236" class="small">TTFT = 100 ms</text>
<text x="515" y="236" class="small">间隔 60 ms</text>
<text x="735" y="236" class="small">间隔 60 ms</text>
<rect x="32" y="266" width="430" height="146" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="50" y="297" class="head">按内容事件计算 ITL</text>
<text x="50" y="333" class="">两次间隔：60、60 ms</text>
<text x="50" y="365" class="">平均等到下一次内容：60 ms</text>
<text x="50" y="394" class="small">同一事件内没有逐 Token 到达时间。</text>
<rect x="498" y="266" width="430" height="146" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="516" y="297" class="head">按输出 Token 数计算 TPOT</text>
<text x="516" y="333" class="">(末次收到 − 首次收到) / (输出数 − 1)</text>
<text x="516" y="365" class="mono">(220 − 100) / (7 − 1) = 20 ms/Token</text>
<text x="516" y="394" class="small">把首个输出之后的时间平均分摊。</text>
<text x="32" y="451" class="small">客户端实际等了两次 60 ms；20 ms/Token 不表示每个 Token 都间隔 20 ms 到达。</text>
<text x="32" y="481" class="small">构造时间线，以末内容事件为结束边界；不是模型或设备的实测性能。</text>
</svg>
