<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">成块输出时事件 ITL 与 TPOT 的不同统计口径</title><desc id="desc">构造客户端时间线：请求零毫秒，首块一 token 在一百毫秒收到，后续三 token 分别在一百六十、二百二十毫秒收到。事件间隔均六十毫秒，按七个输出 token 计算的 TPOT 为二十毫秒每 token。同一块内没有逐 token 到达时间。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="840" rx="20" fill="#f8fafc"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700">一次收到多个 token，ITL 与 TPOT 就可能分开</text>
<text x="32" y="80" font-size="17" fill="#475569" font-weight="400">构造的客户端接收时间；只解释统计口径，不表示任何模型或硬件的实际性能。</text>
<rect x="32" y="102" width="1056" height="253" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="136" font-size="21" fill="#172b4d" font-weight="700">同一条请求：共收到 7 个 token，分 3 个事件到达</text>
<path d="M100 211L1016 211" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<circle cx="100" cy="211" r="6" fill="#475569"/>
<text x="100" y="185" font-size="20" fill="#475569" font-weight="700" text-anchor="middle">0 ms</text>
<text x="100" y="250" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">发出请求</text>
<circle cx="500" cy="211" r="6" fill="#1d4ed8"/>
<text x="500" y="185" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="middle">100 ms</text>
<text x="500" y="250" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">收到 1 token</text>
<circle cx="740" cy="211" r="6" fill="#0f766e"/>
<text x="740" y="185" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">160 ms</text>
<text x="740" y="250" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">收到 3 token</text>
<circle cx="980" cy="211" r="6" fill="#0f766e"/>
<text x="980" y="185" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">220 ms</text>
<text x="980" y="250" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">收到 3 token</text>
<path d="M510 281L730 281" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="620" y="309" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">事件间隔 60 ms</text>
<path d="M750 281L970 281" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="860" y="309" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">事件间隔 60 ms</text>
<text x="52" y="337" font-size="18" fill="#1d4ed8" font-weight="600">首收时延 TTFT = 100 ms</text>
<rect x="32" y="375" width="516" height="182" rx="12" fill="#ecfdf5" stroke="#99c9bf"/>
<text x="52" y="412" font-size="22" fill="#0f766e" font-weight="700">按客户端事件计算 ITL</text>
<text x="52" y="449" font-size="19" fill="#172b4d" font-weight="600">样本：160 − 100、220 − 160</text>
<text x="52" y="485" font-size="20" fill="#0f766e" font-weight="700">= 60 ms、60 ms；均值 60 ms</text>
<text x="52" y="532" font-size="17" fill="#475569" font-weight="400">回答：相邻接收事件之间，等了多久？</text>
<rect x="572" y="375" width="516" height="182" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="592" y="412" font-size="22" fill="#1d4ed8" font-weight="700">按输出 token 数计算 TPOT</text>
<text x="592" y="449" font-size="19" fill="#172b4d" font-weight="600">(末收 − 首收) / (输出数 − 1)</text>
<text x="592" y="485" font-size="19" fill="#1d4ed8" font-weight="700">= (220 − 100) / (7 − 1) = 20 ms/token</text>
<text x="592" y="532" font-size="17" fill="#475569" font-weight="400">回答：首 token 之后，每个 token 均摊多久？</text>
<rect x="32" y="577" width="1056" height="116" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="612" font-size="21" fill="#172b4d" font-weight="700">块内没有逐 token 时间，不能补几个“0 ms”当成实测 ITL</text>
<text x="52" y="646" font-size="18" fill="#172b4d" font-weight="400">这里每个 3-token 事件只提供一个接收时间；先检查基准工具怎样记录、计数和聚合。</text>
<text x="52" y="677" font-size="17" fill="#475569" font-weight="400">事件样本、请求均值、token 加权均值的权重不同，数值不应直接互换。</text>
<rect x="32" y="713" width="1056" height="89" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
<text x="52" y="746" font-size="20" fill="#9a3412" font-weight="700">边界例：7 个 token 全部在一个事件中收到</text>
<text x="52" y="778" font-size="18" fill="#172b4d" font-weight="400">首收 = 末收时，以上 TPOT 可为 0；事件 ITL 没有样本。这不代表生成零耗时。</text>
<text x="32" y="830" font-size="16" fill="#475569" font-weight="400">本文将“事件 ITL”与“逐 token ITL”分开命名；实际报表必须核对测量点、分母与空样本处理。</text>
</svg>
