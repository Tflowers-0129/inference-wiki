<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">打包后的 token 怎样穿过一次模型前向</title><desc id="desc">示意一个 Transformer 层中的 QKV 投影、Attention、输出投影和 MLP。激活沿主路径流动，权重被各层读取，KV Cache 提供上下文并保存当前 KV。完成所有层后才进行采样。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="900" rx="20" fill="#f8fafc"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700">同一轮前向：共同的模型，不同的 query 与上下文</text>
<text x="32" y="80" font-size="17" fill="#475569" font-weight="400">下面展开一个 Transformer 层；省略归一化、残差等细节，不按图块面积表示耗时。</text>
<rect x="330" y="112" width="470" height="66" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="565" y="142" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">打包 token 的输入激活</text>
<text x="565" y="167" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">本轮 Q 个 token，带请求边界</text>
<rect x="330" y="225" width="470" height="68" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="565" y="255" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">QKV 投影</text>
<text x="565" y="280" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">读取权重，形成每个 token 的 Q / K / V</text>
<rect x="330" y="363" width="470" height="90" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="565" y="393" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">Attention</text>
<text x="565" y="418" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">每条请求按自己的因果边界访问 KV</text>
<rect x="330" y="513" width="470" height="78" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="565" y="543" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">输出投影 + MLP</text>
<text x="565" y="568" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">对本轮 token 的激活继续计算</text>
<rect x="330" y="645" width="470" height="65" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="565" y="675" font-size="21" fill="#172b4d" font-weight="700" text-anchor="middle">本层输出 hidden states</text>
<text x="565" y="700" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">作为下一层的输入</text>
<path d="M565 180L565 220" fill="none" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
<path d="M565 295L565 358" fill="none" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
<path d="M565 455L565 508" fill="none" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
<path d="M565 593L565 640" fill="none" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
<rect x="32" y="217" width="248" height="94" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="52" y="251" font-size="20" fill="#1d4ed8" font-weight="700">本层 QKV 权重</text>
<text x="52" y="284" font-size="17" fill="#172b4d" font-weight="400">读取并参与矩阵乘法</text>
<path d="M280 259L325 259" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)" stroke-dasharray="6 4"/>
<rect x="32" y="509" width="248" height="94" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="52" y="543" font-size="19" fill="#1d4ed8" font-weight="700">本层投影 / MLP 权重</text>
<text x="52" y="576" font-size="17" fill="#172b4d" font-weight="400">同一模型，按层读取</text>
<path d="M280 553L325 553" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)" stroke-dasharray="6 4"/>
<rect x="846" y="320" width="242" height="174" rx="12" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="966" y="354" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle">本层 KV Cache</text>
<text x="866" y="389" font-size="19" fill="#0f766e" font-weight="600">历史 K / V</text>
<text x="866" y="423" font-size="19" fill="#0f766e" font-weight="600">+ 本轮 K / V</text>
<text x="866" y="466" font-size="16" fill="#475569" font-weight="400">按请求映射到存储块</text>
<path d="M800 260H966V315" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="818" y="243" font-size="17" fill="#0f766e" font-weight="600">保存当前 K/V</text>
<path d="M846 405L805 405" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<rect x="32" y="333" width="248" height="143" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="366" font-size="20" fill="#172b4d" font-weight="700">三种数据流</text>
<path d="M52 395L90 395" fill="none" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
<text x="104" y="402" font-size="17" fill="#172b4d" font-weight="400">激活：沿主路径</text>
<path d="M52 428L90 428" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)" stroke-dasharray="6 4"/>
<text x="104" y="435" font-size="17" fill="#172b4d" font-weight="400">权重：逐层读取</text>
<path d="M52 459L90 459" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<text x="104" y="466" font-size="17" fill="#172b4d" font-weight="400">KV：读写上下文</text>
<path d="M565 712V741" fill="none" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
<text x="580" y="735" font-size="16" fill="#475569" font-weight="400">重复其余层</text>
<rect x="330" y="752" width="470" height="62" rx="12" fill="#f0fdfa" stroke="#99c9bf"/>
<text x="565" y="780" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle">所有层完成 → 输出头 → 采样</text>
<text x="565" y="804" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">普通 Decode 采样下一 token；投机验证另有接受步骤。</text>
<text x="32" y="850" font-size="17" fill="#475569" font-weight="400">P 与 D 都走模型计算；差别包括本轮 query 数、已有上下文长度和 Attention 形状。</text>
<text x="32" y="880" font-size="16" fill="#475569" font-weight="400">当前 KV 的写入可在 Attention 前完成或与其融合，具体由后端实现；本图只表达数据依赖。</text>
</svg>
