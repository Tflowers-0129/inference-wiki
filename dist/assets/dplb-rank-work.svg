<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830" role="img" aria-labelledby="title desc">
<title id="title">请求数相同，DP 负载就相同吗？</title><desc id="desc">教学示意，非实测。四个独立服务rank各有两个请求，教学工作量分别为9加9、3加3、3加3、3加3，合计18、6、6、6。每个rank独立执行并回包，不存在图中隐含的跨rank barrier。新请求仅进入选定队列，已有KV请求不由入口DPLB随意迁移。工作量单位不是毫秒，也不是Token数。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><pattern id="wait" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff7ed"/><path d="M-3 3L3 -3M0 10L10 0M7 13L13 7" stroke="#c2772c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1120" height="830" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.4"/>
<text x="32" y="47" font-size="28" fill="#172b4d" font-weight="700">请求数相同，DP 负载就相同吗？</text>
<text x="32" y="80" font-size="18" fill="#475569" font-weight="400">教学示意，非实测 · 4 个独立服务 rank；每个 rank 都有 2 个请求。</text>
<rect x="32" y="104" width="1056" height="64" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="52" y="132" font-size="20" fill="#172b4d" font-weight="600">同一时点的既有工作量：work = [18, 6, 6, 6]</text>
<text x="52" y="156" font-size="17" fill="#475569" font-weight="400">工作量单位用于算例，不是毫秒；条长不预测真实排队时延。</text>
<text x="48" y="204" font-size="18" fill="#475569" font-weight="600">队列与请求</text>
<text x="370" y="204" font-size="18" fill="#475569" font-weight="600">计算工作量 →</text>
