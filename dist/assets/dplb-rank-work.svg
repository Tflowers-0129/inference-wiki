<path d="M545 560L573 560" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="582" y="566" font-size="17" fill="#0f766e" font-weight="600">自行回包 · 6</text>
<rect x="32" y="653" width="1056" height="65" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
<text x="52" y="682" font-size="20" fill="#b45309" font-weight="700">入口 DPLB：新请求 R9 → 只加入选定的 DP3 队列（示例）</text>
<text x="52" y="706" font-size="17" fill="#172b4d" font-weight="400">R9 尚未计入上方工作量；已有 KV 的请求不会因此被入口随意迁到另一 rank。</text>
<text x="32" y="757" font-size="19" fill="#0f766e" font-weight="600">独立服务：短队列完成后即可回包，不必等待 DP0 的 18 单位工作量。</text>
<text x="32" y="794" font-size="17" fill="#475569" font-weight="400">本图不包含 DP + EP 耦合执行；MoE 集体通信的依赖要在下一张泳道中另看。</text>
</svg>
