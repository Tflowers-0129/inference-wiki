<svg xmlns="http://www.w3.org/2000/svg" width="640" height="870" viewBox="0 0 640 870" role="img" aria-labelledby="fusion-title fusion-desc"><title id="fusion-title">Triton 融合：接受 2 个候选，接续行索引为 2</title><desc id="fusion-desc">同一条请求有三个候选，Device 有效采样数为 3，拒绝数 1，接续索引 2。两种实现都读取 Device Tensor。Triton 在一次 kernel 内计算拒绝数和接续索引；Torch fallback 使用多个设备操作。本图不代表实测耗时，也不表示有效采样计数在这个 kernel 中计算。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="1" y="1" width="638" height="868" rx="9" fill="#fbfdff" stroke="#cbd5e1"/><text x="22" y="35" font-size="23" fill="#172b4d" font-weight="700">同一份 Device 数据，一次融合计算</text><text x="22" y="65" font-size="17" fill="#475569" font-weight="400">单请求 K=3 · 接受 a=2 · 教学示意，非实测时长</text><text x="22" y="104" font-size="20" fill="#172b4d" font-weight="650">① 已在 Device 的输入</text><rect x="22" y="119" width="193" height="72" rx="9" fill="#edf5ff" stroke="#b9cdec"/><text x="35" y="146" font-size="17" fill="#475569" font-weight="400">候选累计数</text><text x="35" y="175" font-size="21" fill="#1d4ed8" font-weight="650">[3]</text><rect x="223" y="119" width="193" height="72" rx="9" fill="#edf5ff" stroke="#b9cdec"/><text x="236" y="146" font-size="17" fill="#475569" font-weight="400">有效采样数</text><text x="236" y="175" font-size="21" fill="#1d4ed8" font-weight="650">[3]</text><rect x="424" y="119" width="193" height="72" rx="9" fill="#edf5ff" stroke="#b9cdec"/><text x="437" y="146" font-size="17" fill="#475569" font-weight="400">query 边界</text><text x="437" y="175" font-size="21" fill="#1d4ed8" font-weight="650">[0, 4]</text><path d="M320 193 L320 218" fill="none" stroke="#0f766e" stroke-width="2"/><path d="M315 211 L320 218 L325 211" fill="none" stroke="#0f766e" stroke-width="2"/><text x="22" y="246" font-size="20" fill="#172b4d" font-weight="650">② Host 提交；Device 按依赖执行</text><rect x="22" y="263" width="596" height="184" rx="9" fill="#e8f5f1" stroke="#94c6b8"/><text x="38" y="293" font-size="20" fill="#0f766e" font-weight="700">一次 Triton launch</text><text x="38" y="321" font-size="17" fill="#0f766e" font-weight="400">prepare_inputs_padded_kernel</text><text x="38" y="355" font-size="19" fill="#172b4d" font-weight="400">K = 候选累计数差分 = 3</text><text x="38" y="391" font-size="19" fill="#172b4d" font-weight="400">拒绝数 = K + 1 − 3 = 1</text><text x="38" y="427" font-size="19" fill="#172b4d" font-weight="400">接续索引 = query_end − 1 − 1 = 2</text><path d="M320 450 L320 473" fill="none" stroke="#0f766e" stroke-width="2"/><path d="M315 466 L320 473 L325 466" fill="none" stroke="#0f766e" stroke-width="2"/><rect x="22" y="480" width="288" height="61" rx="9" fill="#fff7ed" stroke="#e5c994"/><text x="37" y="505" font-size="16" fill="#475569" font-weight="400">num_rejected_tokens</text><text x="37" y="529" font-size="21" fill="#92400e" font-weight="700">1</text><rect x="322" y="480" width="296" height="61" rx="9" fill="#e8f5f1" stroke="#94c6b8"/><text x="337" y="505" font-size="16" fill="#475569" font-weight="400">token_indices_to_sample</text><text x="337" y="529" font-size="19" fill="#0f766e" font-weight="700">2  ← 展平 Target 行号</text><text x="22" y="578" font-size="20" fill="#172b4d" font-weight="650">③ 用索引找到接续状态，配对下一 Token x</text><text x="22" y="608" font-size="17" fill="#475569" font-weight="400">Target 输入 / hidden-state 行</text><rect x="22" y="623" width="143" height="64" rx="9" fill="#f1f5f9" stroke="#dbe3ed"/><text x="34" y="648" font-size="16" fill="#475569" font-weight="400">行 0</text><text x="34" y="675" font-size="21" fill="#172b4d" font-weight="650">t0</text><rect x="173" y="623" width="143" height="64" rx="9" fill="#f1f5f9" stroke="#dbe3ed"/><text x="185" y="648" font-size="16" fill="#475569" font-weight="400">行 1</text><text x="185" y="675" font-size="21" fill="#172b4d" font-weight="650">d1</text><rect x="324" y="623" width="143" height="64" rx="9" fill="#e8f5f1" stroke="#0f766e"/><text x="336" y="648" font-size="16" fill="#475569" font-weight="400">行 2</text><text x="336" y="675" font-size="21" fill="#0f766e" font-weight="650">d2</text><rect x="475" y="623" width="143" height="64" rx="9" fill="#f1f5f9" stroke="#dbe3ed"/><text x="487" y="648" font-size="16" fill="#475569" font-weight="400">行 3</text><text x="487" y="675" font-size="21" fill="#172b4d" font-weight="650">d3</text><text x="22" y="719" font-size="17" fill="#475569" font-weight="400">Device 采样结果（−1 表示无效尾部）</text><rect x="22" y="733" width="143" height="51" rx="9" fill="#f1f5f9" stroke="#dbe3ed"/><text x="34" y="765" font-size="21" fill="#475569" font-weight="650">d1</text><rect x="173" y="733" width="143" height="51" rx="9" fill="#f1f5f9" stroke="#dbe3ed"/><text x="185" y="765" font-size="21" fill="#475569" font-weight="650">d2</text><rect x="324" y="733" width="143" height="51" rx="9" fill="#e8f5f1" stroke="#0f766e"/><text x="336" y="765" font-size="21" fill="#0f766e" font-weight="650">x</text><rect x="475" y="733" width="143" height="51" rx="9" fill="#f1f5f9" stroke="#dbe3ed"/><text x="487" y="765" font-size="21" fill="#475569" font-weight="650">−1</text><text x="22" y="815" font-size="18" fill="#0f766e" font-weight="650">索引 2 对应 Target 的 d2 行；该处采样结果为 x。</text><text x="22" y="846" font-size="17" fill="#475569" font-weight="400">两种实现都无须为这两个输出先回读 CPU；流依赖仍保留。</text></svg>