<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">Copy 消除：先确认中间搬运能否合法省略</title><desc id="desc">依据消除copy的例子截图绘制的优化候选；只有前态截图，后态为待验证机制示意。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#52657b"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="1120" height="670" fill="#f8fbff"/><text x="38" y="49" font-size="29" fill="#17304d" font-weight="650">Copy 消除：先确认中间搬运能否合法省略</text><text x="38" y="85" font-size="20" fill="#52657b" font-weight="400">前态来自截图标注 · 后态是优化候选 · 无实测时长、数量或收益对照</text><rect x="30" y="112" width="1060" height="202" rx="9" fill="#ffffff"/><text x="52" y="153" font-size="24" fill="#17304d" font-weight="600">前：截图定位重复搬运，以下候选数据流仍待核对</text><rect x="60" y="185" width="170" height="58" rx="9" fill="#ccf1e6"/><text x="145.0" y="221.0" text-anchor="middle" font-size="20" fill="#17304d">产出（待核对）</text><path d="M235 214 L275 214" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="282" y="185" width="250" height="58" rx="9" fill="#ebe0fc"/><text x="407.0" y="221.0" text-anchor="middle" font-size="19" fill="#17304d">inplacecopy / 临时缓冲</text><path d="M538 214 L576 214" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="584" y="185" width="230" height="58" rx="9" fill="#fff0d4"/><text x="699.0" y="221.0" text-anchor="middle" font-size="20" fill="#17304d">memcpy async</text><path d="M820 214 L856 214" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="862" y="185" width="190" height="58" rx="9" fill="#dbeafe"/><text x="957.0" y="221.0" text-anchor="middle" font-size="20" fill="#17304d">消费（待核对）</text><text x="60" y="282" font-size="19" fill="#52657b" font-weight="400">原图作者标注 72×inplacecopy + 72×memcpyasync；截图不足以独立复核计数。</text><rect x="30" y="334" width="1060" height="210" rx="9" fill="#ffffff"/><text x="52" y="375" font-size="24" fill="#17304d" font-weight="600">后：仅当输入语义与生命周期允许，复用或合并中间路径</text><rect x="60" y="412" width="180" height="58" rx="9" fill="#ccf1e6"/><text x="150.0" y="448.0" text-anchor="middle" font-size="20" fill="#17304d">设备结果</text><path d="M246 441 L296 441" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="304" y="412" width="460" height="58" rx="9" fill="#dbeafe"/><text x="534.0" y="448.0" text-anchor="middle" font-size="21" fill="#17304d">直接复用 / 合并 gather（待验证）</text><path d="M770 441 L828 441" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="836" y="412" width="215" height="58" rx="9" fill="#ccf1e6"/><text x="943.5" y="448.0" text-anchor="middle" font-size="20" fill="#17304d">消费（待核对）</text><text x="60" y="513" font-size="19" fill="#52657b" font-weight="400">必要的索引、重排或搬运仍需保留；异步 copy 返回并不代表消费者已可读取。</text><text x="38" y="589" font-size="20" fill="#17304d" font-weight="400">验证顺序：核对 alias / 所有权 → 请求重排与 padding → 流依赖 → 数值一致性。</text><text x="38" y="628" font-size="20" fill="#52657b" font-weight="400">再采同条件 Trace：检查 copy 次数、字节量与关键路径，不能仅比较 Kernel 数量。</text></g></svg>