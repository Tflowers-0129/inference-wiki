<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc">
  <title id="title">Draft 三种执行形态的定性比较</title>
  <desc id="desc">三组泳道均用两组 A、B、C 表示同一组匿名逻辑工作。eager 示意多次提交，graph 问题示意保留待检查的长区段，fixed 示意重复短任务。定性示意，非等比例重建，未标定耗时，不推断根因；任务数量不等于原始截图的 Kernel 数。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .label{font-size:17px;font-weight:600;fill:#475569}
      .small{font-size:16px;fill:#475569}
      .submit{fill:#eff6ff;stroke:#93c5fd}
      .work{fill:#e6f4f1;stroke:#8bc4ba}
      .task{font-size:17px;font-weight:700;fill:#0f766e;text-anchor:middle}
      .blue{font-size:16px;font-weight:600;fill:#1d4ed8;text-anchor:middle}
      .track{stroke:#cbd5e1;stroke-width:2}
      .dependency{fill:none;stroke:#93a6bf;stroke-width:1.5;stroke-dasharray:4 4}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1L6 3.5L1 6" fill="none" stroke="#93a6bf" stroke-width="1.4"/></marker>
    <pattern id="wait-pattern" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#f5d5a6" stroke-width="2"/></pattern>
  </defs>
  <rect width="1120" height="1080" rx="20" fill="#f8fafc"/>
  <text x="32" y="48" font-size="28" font-weight="700">Draft 执行：减少提交之后，仍要检查长区段</text>
  <text x="32" y="82" font-size="18" fill="#475569">同一组匿名逻辑工作 A → B → C，重复两组；用于对照形态，不对应具体算子。</text>
  <rect x="32" y="105" width="1056" height="62" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="52" y="143" font-size="19" font-weight="700" fill="#9a3412">定性示意；非等比例重建；未标定耗时；不推断根因</text>
  <text x="32" y="197" class="small">沿用素材的 eager / graph 有问题版 / fixed 名称；块宽、间隙与行末位置不能换算性能。</text>

  <g>
    <rect x="32" y="220" width="1056" height="212" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="52" y="255" font-size="21" font-weight="700" fill="#1d4ed8">① eager：多次提交的抽象形态</text>
    <text x="52" y="307" class="label">Host 提交</text>
    <text x="52" y="376" class="label">设备工作</text>
    <path d="M210 300H1056M210 369H1056" class="track"/>
    <g class="submit">
      <rect x="224" y="282" width="84" height="36" rx="6"/><rect x="354" y="282" width="84" height="36" rx="6"/><rect x="484" y="282" width="84" height="36" rx="6"/>
      <rect x="654" y="282" width="84" height="36" rx="6"/><rect x="784" y="282" width="84" height="36" rx="6"/><rect x="914" y="282" width="84" height="36" rx="6"/>
    </g>
    <g class="blue"><text x="266" y="306">提交 A</text><text x="396" y="306">提交 B</text><text x="526" y="306">提交 C</text><text x="696" y="306">提交 A</text><text x="826" y="306">提交 B</text><text x="956" y="306">提交 C</text></g>
    <g class="dependency" marker-end="url(#arrow)"><path d="M266 321V345"/><path d="M396 321V345"/><path d="M526 321V345"/><path d="M696 321V345"/><path d="M826 321V345"/><path d="M956 321V345"/></g>
    <g class="work">
      <rect x="224" y="350" width="84" height="38" rx="6"/><rect x="354" y="350" width="84" height="38" rx="6"/><rect x="484" y="350" width="84" height="38" rx="6"/>
      <rect x="654" y="350" width="84" height="38" rx="6"/><rect x="784" y="350" width="84" height="38" rx="6"/><rect x="914" y="350" width="84" height="38" rx="6"/>
    </g>
    <g class="task"><text x="266" y="375">A</text><text x="396" y="375">B</text><text x="526" y="375">C</text><text x="696" y="375">A</text><text x="826" y="375">B</text><text x="956" y="375">C</text></g>
    <text x="52" y="415" class="small">这是逐项提交的机制示意；原图没有提供完整 Host 调用轨道，不能据此认定间隙来源。</text>
  </g>

  <g>
    <rect x="32" y="450" width="1056" height="226" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="52" y="485" font-size="21" font-weight="700" fill="#b45309">② graph 有问题版：保留需要检查的长区段</text>
    <text x="52" y="537" class="label">Host 提交</text>
    <text x="52" y="606" class="label">设备工作</text>
    <path d="M210 530H1056M210 599H1056" class="track"/>
    <rect x="224" y="512" width="228" height="36" rx="6" class="submit"/><rect x="780" y="512" width="228" height="36" rx="6" class="submit"/>
    <text x="338" y="536" class="blue">回放组 1</text><text x="894" y="536" class="blue">回放组 2</text>
    <path d="M338 552V575M894 552V575" class="dependency" marker-end="url(#arrow)"/>
    <g class="work"><rect x="224" y="580" width="68" height="38" rx="6"/><rect x="304" y="580" width="68" height="38" rx="6"/><rect x="384" y="580" width="68" height="38" rx="6"/><rect x="780" y="580" width="68" height="38" rx="6"/><rect x="860" y="580" width="68" height="38" rx="6"/><rect x="940" y="580" width="68" height="38" rx="6"/></g>
    <g class="task"><text x="258" y="605">A</text><text x="338" y="605">B</text><text x="418" y="605">C</text><text x="814" y="605">A</text><text x="894" y="605">B</text><text x="974" y="605">C</text></g>
    <rect x="472" y="574" width="288" height="50" rx="7" fill="#fff7ed" stroke="#f4b96f"/>
    <rect x="472" y="574" width="288" height="50" rx="7" fill="url(#wait-pattern)"/>
    <text x="616" y="604" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">长 dispatch / 等待区段</text>
    <text x="52" y="654" class="small">长区段从多轨画面抽象而来，横向拼在此处便于观察；不代表它与 A/B/C 的真实依赖。</text>
  </g>

  <g>
    <rect x="32" y="694" width="1056" height="212" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="52" y="729" font-size="21" font-weight="700" fill="#0f766e">③ fixed：重复短任务的抽象形态</text>
    <text x="52" y="781" class="label">Host 提交</text>
    <text x="52" y="850" class="label">设备工作</text>
    <path d="M210 774H1056M210 843H1056" class="track"/>
    <rect x="224" y="756" width="228" height="36" rx="6" class="submit"/><rect x="480" y="756" width="228" height="36" rx="6" class="submit"/>
    <text x="338" y="780" class="blue">回放组 1</text><text x="594" y="780" class="blue">回放组 2</text>
    <path d="M338 796V819M594 796V819" class="dependency" marker-end="url(#arrow)"/>
    <g class="work"><rect x="224" y="824" width="68" height="38" rx="6"/><rect x="304" y="824" width="68" height="38" rx="6"/><rect x="384" y="824" width="68" height="38" rx="6"/><rect x="480" y="824" width="68" height="38" rx="6"/><rect x="560" y="824" width="68" height="38" rx="6"/><rect x="640" y="824" width="68" height="38" rx="6"/></g>
    <g class="task"><text x="258" y="849">A</text><text x="338" y="849">B</text><text x="418" y="849">C</text><text x="514" y="849">A</text><text x="594" y="849">B</text><text x="674" y="849">C</text></g>
    <text x="52" y="889" class="small">对应 fixed 截图的规则重复形态；修复机制未给出，也不表示之后没有其他等待。</text>
  </g>

  <rect x="32" y="928" width="1056" height="120" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="961" font-size="20" font-weight="700" fill="#1d4ed8">把 Draft、Target 与客户端连成同一份账，才能评价效果</text>
  <text x="52" y="993" font-size="17">对齐提议、目标验证、状态维护与实际提交 Token 数；同时核对服务端发送与客户端接收事件。</text>
  <text x="52" y="1024" font-size="17" fill="#475569">截图不能给出接受率或客户端 ITL / TPOT；任务块数量也不是原图 Kernel 计数。</text>
</svg>
