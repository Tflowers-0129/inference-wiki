<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">异步调度：把可提前的准备移到上一轮执行期间</title><desc id="desc">依据异步调度开关截图与正文机制绘制的定性依赖示意；不按截图比例重建，不表示实测加速。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#52657b"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="1120" height="790" fill="#f8fbff"/><text x="38" y="49" font-size="29" fill="#17304d" font-weight="650">异步调度：把可提前的准备移到上一轮执行期间</text><text x="38" y="85" font-size="19" fill="#52657b" font-weight="400">定性机制示意 · 无实测时间轴 · 两行设备工作量相同，示意间距不能用于计算收益</text><rect x="30" y="112" width="1060" height="265" rx="9" fill="#ffffff"/><text x="52" y="148" font-size="24" fill="#17304d" font-weight="600">关闭异步：等待结果后，再准备下一轮</text><text x="52" y="205" font-size="21" fill="#17304d" font-weight="400">Host</text><text x="52" y="273" font-size="21" fill="#17304d" font-weight="400">设备</text><rect x="185" y="172" width="120" height="45" rx="9" fill="#dbeafe"/><text x="245.0" y="201.5" text-anchor="middle" font-size="20" fill="#17304d">准备 n</text><rect x="307" y="172" width="280" height="45" rx="9" fill="#ebe0fc"/><text x="447.0" y="201.5" text-anchor="middle" font-size="20" fill="#17304d">等 n 的结果</text><rect x="590" y="172" width="150" height="45" rx="9" fill="#dbeafe"/><text x="665.0" y="201.5" text-anchor="middle" font-size="20" fill="#17304d">准备 n+1</text><rect x="305" y="242" width="230" height="45" rx="9" fill="#ccf1e6"/><text x="420.0" y="271.5" text-anchor="middle" font-size="20" fill="#17304d">前向 n</text><rect x="537" y="242" width="50" height="45" rx="9" fill="#ccf1e6"/><text x="562.0" y="271.5" text-anchor="middle" font-size="17" fill="#17304d">采样</text><rect x="740" y="242" width="300" height="45" rx="9" fill="#ccf1e6"/><text x="890.0" y="271.5" text-anchor="middle" font-size="20" fill="#17304d">前向 n+1</text><path d="M245 217 L305 239" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M665 217 L740 239" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="187" y="334" font-size="20" fill="#52657b" font-weight="400">Host 等待区间 ≠ 整个设备空闲；其他流可能仍有任务。</text><rect x="30" y="397" width="1060" height="278" rx="9" fill="#ffffff"/><text x="52" y="435" font-size="24" fill="#17304d" font-weight="600">开启异步：提前排计划，真实输入仍要等依赖</text><text x="52" y="492" font-size="21" fill="#17304d" font-weight="400">Host</text><text x="52" y="560" font-size="21" fill="#17304d" font-weight="400">设备</text><rect x="185" y="459" width="120" height="45" rx="9" fill="#dbeafe"/><text x="245.0" y="488.5" text-anchor="middle" font-size="20" fill="#17304d">准备 n</text><rect x="330" y="459" width="220" height="45" rx="9" fill="#dbeafe"/><text x="440.0" y="488.5" text-anchor="middle" font-size="20" fill="#17304d">计划 / 准备 n+1</text><rect x="605" y="459" width="180" height="45" rx="9" fill="#ebe0fc"/><text x="695.0" y="488.5" text-anchor="middle" font-size="20" fill="#17304d">按需回收 n</text><rect x="305" y="527" width="230" height="45" rx="9" fill="#ccf1e6"/><text x="420.0" y="556.5" text-anchor="middle" font-size="20" fill="#17304d">前向 n</text><rect x="537" y="527" width="50" height="45" rx="9" fill="#ccf1e6"/><text x="562.0" y="556.5" text-anchor="middle" font-size="17" fill="#17304d">采样</text><rect x="610" y="527" width="300" height="45" rx="9" fill="#ccf1e6"/><text x="760.0" y="556.5" text-anchor="middle" font-size="20" fill="#17304d">前向 n+1</text><path d="M245 504 L305 525" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M550 500 L600 525" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M587 550 L607 550" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="185" y="616" font-size="20" fill="#52657b" font-weight="400">下一轮消费真实 Token、有效长度之前，仍须满足设备端依赖。</text><text x="185" y="648" font-size="19" fill="#52657b" font-weight="400">预期检查：准备是否重叠？输入复用 fence 或计数回读是否仍在关键路径？</text><text x="38" y="718" font-size="19" fill="#17304d" font-weight="400">原图观察：两张图均可见 EVENT_WAIT；其分布不同。未提供轨道名与可比刻度。</text><text x="38" y="752" font-size="19" fill="#52657b" font-weight="400">不能从紫色条长度推出 Host 阻塞时长、设备利用率或端到端加速比。</text></g></svg>