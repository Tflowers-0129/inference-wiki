<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="970" viewBox="0 0 1120 970" role="img" aria-labelledby="title desc">
<title id="title">DPLB 与 EPLB，分别在决定什么？</title><desc id="desc">教学示意，非实测。DPLB选择新请求进入哪个DP队列。各DP输入上的MoE router决定logical expert ID。EPLB调整logical expert的physical placement与副本，dispatch按映射跨EP ranks发送，再combine回原Token。DP和EP是不同并行维度，本图TP等于1、总共四设备，两行是同组设备的不同视角。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><pattern id="wait" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff7ed"/><path d="M-3 3L3 -3M0 10L10 0M7 13L13 7" stroke="#c2772c" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1120" height="970" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.4"/>
<text x="32" y="47" font-size="28" fill="#172b4d" font-weight="700">DPLB 与 EPLB，分别在决定什么？</text>
<text x="32" y="80" font-size="18" fill="#475569" font-weight="400">教学示意，非实测 · 请求去向与专家落点，是两次不同的选择。</text>
<rect x="32" y="108" width="210" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="137" y="145" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">新请求 R</text>
<text x="137" y="175" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">带输入 / 输出需求</text>
<path d="M250 154L292 154" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="302" y="108" width="300" height="92" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="452" y="143" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">DPLB：选择 DP 入口</text>
<text x="452" y="175" font-size="17" fill="#172b4d" font-weight="400" text-anchor="middle">参考队列与负载，选定一个入口</text>
<path d="M612 154L654 154" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="664" y="108" width="424" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="876" y="143" font-size="19" fill="#172b4d" font-weight="600" text-anchor="middle">请求进入该 DP 的调度与 KV 上下文</text>
<text x="876" y="175" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">后续执行沿该请求的状态继续</text>
<text x="32" y="237" font-size="21" fill="#1d4ed8" font-weight="700">DP 维度：组织各自的 Attention / Token 输入</text>
<rect x="32" y="258" width="252" height="92" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="158" y="293" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">DP 0 输入</text>
<text x="158" y="326" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">各自的请求与 Token</text>
<path d="M158 352L158 389" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300" y="258" width="252" height="92" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="426" y="293" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">DP 1 输入</text>
<text x="426" y="326" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">各自的请求与 Token</text>
<path d="M426 352L426 389" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="568" y="258" width="252" height="92" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="694" y="293" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">DP 2 输入</text>
<text x="694" y="326" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">各自的请求与 Token</text>
<path d="M694 352L694 389" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="836" y="258" width="252" height="92" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="962" y="293" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">DP 3 输入</text>
<text x="962" y="326" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">各自的请求与 Token</text>
<path d="M962 352L962 389" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="398" width="1056" height="94" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="560" y="433" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">MoE router：为每个 Token 选择 logical expert ID</text>
<text x="560" y="467" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">各 DP 上分别执行；此处合并绘制。例：同一 Token → E0、E3（top-2）</text>
<path d="M560 498L560 533" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="542" width="1056" height="100" rx="9" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="560" y="578" font-size="22" fill="#6d28d9" font-weight="700" text-anchor="middle">EPLB：维护 logical expert → physical slot / rank 的映射</text>
<text x="560" y="613" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">调整专家副本和落点；保留 router 选出的 logical IDs，再按映射 dispatch</text>
<text x="32" y="674" font-size="21" fill="#0f766e" font-weight="700">EP 维度：跨 rank 把 Token 交给相应物理专家</text>
<path d="M158 685L158 699" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="706" width="252" height="82" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.4"/>
<text x="158" y="740" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">EP rank 0 / slots</text>
<text x="158" y="770" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">本地专家计算</text>
<path d="M158 791L158 815" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<path d="M426 685L426 699" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300" y="706" width="252" height="82" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.4"/>
<text x="426" y="740" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">EP rank 1 / slots</text>
<text x="426" y="770" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">本地专家计算</text>
<path d="M426 791L426 815" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<path d="M694 685L694 699" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="568" y="706" width="252" height="82" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.4"/>
<text x="694" y="740" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">EP rank 2 / slots</text>
<text x="694" y="770" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">本地专家计算</text>
<path d="M694 791L694 815" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<path d="M962 685L962 699" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="836" y="706" width="252" height="82" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.4"/>
<text x="962" y="740" font-size="20" fill="#0f766e" font-weight="700" text-anchor="middle">EP rank 3 / slots</text>
<text x="962" y="770" font-size="18" fill="#172b4d" font-weight="400" text-anchor="middle">本地专家计算</text>
<path d="M962 791L962 815" fill="none" stroke="#0f766e" stroke-width="1.8"/>
<path d="M158 815H962M560 815V837" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560" y="869" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle">combine：按原 Token / 路由权重收回结果，交给下游</text>
<text x="32" y="913" font-size="17" fill="#475569" font-weight="400">本图前提：TP=1，共 4 个设备；DP 输入与 EP 专家分片是同一组设备的两种视角。</text>
<text x="32" y="946" font-size="17" fill="#475569" font-weight="400">DP 与 EP 是不同并行维度；两行卡片不表示额外部署了两套机器。</text>
</svg>
