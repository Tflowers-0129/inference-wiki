<svg xmlns="http://www.w3.org/2000/svg" width="960" height="666" viewBox="0 0 960 666" role="img" aria-labelledby="title desc">
<title id="title">DPLB 分配请求，EPLB 安排专家副本</title><desc id="desc">请求去哪个 engine，与 Token 交给哪份专家权重，是两次不同的选择。</desc>
<defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b;font-size:16px}.title{font-size:21px;font-weight:600}.head{font-weight:600}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}</style><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker></defs>
<rect width="960" height="666" fill="#fff"/>
<text x="32" y="38" class="title">DPLB 分配请求，EPLB 安排专家副本</text>
<text x="32" y="65" class="small">请求去哪个 engine，与 Token 交给哪份专家权重，是两次不同的选择。</text>
<rect x="32" y="100" width="170" height="64" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="50" y="127" class="head">新请求 R</text>
<text x="50" y="151" class="small">等待分配入口</text>
<path d="M202 132 H248" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="100" width="230" height="64" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="268" y="127" class="head">DPLB 选择 DP engine</text>
<text x="268" y="151" class="small">例如选择 DP 1</text>
<path d="M480 132 H526" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="528" y="100" width="400" height="64" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="546" y="127" class="head">请求进入 DP 1 的队列</text>
<text x="546" y="151" class="small">后续沿该请求的状态与 KV 继续</text>
<path d="M728 164 V192 H366 V232" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="32" y="216" class="head">DP 侧：各自处理已接收的请求</text>
<rect x="32" y="234" width="212" height="70" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="48" y="263" class="head">DP 0 的输入</text>
<text x="48" y="289" class="small">本地请求与 Attention</text>
<rect x="260" y="234" width="212" height="70" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="276" y="263" class="head">DP 1 的输入</text>
<text x="276" y="289" class="small">本地请求与 Attention</text>
<rect x="488" y="234" width="212" height="70" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="504" y="263" class="head">DP 2 的输入</text>
<text x="504" y="289" class="small">本地请求与 Attention</text>
<rect x="716" y="234" width="212" height="70" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="732" y="263" class="head">DP 3 的输入</text>
<text x="732" y="289" class="small">本地请求与 Attention</text>
<path d="M138 304 V326 H250 V350" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M366 304 V326" fill="none" stroke="#607086" stroke-width="1.5"/>
<path d="M594 304 V326 H250" fill="none" stroke="#607086" stroke-width="1.5"/>
<path d="M822 304 V326 H250" fill="none" stroke="#607086" stroke-width="1.5"/>
<rect x="32" y="352" width="430" height="80" rx="6" fill="#fff4e7" stroke="#d8e1eb"/>
<text x="50" y="382" class="head">Router 选择逻辑专家</text>
<text x="50" y="412" class="">例如：一个 Token 选 E0、E1（top-2）</text>
<path d="M462 392 H496" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="498" y="352" width="430" height="80" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="516" y="382" class="head">EPLB 维护专家副本放置</text>
<text x="516" y="412" class="">执行时查表，选择 E0、E1 的实际副本</text>
<text x="32" y="470" class="head">EP 侧：把任务发给对应的专家副本</text>
<path d="M712 432 V484 H138 V500" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M712 484 H366 V500" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M712 484 H594 V500" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M712 484 H822 V500" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="32" y="502" width="212" height="66" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="48" y="531" class="head">EP rank 0</text>
<text x="48" y="555" class="small">本地专家计算</text>
<rect x="260" y="502" width="212" height="66" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="276" y="531" class="head">EP rank 1</text>
<text x="276" y="555" class="small">本地专家计算</text>
<rect x="488" y="502" width="212" height="66" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="504" y="531" class="head">EP rank 2</text>
<text x="504" y="555" class="small">本地专家计算</text>
<rect x="716" y="502" width="212" height="66" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="732" y="531" class="head">EP rank 3</text>
<text x="732" y="555" class="small">本地专家计算</text>
<text x="32" y="605" class="">Combine 按原 Token 和路由权重归还结果，后续计算再使用这些结果。</text>
<text x="32" y="639" class="small">教学示意：TP=1，共四个设备。DP、EP 两行展示同一组设备的不同职责。</text>
</svg>
