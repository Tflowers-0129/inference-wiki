<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">HiSparse：本层等 KV，下一层可以提前搬</title>
<desc id="desc">基于社区 PR62592 合入点的教学依赖泳道，非实测。纯 decode 的共享 index group 中，leader 生成 logical top-k 后，copy stream 先做 device resolver，再顺序 gather leader 和 follower 的 KV。各层分别记录 ready event。计算流等 leader ready 后运行 leader SFA，follower 的 gather 可以与它重叠；到 follower Attention 时只需要等待 follower 自己的 ready event。共享逻辑 top-k、热行映射和 miss plan，各层搬自己的 KV 字节。Host Coordinator 只负责页生命周期和步骤传输计划，不逐层回读 top-k。Host Source 是内存数据源，不是执行流。横轴仅表示依赖顺序，条宽不代表毫秒或保证的重叠比例。</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.note{font-size:18px;fill:#475569}.blue{fill:#1d4ed8}.teal{fill:#0f766e}.orange{fill:#a64b08}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-width="1.7"/></marker>
<marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#1d4ed8" stroke-width="1.7"/></marker>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#0f766e" stroke-width="1.7"/></marker>
<marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#b45309" stroke-width="1.7"/></marker>
<pattern id="wait" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fff7ed"/><path d="M-3 3L3 -3M0 10L10 0M7 13L13 7" stroke="#c2772c" stroke-width="1"/></pattern>
</defs>
<rect width="1120" height="900" fill="#f8fafc"/>
<text x="32" y="46" class="title">HiSparse：本层等 KV，下一层可以提前搬</text>
<text x="32" y="80" class="note">基于社区 PR62592 合入点的教学泳道 · 纯 decode 的共享 index group · 横轴只表示依赖，非 ms。</text>

<rect x="32" y="110" width="1056" height="88" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
<text x="52" y="145" class="head">Host Coordinator</text>
<text x="298" y="145" class="body">管理页、发布安全副本、生成步骤传输计划</text>
<text x="298" y="180" class="note">不逐层读取 top-k；下面单独展开 forward 内的设备依赖。</text>

<path d="M250 226H1080" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250" y="216" class="note">执行依赖顺序</text>
<text x="32" y="290" class="head blue">Device compute</text>
<text x="32" y="324" class="note">同一计算流</text>
<path d="M250 285H1080" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="250" y="250" width="150" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="325" y="278" text-anchor="middle" class="body blue">Indexer</text>
<text x="325" y="305" text-anchor="middle" class="body blue">logical top-k</text>
<rect x="400" y="250" width="260" height="70" rx="4" fill="url(#wait)" stroke="#b45309" stroke-width="1.5"/>
<text x="530" y="293" text-anchor="middle" class="body orange">等本层 KV ready</text>
<rect x="660" y="250" width="150" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="735" y="293" text-anchor="middle" class="body blue">leader SFA</text>
<rect x="810" y="250" width="110" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="865" y="293" text-anchor="middle" class="body">后续算子</text>
<rect x="920" y="250" width="160" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="1000" y="293" text-anchor="middle" class="body blue">follower SFA</text>

<text x="32" y="454" class="head teal">Device copy</text>
<text x="32" y="488" class="note">共享 copy stream</text>
<path d="M250 455H1080" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="400" y="420" width="120" height="70" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="460" y="462" text-anchor="middle" class="body">resolver</text>
<rect x="520" y="420" width="140" height="70" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="590" y="462" text-anchor="middle" class="body teal">gather leader</text>
<rect x="660" y="420" width="160" height="70" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="740" y="462" text-anchor="middle" class="body teal">gather follower</text>

<path d="M400 326V414" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="414" y="367" class="body blue">top-k ready</text>
<path d="M660 414V327" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="673" y="367" class="body teal">leader ready</text>
<path d="M820 414V386H920V327" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="933" y="374" class="body teal">follower ready</text>
<text x="400" y="714" class="body">一组只解析一次：Resident → Hot → Source miss</text>
<text x="400" y="750" class="note">共享地址与 miss plan；各层 gather 各自的 KV，分别记录 ready event。</text>

<rect x="32" y="545" width="1056" height="128" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="52" y="586" class="head orange">Host Source</text>
<text x="52" y="621" class="body">内存数据源</text>
<text x="52" y="652" class="note">仅 miss 读取对应行</text>
<rect x="470" y="580" width="200" height="58" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="570" y="616" class="body orange" text-anchor="middle">leader 层 KV</text>
<rect x="700" y="580" width="230" height="58" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
<text x="815" y="616" class="body orange" text-anchor="middle">follower 层 KV</text>
<path d="M590 573V496" fill="none" stroke="#b45309" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow-orange)"/>
<path d="M740 573V496" fill="none" stroke="#b45309" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow-orange)"/>

<text x="32" y="790" class="head">本层必须等自己的 gather；follower 的 gather 可与 leader 计算重叠</text>
<text x="32" y="828" class="body">图中展示一种允许的排布：follower 在被消费前已 ready，计算流无需等整个 index group 全部完成。</text>
<text x="32" y="865" class="note">条宽与间隔不代表真实耗时或固定重叠比例；实际收益还受 miss 数量、设备资源与层间执行时间影响。</text>
</svg>
