<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1152" viewBox="0 0 1120 1152" role="img" aria-labelledby="title desc">
<title id="title">SP 先归约再分行，在需要全部 token 时收集</title>
<desc id="desc">教学数据流，四个 token、TP2、hidden 4096、BF16。两个 TP rank 的行并行输出投影各产生四行部分和。ReduceScatter 先把同一 token 的部分和相加，再让 rank0 保留 token0和1，rank1保留token2和3。每个rank持有完整hidden维，局部Norm和SP MoE消费各自行，下一Attention前AllGather恢复四行。单份激活从每rank32KiB变为16KiB，不代表进程HBM减半。KV历史的持有关系由TP和CP另行决定。图是数据依赖，不表示实测时长。</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#475569}.blue{fill:#1d4ed8}.green{fill:#0f766e}.amber{fill:#92400e}.arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
</defs>
<rect width="1120" height="1152" fill="#f8fafc"/>
<text x="32" y="46" class="title">SP：同一 token 先求和，再按行交给各 rank</text>
<text x="32" y="80" class="small">教学数据流 · TP2，四个 token，H=4096，BF16 · 箭头表示依赖，非实测时间</text>
<text x="32" y="121" class="head">① 输出投影：两边都有四行，但每行还只是部分和</text>

<rect x="32" y="144" width="504" height="166" rx="10" fill="#fff" stroke="#64748b"/>
<rect x="584" y="144" width="504" height="166" rx="10" fill="#fff" stroke="#64748b"/>
<text x="54" y="180" class="head">TP rank 0 · P0 [4,H]</text>
<text x="606" y="180" class="head">TP rank 1 · P1 [4,H]</text>
<g class="body" text-anchor="middle">
<rect x="54" y="202" width="100" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/><text x="104" y="232">P0[0]</text>
<rect x="172" y="202" width="100" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/><text x="222" y="232">P0[1]</text>
<rect x="290" y="202" width="100" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/><text x="340" y="232">P0[2]</text>
<rect x="408" y="202" width="100" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/><text x="458" y="232">P0[3]</text>
<rect x="606" y="202" width="100" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/><text x="656" y="232">P1[0]</text>
<rect x="724" y="202" width="100" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/><text x="774" y="232">P1[1]</text>
<rect x="842" y="202" width="100" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/><text x="892" y="232">P1[2]</text>
<rect x="960" y="202" width="100" height="46" rx="6" fill="#e6f4f1" stroke="#0f766e"/><text x="1010" y="232">P1[3]</text>
</g>
<text x="54" y="282" class="small">P0 来自本 rank 的权重分片</text>
<text x="606" y="282" class="small">P1 来自另一份权重分片</text>
<path d="M284 310V334H434V356" class="arrow"/>
<path d="M836 310V334H686V356" class="arrow"/>

<rect x="292" y="362" width="536" height="88" rx="10" fill="#fff7ed" stroke="#b45309"/>
<text x="560" y="396" class="head amber" text-anchor="middle">② ReduceScatter：求和 + 分行</text>
<text x="560" y="428" class="body" text-anchor="middle">Y[t] = P0[t] + P1[t]</text>
<path d="M434 450V476H284V500" class="arrow"/>
<path d="M686 450V476H836V500" class="arrow"/>

<rect x="32" y="506" width="504" height="212" rx="10" fill="#eff6ff" stroke="#1d4ed8"/>
<rect x="584" y="506" width="504" height="212" rx="10" fill="#e6f4f1" stroke="#0f766e"/>
<text x="54" y="543" class="head blue">rank 0 · token 0、1</text>
<text x="606" y="543" class="head green">rank 1 · token 2、3</text>
<text x="54" y="582" class="body">[Y[0], Y[1]] · [2,H]</text>
<text x="606" y="582" class="body">[Y[2], Y[3]] · [2,H]</text>
<text x="54" y="620" class="body">每行的 H 个元素已经完整归约</text>
<text x="606" y="620" class="body">每行的 H 个元素已经完整归约</text>
<text x="54" y="664" class="body blue">本地 Norm → Router → EP MoE</text>
<text x="606" y="664" class="body green">本地 Norm → Router → EP MoE</text>
<text x="54" y="697" class="small">MoE 返回这两行；残差按同一行归属对齐</text>
<text x="606" y="697" class="small">MoE 返回这两行；残差按同一行归属对齐</text>

<path d="M284 718V748H434V778" class="arrow"/>
<path d="M836 718V748H686V778" class="arrow"/>
<rect x="292" y="784" width="536" height="88" rx="10" fill="#fff" stroke="#64748b"/>
<text x="560" y="819" class="head" text-anchor="middle">③ 下一 Attention 前 AllGather</text>
<text x="560" y="851" class="body" text-anchor="middle">收集 token 0、1、2、3 的行，再裁去 PAD</text>
<text x="32" y="914" class="small">本图取相邻 SP MoE 层的数据边界；进入不使用 SP 的层前也需恢复完整激活。</text>

<rect x="32" y="944" width="1056" height="168" rx="10" fill="#fff" stroke="#64748b"/>
<text x="54" y="980" class="head">两本账分别计算</text>
<text x="54" y="1019" class="body">当前激活：一份 [4,4096] = 32 KiB → 每 rank [2,4096] = 16 KiB</text>
<text x="54" y="1056" class="body">历史 KV：head 由 TP 切分或复制，历史位置由 DCP 决定归属</text>
<text x="54" y="1090" class="small">SP 的激活分片不会自动改变 KV cache；上述字节数不是进程 HBM 占用。</text>
</svg>
