<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1320" viewBox="0 0 1120 1320" role="img" aria-labelledby="title desc">
  <title id="title">A5：两段融合，分别接住哪一段开销？</title>
  <desc id="desc">教学原理图，非实测时序。PR 18383 的独立量化 Lightning Indexer Manage 算子融合 TopK 与稀疏缓存管理，输出每路 TopK 地址和请求级搬运计划。首次卸载填充 C 行 Prefix 驻留缓存，稳态搬运计划是去重的 miss union。PR 18490 的独立量化 Scatter Copy Sparse Flash Attention 算子消费设备元数据，全部请求的 miss_counts 不超过512时在 attention 取数阶段融合处理；任一请求超过512时，在同一个 MIX Kernel 内先完成完整 Scatter Copy，跨核同步后执行 SFA。两项 PR 均待合入，框架与模型执行接入不在 PR 范围内，tail 和接口仍待统一。</desc>
  <metadata>Sources: https://github.com/vllm-project/vllm-ascend/pull/18383/files ; https://github.com/vllm-project/vllm-ascend/pull/18490/files ; checked 2026-11-03 ; pinned provenance is stored outside public assets.</metadata>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:20px}.note{font-size:18px;fill:#475569}.small{font-size:17px;fill:#475569}.center{text-anchor:middle}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.7}.teal{fill:#e6f4f1;stroke:#0f766e;stroke-width:1.7}.orange{fill:#fff7ed;stroke:#b45309;stroke-width:1.7}
      .link{fill:none;stroke:#475569;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="1320" fill="#f8fafc"/>
  <text class="title" x="32" y="47">A5：两段融合，分别接住哪一段开销？</text>
  <text class="note" x="32" y="80">独立算子提案，均待合入；框架 cache manager 与模型执行接入不在这两项 PR 中。</text>

  <g id="indexer-manage-stage">
    <rect class="panel" x="32" y="112" width="1056" height="476" rx="8"/>
    <text class="heading" x="56" y="148">① LI + cache manage（#18383）</text>
    <rect class="blue" x="56" y="176" width="224" height="116" rx="5"/>
    <text class="body center" x="168" y="209">Index Query / Key</text><text class="body center" x="168" y="241">Weights / Scale</text><text class="small center" x="168" y="274">A5：FP8 + FP32 scale</text>
    <rect class="blue" x="320" y="176" width="388" height="116" rx="5"/>
    <text class="body center" x="514" y="207">npu_fused_quant_</text><text class="body center" x="514" y="237">lightning_indexer_manage</text><text class="small center" x="514" y="274">TopK · 初始化 / 淘汰 · miss 计划</text>
    <rect class="teal" x="756" y="176" width="308" height="116" rx="5"/>
    <text class="body center" x="910" y="208">持久映射：source → slot</text><text class="body center" x="910" y="240">cache_slots_pool</text><text class="small center" x="910" y="274">输入 / 原地更新，跨 decode step</text>
    <path d="M280 234H320" class="link"/>
    <path d="M756 220H708" class="link"/><path d="M708 258H756" class="link"/>
    <path d="M452 292V316H296V340" class="link"/><path d="M576 292V316H812V340" class="link"/>
    <rect class="blue" x="56" y="340" width="480" height="72" rx="5"/>
    <text class="body center" x="296" y="369">每路 query 的 TopK 地址与 miss 前缀</text><text class="center" x="296" y="397" font-size="16">topk_src_ids / topk_dst_slots / topk_miss_counts</text>
    <rect class="orange" x="560" y="340" width="504" height="88" rx="5"/>
    <text class="body center" x="812" y="366">请求级搬运计划</text><text class="small center" x="812" y="392">miss_src_ids / miss_dst_slots / miss_counts</text>
    <text class="center" x="812" y="416" font-size="16">首次卸载填 C 行；稳态搬运去重 miss union</text>
    <rect x="56" y="436" width="1008" height="128" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="note" x="72" y="464">稳态去重算例（缩小 TopK，仅演示计数）</text>
    <text class="body" x="72" y="500">query 0 miss = {10, 14}</text><text class="body" x="72" y="538">query 1 miss = {14, 18}</text>
    <path d="M372 494H448V520H508" class="link"/><path d="M372 534H448V520" fill="none" stroke="#475569" stroke-width="2"/>
    <text class="body" x="536" y="502">request union = {10, 14, 18}</text><text class="body" x="536" y="540">miss_counts = 3；token 14 只搬一次</text>
  </g>

  <g id="integration-boundary">
    <path d="M560 588V650" class="link"/>
    <rect x="144" y="605" width="832" height="32" rx="4" fill="#f8fafc"/>
    <text class="note center" x="560" y="628">设备 metadata / 请求级搬运计划 → 下游；框架接入时仍须统一 tail 与接口</text>
  </g>

  <g id="copy-attention-stage">
    <rect class="panel" x="32" y="664" width="1056" height="520" rx="8"/>
    <text class="heading" x="56" y="700">② Scatter Copy + SFA（#18490）</text>
    <text class="note" x="56" y="730">npu_fused_quant_scatter_copy_sparse_flash_attention</text>
    <rect class="blue" x="260" y="760" width="600" height="58" rx="5"/>
    <text class="body center" x="560" y="796">设备端判断：所有请求的 miss_counts 都 ≤512？</text>
    <path d="M408 818V838H300V868" class="link"/><path d="M712 818V838H820V868" class="link"/>
    <text class="note" x="62" y="851">是：全部 ≤512</text><text class="note" x="864" y="851">否：任一 &gt;512</text>

    <g id="fused-miss-path">
      <rect class="teal" x="56" y="868" width="488" height="222" rx="6"/>
      <text class="heading" x="76" y="903">fused-miss 路径</text>
      <text class="body" x="76" y="942">Attention 取数时识别 miss 来源</text>
      <text class="body" x="76" y="978">DRAM miss / HBM hit → 本次计算</text>
      <text class="body" x="76" y="1014">新加载 KV 写回 HBM，留待后续复用</text>
      <text class="note" x="76" y="1062">取数、写回与 attention 流水配合</text>
    </g>
    <g id="union-copy-fallback">
      <rect class="orange" x="576" y="868" width="488" height="222" rx="6"/>
      <text class="heading" x="596" y="903">union-copy 回退路径</text>
      <rect x="596" y="926" width="448" height="50" rx="4" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
      <text class="body center" x="820" y="958">先完成请求级搬运计划 Scatter Copy</text>
      <path d="M820 976V1014" class="link"/>
      <text class="note" x="838" y="1002">跨核同步</text>
      <rect x="596" y="1014" width="448" height="50" rx="4" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
      <text class="body center" x="820" y="1046">再执行 Sparse Flash Attention</text>
    </g>
    <text class="body center" x="560" y="1126">两个分支均在同一个 MIX Kernel 内执行；路径选择无需 miss 数 D2H。</text>
    <text class="note center" x="560" y="1160">结果：更新 HBM KV Cache，并写出 attention_out [T, N, 512]</text>
  </g>

  <g id="reading-notes">
    <text class="note" x="32" y="1220">教学原理图，非实测时长。512 阈值按单请求搬运数判断，不按单 query 或全 batch 求和。</text>
    <text class="note" x="32" y="1250">两项 PR 尚未形成可直接拼接的完整框架路径；tail 槽位、有效长度与张量 shape 仍须对齐。</text>
    <text class="small" x="32" y="1288">DRAM 输入使用设备可访问的 swapped-memory Tensor；该 Torch 接口不能直接传入普通 CPU Tensor。</text>
  </g>
</svg>
