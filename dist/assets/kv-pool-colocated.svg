<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="744" viewBox="0 0 1000 744" role="img" aria-labelledby="title desc">
  <title id="title">单机混部的 KV 路径：同一前缀从 HBM 页 3 存入 Host，再载入 HBM 页 9</title>
  <desc id="desc">两条 SQL 代码补全请求的前 128 个 token 相同，最后一个 token 从 R1 的 100 改成 R2 的 500。这个变体在同一台机器、同一个混部实例上执行。第一次计算后，Worker 将第 3 页的 K 与 V 写入同机 Store 段。第二次本地未命中时，Scheduler 查询得知共享池命中 128 个 token。Worker 将公共前缀的 K、V 读入新分配的第 9 页，再计算 500。下方给出一次读写的字节地址。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d}
      .title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:650}.body{font-size:19px}.small{font-size:16px}
      .teal{fill:#0f766e}.blue{fill:#1d4ed8}.note{fill:#475569}.rust{fill:#9a420e}
      .center{text-anchor:middle}.box{stroke-width:1.5}.panel{fill:white;stroke:#94a3b8}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#0f766e" stroke-width="1.6"/></marker>
    <marker id="query" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#1d4ed8" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1000" height="744" rx="16" fill="#f8fafc"/>
  <text x="26" y="43" class="title">单机混部的一次存入与一次命中</text>
  <text x="26" y="74" class="body note">同一混部实例先处理 R1，再处理 R2。前 128 个 token 相同，末尾的 100 换成 500。</text>

  <g id="lookup">
    <rect x="24" y="98" width="952" height="143" rx="12" fill="#eff6ff" stroke="#7294ce" class="box"/>
    <text x="46" y="129" class="head blue">第二条请求怎样查到前缀</text>
    <text x="46" y="163" class="body">Scheduler</text>
    <text x="46" y="193" class="small note">本地命中 0</text>
    <path d="M164 165H292" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#query)"/>
    <text x="220" y="152" class="small blue center">块哈希 / 组号</text>
    <text x="310" y="163" class="body">本实例的查询 Worker</text>
    <text x="310" y="193" class="small note">用模型、分片、组和哈希生成键</text>
    <path d="M540 165H655" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#query)"/>
    <text x="595" y="152" class="small blue center">按键查找</text>
    <text x="678" y="163" class="body">Store 元数据</text>
    <text x="678" y="193" class="small note">确认公共前缀的 KV 可读</text>
    <text x="46" y="222" class="small blue">Scheduler 得到命中长度（128 个 token）后分配目标页，Worker 再按键发起 GET。</text>
  </g>

  <text x="26" y="284" class="head">公共前缀的 32 KiB 如何写入、读回</text>
  <text x="26" y="313" class="small note">从左至右依次是 R1 写出和 R2 读回。Store 的内存段位于同一台机器。</text>

  <g id="first-request">
    <rect x="25" y="339" width="218" height="184" rx="12" fill="#eaf6f3" stroke="#438d81" class="box"/>
    <text x="43" y="373" class="head teal">R1 · NPU HBM</text>
    <text x="43" y="408" class="body">页 3 · 公共前缀 KV</text>
    <rect x="43" y="430" width="85" height="40" rx="4" fill="#fff" stroke="#438d81"/>
    <rect x="138" y="430" width="85" height="40" rx="4" fill="#fff" stroke="#438d81"/>
    <text x="85" y="456" class="body center">K[3]</text><text x="180" y="456" class="body center">V[3]</text>
    <text x="43" y="499" class="small note">两个已注册的地址片段</text>
  </g>

  <g id="store-object">
    <rect x="368" y="339" width="264" height="184" rx="12" fill="#fff7ed" stroke="#af7137" class="box"/>
    <text x="388" y="373" class="head rust">同机 Host DRAM</text>
    <text x="388" y="408" class="body">公共前缀 KV 的起始地址 s</text>
    <rect x="388" y="430" width="112" height="40" fill="#fff" stroke="#af7137"/>
    <rect x="500" y="430" width="112" height="40" fill="#ffedd5" stroke="#af7137"/>
    <text x="444" y="456" class="small center">K · 16 KiB</text><text x="556" y="456" class="small center">V · 16 KiB</text>
    <text x="388" y="499" class="small note">偏移 0</text><text x="508" y="499" class="small note">偏移 16 KiB</text>
  </g>

  <g id="second-request">
    <rect x="757" y="339" width="218" height="184" rx="12" fill="#eaf6f3" stroke="#438d81" class="box"/>
    <text x="775" y="373" class="head teal">R2 · NPU HBM</text>
    <text x="775" y="408" class="body">已分配本地页 9</text>
    <rect x="775" y="430" width="85" height="40" rx="4" fill="#fff" stroke="#438d81"/>
    <rect x="869" y="430" width="85" height="40" rx="4" fill="#fff" stroke="#438d81"/>
    <text x="817" y="456" class="body center">K[9]</text><text x="911" y="456" class="body center">V[9]</text>
    <text x="775" y="499" class="small note">载入后再计算 500</text>
  </g>

  <g id="copy">
    <path d="M632 449H754" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M243 449H365" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="305" y="422" class="head teal center">PUT</text><text x="305" y="478" class="small teal center">D2H 写入</text>
    <text x="694" y="422" class="head teal center">GET</text><text x="694" y="478" class="small teal center">H2D 读回</text>
  </g>

  <g id="descriptors">
    <rect x="24" y="550" width="952" height="167" rx="12" class="box panel"/>
    <text x="46" y="582" class="head">Worker 如何填地址与长度</text>
    <text x="46" y="617" class="body">每个 K 或 V 页有 128 × 1 个 KV head × 64 维 × 2 B（BF16）= 16,384 B。</text>
    <text x="46" y="650" class="body">本例 K、V 分开存放，各自的页按页号连续排列。写 K 取 K 基址 + 3 × 16,384 B。</text>
    <text x="46" y="683" class="body">读回 K 写到 K 基址 + 9 × 16,384 B。V 使用自己的基址，读取对象后半段。</text>
  </g>
</svg>
