<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">五行前向，三行 logits，两个有效输出</title><desc id="desc">线性层共用权重；Attention 通过请求边界、块表和有效长度隔离历史。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:21px;font-weight:600}.head{font-size:16px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}.blue{font-size:16px;fill:#2763b0}.teal{font-size:16px;fill:#157b78}.orange{font-size:16px;fill:#a96524}</style></defs><rect width="960" height="404" fill="#fff"/><text x="32" y="38" class="title">五行前向，三行 logits，两个有效输出</text><text x="32" y="65" class="small">线性层共用权重；Attention 通过请求边界、块表和有效长度隔离历史。</text><rect x="32" y="100" width="166" height="60" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="48" y="125" class="head">五行隐藏状态</text><text x="48" y="148" class="mono">[5,H]</text><path d="M198 130 L232 130" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="234" y="100" width="192" height="60" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="250" y="125" class="head">Norm · QKV · RoPE</text><text x="250" y="148" class="small">positions 决定位置</text><path d="M426 130 L460 130" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="462" y="100" width="196" height="60" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="478" y="125" class="head">Attention</text><text x="478" y="148" class="small">每条请求独立的因果范围</text><path d="M658 130 L692 130" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="694" y="100" width="234" height="60" rx="6" fill="#edf4fe" stroke="#d8e1eb"/><text x="710" y="125" class="head">投影 · 残差 · MLP</text><text x="710" y="148" class="small">五行继续进入下一层</text><rect x="234" y="226" width="424" height="108" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/><text x="250" y="251" class="head">本层 KV cache</text><text x="250" y="279" class="mono">写：5 行新 K/V → [36,25,34,35,12]</text><text x="250" y="309" class="body">读：A 读 9；B 读 6；C 逐行读 3 / 4 / 5</text><path d="M330 160 V226" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="342" y="202" class="small">K / V</text><path d="M560 226 V160" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="574" y="202" class="small">块表 + 长度</text><text x="438" y="112" class="small">Q</text><rect x="694" y="226" width="234" height="108" rx="6" fill="#fff4e7" stroke="#d8e1eb"/><text x="710" y="251" class="head">末层之后</text><text x="710" y="280" class="mono">取行 [0,1,4] → 3 行 logits</text><text x="710" y="309" class="mono">有效输出数 [1,1,0]</text><path d="M810 160 V226" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="376" class="small">依赖示意：方框不对应 kernel 数；C 未完成 Prompt，KV 保留但本轮没有生成输出。</text></svg>