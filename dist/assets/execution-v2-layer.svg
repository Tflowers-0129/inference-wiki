<svg xmlns="http://www.w3.org/2000/svg" width="960" height="594" viewBox="0 0 960 594" role="img" aria-labelledby="title desc">
<title id="title">2050 行前向，三行 logits，两个有效输出</title><desc id="desc">同一批次 A / B 各 1 行 Decode，C 有 2048 行 Prefill；GQA 采用 32 个 Q heads、8 个 KV heads。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#607086"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#22334b}.title{font-size:21px;font-weight:600}.head{font-size:16px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#607086}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:15px}</style></defs>
<rect width="960" height="594" fill="#fff"/>
<text x="32" y="38" class="title">2050 行前向，三行 logits，两个有效输出</text>
<text x="32" y="65" class="small">同一批次 A / B 各 1 行 Decode，C 有 2048 行 Prefill；GQA 采用 32 个 Q heads、8 个 KV heads。</text>
<rect x="32" y="100" width="166" height="108" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="48" y="128" class="head">2050 行隐藏状态</text>
<text x="48" y="158" class="mono">[2050,H]</text>
<text x="48" y="188" class="small">全批参与前向</text>
<path d="M198 154 H232" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="234" y="100" width="204" height="108" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="250" y="128" class="head">Norm · QKV · RoPE</text>
<text x="250" y="158" class="mono">Q [2050,32,128]</text>
<text x="250" y="188" class="mono">K/V [2050,8,128]</text>
<path d="M438 154 H472" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="447" y="140" class="small">Q</text>
<rect x="474" y="100" width="184" height="108" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="490" y="128" class="head">Attention</text>
<text x="490" y="158" class="small">按请求隔离历史</text>
<text x="490" y="188" class="small">32 Q / 8 KV heads</text>
<path d="M658 154 H692" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="694" y="100" width="234" height="108" rx="6" fill="#edf4fe" stroke="#d8e1eb"/>
<text x="710" y="128" class="head">投影 · 残差 · MLP</text>
<text x="710" y="158" class="body">2050 行进入下一层</text>
<text x="710" y="188" class="mono">头宽 d=128</text>
<rect x="234" y="274" width="424" height="194" rx="6" fill="#eaf6f3" stroke="#d8e1eb"/>
<text x="250" y="302" class="head">本层 KV cache</text>
<text x="250" y="333" class="body">写：2050 行新 K/V</text>
<text x="250" y="365" class="body">A 读 4128 个位置；B 读 8256 个位置</text>
<text x="250" y="397" class="body">C 的 2048 行 Q 依次可见</text>
<text x="250" y="429" class="mono">4097,4098,…,6144 个位置</text>
<path d="M330 208 V274" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="344" y="246" class="small">K / V</text>
<path d="M560 274 V208" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="574" y="246" class="small">页表 + 长度</text>
<rect x="694" y="274" width="234" height="194" rx="6" fill="#fff4e7" stroke="#d8e1eb"/>
<text x="710" y="302" class="head">末层之后</text>
<text x="710" y="333" class="mono">取行 [0,1,2049]</text>
<text x="710" y="365" class="body">→ 3 行 logits</text>
<text x="710" y="397" class="mono">有效输出数 [1,1,0]</text>
<text x="710" y="429" class="mono">C：6144 &lt; 8192</text>
<path d="M810 208 V274" fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="32" y="511" class="small">线性层共享权重；2050 行没有缩成图中展示的几个位置。</text>
<text x="32" y="540" class="small">C 继续保留本轮 KV，但 Prompt 尚未结束，本轮没有生成输出。</text>
<text x="32" y="569" class="small">数据依赖示意：方框不对应 kernel 数，不表示实测耗时。</text>
</svg>
