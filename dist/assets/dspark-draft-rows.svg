<svg xmlns="http://www.w3.org/2000/svg" width="350" height="377" viewBox="0 0 350 377" role="img" aria-labelledby="title desc">
<title id="title">DSpark 的三行草稿与四行验证</title><desc id="desc">从 anchor 采样、单请求且没有填充时，三行草稿输入一次计算。随后 Target 用 anchor 和三个实际候选做四行验证。</desc>
<style>
text {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182d48}
.heading{font-size:18px;font-weight:700}.sub{font-size:13px;fill:#475569}.label{font-size:15px;font-weight:650}.cell{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}.field{font-size:13px;font-variant-numeric:tabular-nums}.soft{fill:#4c5d71}
</style>
<rect width="350" height="377" fill="#f8fafc"/>
<text x="14" y="27" text-anchor="start" class="heading">DSpark 的三行草稿与四行验证</text>
<text x="14" y="51" text-anchor="start" class="sub">R 的有效 Target KV 长度为 11，下一输入是 x</text>
<text x="14" y="78" text-anchor="start" class="label">草稿块一次前向 · 从 anchor 采样</text>
<rect x="14.0" y="88" width="104.0" height="49" rx="5" fill="#e4f4ef" stroke="#7ca99b"/>
<text x="66.0" y="108" text-anchor="middle" class="cell">x</text>
<text x="66.0" y="127" text-anchor="middle" class="sub">位置 11</text>
<rect x="123.0" y="88" width="104.0" height="49" rx="5" fill="#e4f4ef" stroke="#7ca99b"/>
<text x="175.0" y="108" text-anchor="middle" class="cell">占位</text>
<text x="175.0" y="127" text-anchor="middle" class="sub">位置 12</text>
<rect x="232.0" y="88" width="104.0" height="49" rx="5" fill="#e4f4ef" stroke="#7ca99b"/>
<text x="284.0" y="108" text-anchor="middle" class="cell">占位</text>
<text x="284.0" y="127" text-anchor="middle" class="sub">位置 13</text>
<text x="14" y="157" text-anchor="start" class="field">query 边界 [0, 3]，草稿序列长度 11 + 3 = 14</text>
<path d="M20 168v13m-4 -4 4 4 4 -4" fill="none" stroke="#64748b" stroke-width="1.7"/>
<text x="34" y="181" text-anchor="start" class="field">按前一枚 token 调整各行 logits，顺序采样</text>
<rect x="14" y="197" width="322" height="33" rx="5" fill="#fff4e4" stroke="#cda675"/>
<text x="175" y="219" text-anchor="middle" class="cell">x  →  e1@12  →  e2@13  →  e3@14</text>
<path d="M20 239v13m-4 -4 4 4 4 -4" fill="none" stroke="#64748b" stroke-width="1.7"/>
<text x="34" y="253" text-anchor="start" class="field">三个候选都进入下一轮 Target</text>
<text x="14" y="281" text-anchor="start" class="label">Target 验证 · 输入真实 token</text>
<rect x="14.0" y="291" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="52.375" y="311" text-anchor="middle" class="cell">x</text>
<text x="52.375" y="330" text-anchor="middle" class="sub">位置 11</text>
<rect x="95.75" y="291" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="134.125" y="311" text-anchor="middle" class="cell">e1</text>
<text x="134.125" y="330" text-anchor="middle" class="sub">位置 12</text>
<rect x="177.5" y="291" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="215.875" y="311" text-anchor="middle" class="cell">e2</text>
<text x="215.875" y="330" text-anchor="middle" class="sub">位置 13</text>
<rect x="259.25" y="291" width="76.75" height="49" rx="5" fill="#e5f1fd" stroke="#88a7ce"/>
<text x="297.625" y="311" text-anchor="middle" class="cell">e3</text>
<text x="297.625" y="330" text-anchor="middle" class="sub">位置 14</text>
<text x="14" y="361" text-anchor="start" class="field">query 边界 [0, 4]，验证序列长度 11 + 4 = 15</text>
</svg>
