<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc">
<title id="title">Metadata 为什么会把一轮前向卡在 Host 上</title><desc id="desc">对照设备结果回到 CPU 再构造 metadata 的路径，与在设备上通过 Triton 派生 metadata 的路径。区分 Host 等待、碎片化提交与设备依赖。所有时间和块宽均为示意。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#b45309" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="1080" rx="20" fill="#f8fafc"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700">Metadata 很小，等待链可能很长</text>
<text x="32" y="80" font-size="18" fill="#475569" font-weight="400">以投机验证后的有效长度为例：计算结果在哪里产生，下一个消费者在哪里读取？</text>
<rect x="32" y="104" width="1056" height="306" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="137" font-size="21" fill="#b45309" font-weight="700">路径 A · CPU 必须读到精确结果，才能继续构造和提交</text>
<rect x="52" y="168" width="168" height="94" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="136.0" y="208.0" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="middle">NPU 验证</text>
<text x="136.0" y="235.0" font-size="17" fill="#1d4ed8" font-weight="400" text-anchor="middle">接受数 / 有效长度</text>
<path d="M224 215L251 215" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="256" y="168" width="168" height="94" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="340.0" y="208.0" font-size="17" fill="#b45309" font-weight="600" text-anchor="middle">D2H</text>
<text x="340.0" y="235.0" font-size="17" fill="#b45309" font-weight="400" text-anchor="middle">结果回到 Host</text>
<path d="M428 215L455 215" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="460" y="168" width="168" height="94" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="544.0" y="208.0" font-size="17" fill="#b45309" font-weight="600" text-anchor="middle">CPU 读取与构造</text>
<text x="544.0" y="235.0" font-size="17" fill="#b45309" font-weight="400" text-anchor="middle">长度 / 索引 / 输入</text>
<path d="M632 215L659 215" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="664" y="168" width="168" height="94" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="748.0" y="208.0" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="middle">H2D</text>
<text x="748.0" y="235.0" font-size="17" fill="#1d4ed8" font-weight="400" text-anchor="middle">metadata 送回设备</text>
<path d="M836 215L863 215" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="868" y="168" width="168" height="94" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="952.0" y="208.0" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="middle">下一轮前向</text>
<text x="952.0" y="235.0" font-size="17" fill="#1d4ed8" font-weight="400" text-anchor="middle">消费真实有效范围</text>
<path d="M52 301L452 301" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5"/>
<text x="52" y="332" font-size="18" fill="#172b4d" font-weight="500">Host 等待：不仅是复制几个整数，还要等设备执行到结果产生的位置。</text>
<text x="52" y="365" font-size="18" fill="#475569" font-weight="400">若 CPU 此时无法提交后续工作、设备也无其他任务，这段依赖才暴露为空泡。</text>
<rect x="32" y="430" width="1056" height="340" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="465" font-size="21" fill="#0f766e" font-weight="700">路径 B · 派生值留在设备，CPU 继续处理已知的计划信息</text>
<rect x="52" y="491" width="984" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="544.0" y="528.5" font-size="18" fill="#172b4d" font-weight="600" text-anchor="middle">CPU：请求选择 / token 预算 / 容量与已知形状 / 占位记账</text>
<rect x="52" y="584" width="235" height="100" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="169.5" y="627.0" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">设备上的真实结果</text>
<text x="169.5" y="654.0" font-size="18" fill="#0f766e" font-weight="400" text-anchor="middle">有效计数 / 接受边界</text>
<rect x="335" y="584" width="403" height="100" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="536.5" y="627.0" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">Triton 派生 metadata</text>
<text x="536.5" y="654.0" font-size="18" fill="#0f766e" font-weight="400" text-anchor="middle">positions / slot mapping / 索引</text>
<rect x="786" y="584" width="250" height="100" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="911.0" y="627.0" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">下一轮 consumer</text>
<text x="911.0" y="654.0" font-size="18" fill="#0f766e" font-weight="400" text-anchor="middle">使用真实有效范围</text>
<path d="M292 634L330 634" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<path d="M743 634L781 634" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="52" y="723" font-size="18" fill="#172b4d" font-weight="500">设备流仍需等待生产者就绪；event 保留数据依赖，CPU 不必读取每个中间值。</text>
<text x="52" y="752" font-size="17" fill="#475569" font-weight="400">容量上界与有效范围分别表达；只有后续算子支持 padding / mask，才可这样衔接。</text>
<text x="32" y="810" font-size="22" fill="#172b4d" font-weight="700">看 Trace 时，把三种成本分开</text>
<rect x="32" y="832" width="336" height="134" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="50" y="865" font-size="20" fill="#b45309" font-weight="700">① Host 等待</text>
<text x="50" y="902" font-size="16" fill="#172b4d" font-weight="400">.item() / .tolist() / event 等待</text>
<text x="50" y="931" font-size="16" fill="#172b4d" font-weight="400">若读取设备结果，可能阻断提交。</text>
<rect x="392" y="832" width="336" height="134" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="410" y="865" font-size="20" fill="#1d4ed8" font-weight="700">② 小 kernel 与重复 copy</text>
<text x="410" y="902" font-size="16" fill="#172b4d" font-weight="400">即使没有 Host 同步，</text>
<text x="410" y="931" font-size="16" fill="#172b4d" font-weight="400">提交和中间访存也会占用时间。</text>
<rect x="752" y="832" width="336" height="134" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="770" y="865" font-size="20" fill="#0f766e" font-weight="700">③ 设备侧依赖</text>
<text x="770" y="902" font-size="16" fill="#172b4d" font-weight="400">consumer 等待 producer 就绪，</text>
<text x="770" y="931" font-size="16" fill="#172b4d" font-weight="400">是保证输入正确所需的先后关系。</text>
<text x="32" y="1004" font-size="18" fill="#172b4d" font-weight="600">融合可减少 launch 和中间读写；若下游仍要求 Host 精确值，同步仍然存在。</text>
<text x="32" y="1040" font-size="17" fill="#475569" font-weight="400">示意图，无实测时长；具体可用路径取决于后端、算子与配置。</text>
</svg>
