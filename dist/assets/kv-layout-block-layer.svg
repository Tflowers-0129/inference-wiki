<svg xmlns="http://www.w3.org/2000/svg" width="350" height="410" viewBox="0 0 350 410" role="img" aria-labelledby="title desc">
  <title id="title">同一物理块在两种布局中的页序</title>
  <desc id="desc">同组稠密缓存的 L、B、H、N、C 分别为 2、3、2、4、2，每页 16 个元素且无填充。两条地址轴均从左到右递增。LBHNC 先排列 L0 的三个块，再排列 L1 的三个块，B1 的两页分开。BLHNC 先排块，每个块内排两层，B1 的两页相邻。橙点标出相同坐标 L1、B1、H1、N2、C0，页内偏移为 12，两个布局的元素偏移分别为 76 和 60。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .label{font-size:18px;font-weight:650}
      .minor{font-size:15px;fill:#475569}
      .mono,.mono text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .tick{font-size:14px;fill:#475569}
      .center{text-anchor:middle}
      .blue{fill:#1d4ed8}
      .orange{fill:#9a3412}
      .group{fill:none;stroke:#64748b;stroke-width:1.2}
      .memory{fill:#f8fafc;stroke:#64748b;stroke-width:1.2}
      .b1{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.4}
      .divider{fill:none;stroke:#64748b}
      .target{fill:none;stroke:#b45309;stroke-width:1.7}
    </style>
  </defs>

  <rect width="350" height="410" fill="#fff"/>
  <text x="18" y="27" class="minor mono">[L,B,H,N,C] = [2,3,2,4,2]</text>
  <text x="18" y="51" class="minor">每页 16 个元素 · 无填充</text>
  <path d="M18 65H330" fill="none" stroke="#cbd5e1"/>

  <text x="18" y="88" class="label">LBHNC · 按层</text>
  <text x="242" y="88" class="minor">元素偏移 →</text>
  <g class="label center">
    <text x="96" y="114">L0</text>
    <text x="252" y="114">L1</text>
  </g>
  <path d="M18 126V120H174V126M174 126V120H330V126" class="group"/>

  <rect x="18" y="132" width="312" height="34" class="memory"/>
  <rect x="70" y="132" width="52" height="34" class="b1"/>
  <rect x="226" y="132" width="52" height="34" class="b1"/>
  <path d="M174 132V166" class="divider"/>
  <g class="label center">
    <text x="44" y="155">B0</text>
    <text x="96" y="155" class="blue">B1</text>
    <text x="148" y="155">B2</text>
    <text x="200" y="155">B0</text>
    <text x="252" y="155" class="blue">B1</text>
    <text x="304" y="155">B2</text>
  </g>
  <path d="M18 166V172M70 166V172M122 166V172M174 166V172M226 166V172M278 166V172M330 166V172"
        class="divider"/>
  <g class="tick mono center">
    <text x="18" y="187">0</text><text x="70" y="187">16</text><text x="122" y="187">32</text>
    <text x="174" y="187">48</text><text x="226" y="187">64</text><text x="278" y="187">80</text><text x="330" y="187">96</text>
  </g>
  <circle cx="265" cy="166" r="3" fill="#b45309"/>
  <path d="M265 169V192" class="target"/>
  <text x="265" y="211" class="label orange center">76</text>

  <text x="18" y="243" class="label">BLHNC · 按块</text>
  <text x="242" y="243" class="minor">元素偏移 →</text>
  <g class="label center">
    <text x="70" y="269">B0</text>
    <text x="174" y="269" class="blue">B1</text>
    <text x="278" y="269">B2</text>
  </g>
  <path d="M18 281V275H122V281M122 281V275H226V281M226 281V275H330V281" class="group"/>

  <rect x="18" y="287" width="312" height="34" class="memory"/>
  <rect x="122" y="287" width="104" height="34" class="b1"/>
  <path d="M70 287V321M174 287V321M278 287V321" class="divider"/>
  <g class="label center">
    <text x="44" y="310">L0</text>
    <text x="96" y="310">L1</text>
    <text x="148" y="310" class="blue">L0</text>
    <text x="200" y="310" class="blue">L1</text>
    <text x="252" y="310">L0</text>
    <text x="304" y="310">L1</text>
  </g>
  <path d="M18 321V327M70 321V327M122 321V327M174 321V327M226 321V327M278 321V327M330 321V327"
        class="divider"/>
  <g class="tick mono center">
    <text x="18" y="342">0</text><text x="70" y="342">16</text><text x="122" y="342">32</text>
    <text x="174" y="342">48</text><text x="226" y="342">64</text><text x="278" y="342">80</text><text x="330" y="342">96</text>
  </g>
  <circle cx="213" cy="321" r="3" fill="#b45309"/>
  <path d="M213 324V347" class="target"/>
  <text x="213" y="366" class="label orange center">60</text>

  <circle cx="20" cy="390" r="3" fill="#b45309"/>
  <text x="32" y="396" class="minor mono">L1 · B1 · H1 · N2 · C0</text>
  <text x="242" y="396" class="minor">页内偏移 12</text>
</svg>
