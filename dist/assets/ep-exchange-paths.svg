<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1240" viewBox="0 0 1120 1240" role="img" aria-labelledby="title desc">
<title id="title">两种交换布局：先聚合全部输入，还是按目标发送？</title><desc id="desc">教学机制图，非实测。AllGather路径把输入聚合到各rank，按本地专家筛选后用Grouped MatMul计算，再以ReduceScatter按原行归还局部贡献。目标路由路径按专家归属打包输入，由目标rank计算后通过combine逆映射回原行。四rank布局只展开rank0和rank1，另外两rank同理。X由X0、X1、X2、X3四组输入组成。图只比较数据布局及归属，不提供流量公式、耗时或性能结论。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .t{fill:#172b4d} .muted{fill:#475569}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="1240" fill="#f8fafc"/>
<text x="32" y="47" font-size="28" fill="#172b4d" font-weight="700">两种交换布局：先聚合全部输入，还是按目标发送？</text>
<text x="32" y="80" font-size="18" fill="#475569" font-weight="400">教学示意，非实测 · X=[X₀;X₁;X₂;X₃]；仅展开 rank 0/1，另外两 rank 同理。</text>
<rect x="32" y="112" width="1056" height="488" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52" y="150" font-size="23" fill="#1d4ed8" font-weight="700">A. AllGather → 本地筛选 / GMM → ReduceScatter</text>
<rect x="56" y="192" width="242" height="196" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="76" y="231" font-size="19" fill="#1d4ed8" font-weight="600">按来源 rank 分片的输入</text>
<text x="76" y="276" font-size="22" fill="#172b4d" font-weight="400">rank 0/1：X₀ / X₁</text>
<text x="76" y="318" font-size="22" fill="#172b4d" font-weight="400">rank 2/3：X₂ / X₃</text>
<text x="76" y="361" font-size="18" fill="#475569" font-weight="400">每个 Xᵣ 含十行激活</text>
<rect x="354" y="224" width="206" height="106" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="457" y="261" font-size="23" fill="#6d28d9" font-weight="700" text-anchor="middle">AllGather</text>
<text x="457" y="299" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">聚合所有输入</text>
<path d="M309 277L343 277" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M571 277L590 277L590 240L615 240" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M590 277L590 387L615 387" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="628" y="184" width="436" height="112" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="648" y="216" font-size="20" fill="#1d4ed8" font-weight="600">rank 0：都有完整 X</text>
<text x="648" y="250" font-size="19" fill="#172b4d" font-weight="400">筛选本 rank 专家需要的行 → GMM</text>
<text x="648" y="281" font-size="18" fill="#475569" font-weight="400">输出：按原行对齐的局部贡献</text>
<rect x="628" y="332" width="436" height="112" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="648" y="364" font-size="20" fill="#1d4ed8" font-weight="600">rank 1：都有完整 X</text>
<text x="648" y="398" font-size="19" fill="#172b4d" font-weight="400">筛选本 rank 专家需要的行 → GMM</text>
<text x="648" y="429" font-size="18" fill="#475569" font-weight="400">输出：按原行对齐的局部贡献</text>
<path d="M1064 240L1076 240L1076 523L718 523" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1064 388L1076 388" fill="none" stroke="#0f766e" stroke-width="2"/>
<rect x="354" y="482" width="352" height="82" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="530" y="514" font-size="22" fill="#0f766e" font-weight="700" text-anchor="middle">ReduceScatter</text>
<text x="530" y="546" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">合并各 rank 对原行的贡献</text>
<path d="M343 523L309 523" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="56" y="482" width="242" height="82" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="177" y="514" font-size="20" fill="#0f766e" font-weight="600" text-anchor="middle">回到来源 rank</text>
<text x="177" y="546" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">原行分片 Y₀…Y₃</text>
<rect x="32" y="640" width="1056" height="488" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52" y="678" font-size="23" fill="#0f766e" font-weight="700">B. 按目标 rank 路由 → 本地 GMM → 按原行回传</text>
<rect x="56" y="728" width="242" height="196" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="76" y="767" font-size="19" fill="#1d4ed8" font-weight="600">按来源 rank 分片的输入</text>
<text x="76" y="812" font-size="22" fill="#172b4d" font-weight="400">rank 0/1：X₀ / X₁</text>
<text x="76" y="854" font-size="22" fill="#172b4d" font-weight="400">rank 2/3：X₂ / X₃</text>
<text x="76" y="897" font-size="18" fill="#475569" font-weight="400">保存原行与专家对应关系</text>
<rect x="354" y="760" width="206" height="128" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="457" y="795" font-size="23" fill="#6d28d9" font-weight="700" text-anchor="middle">dispatch</text>
<text x="457" y="831" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">按专家归属打包</text>
<text x="457" y="865" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">发送至目标 rank</text>
<path d="M309 824L343 824" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M571 824L590 824L590 775L615 775" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M590 824L590 923L615 923" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="628" y="720" width="436" height="112" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="648" y="752" font-size="20" fill="#1d4ed8" font-weight="600">rank 0：只收本地专家要消费的行</text>
<text x="648" y="786" font-size="19" fill="#172b4d" font-weight="400">按专家组织 → GMM</text>
<text x="648" y="817" font-size="18" fill="#475569" font-weight="400">保留返回来源与原行的映射</text>
<rect x="628" y="868" width="436" height="112" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="648" y="900" font-size="20" fill="#1d4ed8" font-weight="600">rank 1：只收本地专家要消费的行</text>
<text x="648" y="934" font-size="19" fill="#172b4d" font-weight="400">按专家组织 → GMM</text>
<text x="648" y="965" font-size="18" fill="#475569" font-weight="400">保留返回来源与原行的映射</text>
<path d="M1064 776L1076 776L1076 1051L718 1051" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1064 924L1076 924" fill="none" stroke="#0f766e" stroke-width="2"/>
<rect x="354" y="1010" width="352" height="82" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="530" y="1042" font-size="22" fill="#0f766e" font-weight="700" text-anchor="middle">combine / 逆向回传</text>
<text x="530" y="1074" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">按原行恢复并合并专家结果</text>
<path d="M343 1051L309 1051" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="56" y="1010" width="242" height="82" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="177" y="1042" font-size="20" fill="#0f766e" font-weight="600" text-anchor="middle">回到来源 rank</text>
<text x="177" y="1074" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">原行分片 Y₀…Y₃</text>
<text x="32" y="1170" font-size="19" fill="#b45309" font-weight="600">本地任务可以留在本 rank；dispatch 这个名字不代表每个任务都会经过网络。</text>
<text x="32" y="1206" font-size="18" fill="#475569" font-weight="400">实际通信量与速度还取决于 top-k、专家放置、padding、拓扑和后端，不能从这张布局图直接推断。</text>
</svg>
