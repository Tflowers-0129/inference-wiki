<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="665" viewBox="0 0 1120 665" role="img" aria-labelledby="title desc"><title id="title">ND → NZ：转换出现在哪里，决定能否移出循环</title><desc id="desc">依据 NDNZ 截图重画的路径对比；优化后是假设可复用输入的条件示意，无后测证据。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#52657b"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="1120" height="665" fill="#f8fbff"/><text x="38" y="49" font-size="29" fill="#17304d" font-weight="650">ND → NZ：转换出现在哪里，决定能否移出循环</text><text x="38" y="85" font-size="20" fill="#52657b" font-weight="400">原图可见 ND → FRACTAL_NZ 后接 MatMul；后态为带条件的优化假设</text><rect x="30" y="112" width="1060" height="196" rx="9" fill="#ffffff"/><text x="52" y="151" font-size="24" fill="#17304d" font-weight="600">前：所选区段包含格式转换，再执行矩阵乘</text><rect x="62" y="189" width="195" height="60" rx="9" fill="#dbeafe"/><text x="159.5" y="226.0" text-anchor="middle" font-size="20" fill="#17304d">ND 输入</text><path d="M263 219 L315 219" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="323" y="189" width="245" height="60" rx="9" fill="#ebe0fc"/><text x="445.5" y="226.0" text-anchor="middle" font-size="20" fill="#17304d">TransData</text><path d="M574 219 L620 219" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="628" y="189" width="200" height="60" rx="9" fill="#fff0d4"/><text x="728.0" y="226.0" text-anchor="middle" font-size="20" fill="#17304d">FRACTAL_NZ</text><path d="M834 219 L872 219" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="880" y="189" width="170" height="60" rx="9" fill="#ccf1e6"/><text x="965.0" y="226.0" text-anchor="middle" font-size="20" fill="#17304d">MatMul</text><text x="62" y="282" font-size="19" fill="#52657b" font-weight="400">格式重排与普通 memcpy 的语义不同；截图未证明这个输入每轮都可复用。</text><rect x="30" y="328" width="1060" height="213" rx="9" fill="#ffffff"/><text x="52" y="367" font-size="24" fill="#17304d" font-weight="600">后（假设）：可复用输入预转换，循环内直接使用 NZ</text><rect x="62" y="402" width="330" height="58" rx="9" fill="#ebe0fc"/><text x="227.0" y="438.0" text-anchor="middle" font-size="21" fill="#17304d">循环外：预转换并缓存 NZ</text><path d="M399 431 L453 431" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="462" y="402" width="310" height="58" rx="9" fill="#fff0d4"/><text x="617.0" y="438.0" text-anchor="middle" font-size="21" fill="#17304d">循环内：复用 NZ 输入</text><path d="M778 431 L830 431" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="838" y="402" width="210" height="58" rx="9" fill="#ccf1e6"/><text x="943.0" y="438.0" text-anchor="middle" font-size="20" fill="#17304d">MatMul</text><text x="62" y="511" font-size="19" fill="#52657b" font-weight="400">前提：确认是可复用权重等输入，算子支持 NZ，shape / dtype / 精度与更新语义兼容。</text><text x="38" y="586" font-size="20" fill="#17304d" font-weight="400">若是每轮变化的激活，不能照搬“提前转换一次”；也可能只能融合或减少额外转换。</text><text x="38" y="626" font-size="20" fill="#52657b" font-weight="400">需要后测的同形状 Trace 与数值验证，才能确认转换被省掉、收益落在关键路径。</text></g></svg>