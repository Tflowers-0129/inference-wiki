<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">PCP 的 head-tail 分片：query 数相同，因果工作也要看位置</title>
<desc id="desc">教学构造，无历史前缀，8个位置做包含自身的因果Attention。PCP2把8个query切成4个连续chunk，每chunk2个位置。rank0持有chunk0和chunk3，即原位置0、1、6、7；rank1持有chunk1和chunk2，即2、3、4、5。每head的query-key位置对数分别为1加2加7加8等于18，3加4加5加6等于18。若按前4和后4连续分片则为10和26。本例无padding，所有位置身份保持不变，不是设备耗时。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1120" height="800" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">PCP 的 head-tail 分片：query 数相同，因果工作也要看位置</text>
<text x="32" y="82" font-size="19" fill="#475569" font-weight="400" text-anchor="start">教学构造 · PCP=2，L=8，每个 chunk 两个 query；无历史前缀、无 padding</text>
<rect x="252" y="120" width="184" height="54" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="344" y="154" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="middle">chunk 0</text>
<rect x="444" y="120" width="184" height="54" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="536" y="154" font-size="20" fill="#0f766e" font-weight="600" text-anchor="middle">chunk 1</text>
<rect x="636" y="120" width="184" height="54" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="728" y="154" font-size="20" fill="#0f766e" font-weight="600" text-anchor="middle">chunk 2</text>
<rect x="828" y="120" width="184" height="54" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="920" y="154" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="middle">chunk 3</text>
<text x="32" y="215" font-size="20" fill="#172b4d" font-weight="600" text-anchor="start">原始 query 位置</text>
<rect x="256" y="188" width="80" height="42" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="296" y="216" font-size="22" fill="#1d4ed8" font-weight="600" text-anchor="middle">0</text>
<rect x="352" y="188" width="80" height="42" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="392" y="216" font-size="22" fill="#1d4ed8" font-weight="600" text-anchor="middle">1</text>
<rect x="448" y="188" width="80" height="42" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="488" y="216" font-size="22" fill="#0f766e" font-weight="600" text-anchor="middle">2</text>
<rect x="544" y="188" width="80" height="42" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="584" y="216" font-size="22" fill="#0f766e" font-weight="600" text-anchor="middle">3</text>
<rect x="640" y="188" width="80" height="42" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="680" y="216" font-size="22" fill="#0f766e" font-weight="600" text-anchor="middle">4</text>
<rect x="736" y="188" width="80" height="42" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="776" y="216" font-size="22" fill="#0f766e" font-weight="600" text-anchor="middle">5</text>
<rect x="832" y="188" width="80" height="42" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="872" y="216" font-size="22" fill="#1d4ed8" font-weight="600" text-anchor="middle">6</text>
