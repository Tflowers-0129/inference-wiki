<rect x="832" y="440" width="80" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="928" y="440" width="80" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="32" y="548" width="512" height="102" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="52" y="584" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="start">rank 0 的因果位置对 / head</text>
<text x="52" y="624" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="start">1 + 2 + 7 + 8 = 18</text>
<rect x="576" y="548" width="512" height="102" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="596" y="584" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start">rank 1 的因果位置对 / head</text>
<text x="596" y="624" font-size="25" fill="#0f766e" font-weight="700" text-anchor="start">3 + 4 + 5 + 6 = 18</text>
<text x="32" y="700" font-size="22" fill="#172b4d" font-weight="700" text-anchor="start">连续前后切分：10 / 26；head-tail 分片：18 / 18。</text>
<text x="32" y="740" font-size="20" fill="#475569" font-weight="400" text-anchor="start">query 保留原始 position 与因果可见范围，不按本地行号重新编号。</text>
<text x="32" y="775" font-size="18" fill="#475569" font-weight="400" text-anchor="start">这里只数每 head 的 query-key 位置对；相同计数不等于相同实测耗时。</text>
</svg>
