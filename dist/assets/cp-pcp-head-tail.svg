<rect x="832" y="342" width="80" height="42" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="872" y="370" font-size="22" fill="#1d4ed8" font-weight="600" text-anchor="middle">6</text>
<rect x="928" y="342" width="80" height="42" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="968" y="370" font-size="22" fill="#1d4ed8" font-weight="600" text-anchor="middle">7</text>
<text x="32" y="467" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start">PCP rank 1</text>
<text x="32" y="499" font-size="19" fill="#475569" font-weight="400" text-anchor="start">chunk 1 + 2</text>
<rect x="256" y="440" width="80" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="352" y="440" width="80" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="448" y="440" width="80" height="42" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="488" y="468" font-size="22" fill="#0f766e" font-weight="600" text-anchor="middle">2</text>
<rect x="544" y="440" width="80" height="42" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="584" y="468" font-size="22" fill="#0f766e" font-weight="600" text-anchor="middle">3</text>
<rect x="640" y="440" width="80" height="42" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
