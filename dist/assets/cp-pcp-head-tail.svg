<text x="968" y="272" font-size="21" fill="#475569" font-weight="400" text-anchor="middle">8</text>
<line x1="32" y1="302" x2="1088" y2="302" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="32" y="369" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">PCP rank 0</text>
<text x="32" y="401" font-size="19" fill="#475569" font-weight="400" text-anchor="start">chunk 0 + 3</text>
<rect x="256" y="342" width="80" height="42" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="296" y="370" font-size="22" fill="#1d4ed8" font-weight="600" text-anchor="middle">0</text>
<rect x="352" y="342" width="80" height="42" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="392" y="370" font-size="22" fill="#1d4ed8" font-weight="600" text-anchor="middle">1</text>
<rect x="448" y="342" width="80" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="544" y="342" width="80" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="640" y="342" width="80" height="42" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
