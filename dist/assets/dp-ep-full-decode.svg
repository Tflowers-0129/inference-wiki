<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
<title id="title">跨 DP 的 Decode 图：先协调，再各自回放</title>
<desc id="desc">教学示意，非实测时间线。DP4、TP1、EP4，普通单 token Decode，四个 rank 的真实行数分别为3、5、0、2。空 rank 通过一个 dummy query 进入协调。所有 rank 已捕获1、2、4、8行的本地图，先通过 CPU 组协调模式与形状，再统一使用8行的 FULL 图，EP 通信顺序相容。图容量32行，真实请求10行，差额22行不能算作输出或有效 KV。任一 rank 混入 Prefill 或超过最大图桶，则全组使用 eager。</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:600}.body{font-size:20px}.small{font-size:18px;fill:#475569}.blue{fill:#1d4ed8}.teal{fill:#0f766e}.amber{fill:#9a4c10}</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
</defs>
<rect width="1120" height="860" fill="#f8fafc"/>
<text x="32" y="48" class="title">跨 DP 的 Decode 图：先协调，再各自回放</text>
<text x="32" y="82" class="small">教学示意，非实测 · DP4 / TP1 / EP4 · query=1；不含 PCP、PP、DBO、LoRA、投机</text>

<rect x="32" y="106" width="1056" height="124" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="140" class="label">启动捕获：每个 rank 都准备本地的 1 / 2 / 4 / 8 行图</text>
<text x="52" y="174" class="body">相同捕获配置与顺序 → 各 rank 预热、捕获 → 本地保存 graph 与固定缓冲</text>
<text x="52" y="207" class="small">图中的 EP 调用仍使用通信组；四个 rank 各持自己的图、权重与 KV 地址。</text>

<text x="32" y="272" class="label">这一轮：真实请求不同，共同桶为 8</text>
<text x="52" y="308" class="small">DP rank</text>
<text x="178" y="308" class="small">本地候选</text>
<text x="462" y="308" class="small">前向前的协调</text>
<text x="790" y="308" class="small">本地 FULL 图回放</text>

<rect x="440" y="328" width="292" height="296" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.7"/>
<text x="586" y="369" text-anchor="middle" class="label blue">CPU 组 AllReduce</text>
<text x="586" y="409" text-anchor="middle" class="body">计数 [3,5,1,2]</text>
<text x="586" y="447" text-anchor="middle" class="body">所有候选均为 FULL</text>
<text x="586" y="485" text-anchor="middle" class="body">uniform query = 1</text>
<path d="M466 506H706" stroke="#94a3b8" stroke-width="1"/>
<text x="586" y="540" text-anchor="middle" class="label blue">max = 5 → 桶 8</text>
<text x="586" y="578" text-anchor="middle" class="body">各 rank 再匹配描述符</text>
<text x="586" y="607" text-anchor="middle" class="small">此协调发生在模型图外</text>

<text x="52" y="368" class="label">DP0</text>
<rect x="164" y="328" width="238" height="62" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="283" y="355" text-anchor="middle" class="body">3 条真实 query</text>
<text x="283" y="380" text-anchor="middle" class="small">本地 FULL4</text>
<path d="M405 359H433" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M735 359H772" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="780" y="328" width="308" height="62" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="934" y="355" text-anchor="middle" class="body teal">DP0：FULL8</text>
<text x="934" y="380" text-anchor="middle" class="small">本轮输入 → 模型 / EP</text>

<text x="52" y="446" class="label">DP1</text>
<rect x="164" y="406" width="238" height="62" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="283" y="433" text-anchor="middle" class="body">5 条真实 query</text>
<text x="283" y="458" text-anchor="middle" class="small">本地 FULL8</text>
<path d="M405 437H433" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M735 437H772" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="780" y="406" width="308" height="62" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="934" y="433" text-anchor="middle" class="body teal">DP1：FULL8</text>
<text x="934" y="458" text-anchor="middle" class="small">本轮输入 → 模型 / EP</text>

<text x="52" y="524" class="label">DP2</text>
<rect x="164" y="484" width="238" height="62" rx="5" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="283" y="511" text-anchor="middle" class="body amber">0 条 → dummy 1</text>
<text x="283" y="536" text-anchor="middle" class="small">本地 FULL1</text>
<path d="M405 515H433" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M735 515H772" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="780" y="484" width="308" height="62" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="934" y="511" text-anchor="middle" class="body teal">DP2：FULL8</text>
<text x="934" y="536" text-anchor="middle" class="small">仍可收到其他 rank 的专家任务</text>

<text x="52" y="602" class="label">DP3</text>
<rect x="164" y="562" width="238" height="62" rx="5" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="283" y="589" text-anchor="middle" class="body">2 条真实 query</text>
<text x="283" y="614" text-anchor="middle" class="small">本地 FULL2</text>
<path d="M405 593H433" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M735 593H772" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="780" y="562" width="308" height="62" rx="5" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="934" y="589" text-anchor="middle" class="body teal">DP3：FULL8</text>
<text x="934" y="614" text-anchor="middle" class="small">本轮输入 → 模型 / EP</text>

<text x="32" y="664" class="body">图容量 4×8=32 行；真实请求 3+5+0+2=10 行；差额 22 行不计输出或有效 KV。</text>
<rect x="32" y="690" width="1056" height="136" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="52" y="725" class="label amber">若 DP1 混入 Prefill，或任一 rank 超过最大图桶</text>
<text x="52" y="763" class="body">本地候选 NONE → 协调后全组 NONE → 各 rank 用 eager 执行本轮前向</text>
<text x="52" y="800" class="small">其他 rank 的 Decode 仍继续；此非 DBO 分支保留各自输入行数，不为图再补到统一桶。</text>
</svg>
