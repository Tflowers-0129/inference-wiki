<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1140" viewBox="0 0 1000 1140" role="img" aria-labelledby="title desc">
<title id="title">拉取式：先选 P，算好后再交给 D</title><desc id="desc">源码机制示意，无实测时间比例。Proxy先向P发送请求，P完成Prefill后保留请求的源KV块并返回元数据。Proxy再选择D；D Scheduler先预留目标块、进入等待远端KV状态，D Worker根据P的块地址发起READ。P到D的payload不经Proxy。D本地所有pulls和必要重排结束后，一支经本地rank聚合和Scheduler恢复可调度资格，另一支通知P，P也须等本地rank完成结果聚合后解除请求引用。D的普通Attention路径重算最后prompt token后采样。两支独立推进，不声称P释放与D开始计算的先后顺序。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="1140" fill="#f8fafc"/>
<text x="32" y="46" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">拉取式：先选 P，算好后再交给 D</text>
<text x="32" y="80" font-size="19" fill="#475569" font-weight="400" text-anchor="start">源码机制示意 · 从上到下读依赖；行距不代表耗时</text>
<rect x="32" y="108" width="256" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="160" y="139" font-size="23" fill="#1d4ed8" font-weight="700" text-anchor="middle">P 引擎</text>
<text x="160" y="166" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">Scheduler + Workers</text>
<path d="M160 184V884" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="372" y="108" width="256" height="76" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5"/>
<text x="500" y="139" font-size="23" fill="#475569" font-weight="700" text-anchor="middle">Proxy</text>
<text x="500" y="166" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">请求控制与转发</text>
<path d="M500 184V884" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="712" y="108" width="256" height="76" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="840" y="139" font-size="23" fill="#0f766e" font-weight="700" text-anchor="middle">D 引擎</text>
<text x="840" y="166" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">Scheduler + Workers</text>
<path d="M840 184V884" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
<path d="M500 216H160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="205" y="205" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="start">① 选 P，提交请求</text>
<rect x="32" y="244" width="256" height="118" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="52" y="276" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="start">② 计算 prompt KV</text>
<text x="52" y="307" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">Scheduler：P 请求完成</text>
<text x="52" y="338" font-size="20" fill="#92400e" font-weight="600" text-anchor="start">保留源块，等待交接</text>
<path d="M288 392H500" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="304" y="376" font-size="19" fill="#1d4ed8" font-weight="600" text-anchor="start">③ 返回交接元数据</text>
<rect x="372" y="414" width="256" height="74" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="392" y="445" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">P 的 block IDs、身份</text>
<text x="392" y="472" font-size="18" fill="#475569" font-weight="400" text-anchor="start">端点与布局；不是 KV 数据</text>
<path d="M500 516H840" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="575" y="503" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start">④ 再选 D，转发请求</text>
<rect x="712" y="544" width="256" height="112" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="732" y="577" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start">Scheduler 分配本地块</text>
<text x="732" y="607" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">请求等待远端 KV</text>
<text x="732" y="637" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">Worker 获得接收计划</text>
<path d="M840 700H160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="292" y="664" width="420" height="28" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="298" y="685" font-size="21" fill="#0f766e" font-weight="600" text-anchor="start">⑤ D 按元数据发起 READ</text>
<path d="M160 750H840" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#teal)"/>
<rect x="296" y="715" width="440" height="28" rx="0" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/>
<text x="302" y="736" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start">KV payload：P → D，不经 Proxy</text>
<rect x="688" y="782" width="280" height="92" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="708" y="814" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start">D 本地所有 pulls 结束</text>
<text x="708" y="845" font-size="19" fill="#172b4d" font-weight="400" text-anchor="start">完成必要重排，再报告完成</text>
<path d="M840 874V906H188V950" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240" y="895" font-size="19" fill="#1d4ed8" font-weight="600" text-anchor="start">DONE_RECVING_MSG → P 跟踪完成</text>
<path d="M840 874V950" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#teal)"/>
<rect x="32" y="962" width="424" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="52" y="993" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="start">P：各 rank 完成 → 聚合 → Scheduler</text>
<text x="52" y="1023" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">解除该请求的源块引用</text>
<text x="52" y="1050" font-size="18" fill="#475569" font-weight="400" text-anchor="start">归还块池；注册内存仍然存在</text>
<rect x="544" y="962" width="424" height="100" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="564" y="993" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start">D：各 rank 完成 → 聚合 → Scheduler</text>
<text x="564" y="1023" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">恢复调度资格，补算 prompt 末 token</text>
<text x="564" y="1050" font-size="18" fill="#475569" font-weight="400" text-anchor="start">再采样客户端输出，后续继续 Decode</text>
<text x="32" y="1110" font-size="20" fill="#475569" font-weight="400" text-anchor="start">两支各自等待轮询、rank 聚合与调度；图不规定 P 释放和 D 开始计算谁先发生。</text>
</svg>