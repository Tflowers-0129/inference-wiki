<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1190" viewBox="0 0 1120 1190" role="img" aria-labelledby="title desc">
<title id="title">异步调度如何衔接相邻两轮前向</title><desc id="desc">两组泳道对比同步与异步调度。异步时 CPU 提前规划下一轮，输出回收也可重叠；同一请求的下一轮前向仍依赖上一轮真实采样结果，不能并行越过该依赖。时间宽度均为示意。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#b45309" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="1190" rx="20" fill="#f8fafc"/>
<text x="32" y="48" font-size="28" fill="#172b4d" font-weight="700">异步调度：把 CPU 的下一轮准备提前</text>
<text x="32" y="80" font-size="18" fill="#475569" font-weight="400">对同一条请求，前向 n+1 仍必须等到采样 n 的真实 Token 可用。</text>
<rect x="32" y="105" width="1056" height="340" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="140" font-size="21" fill="#b45309" font-weight="700">同步示意 · 回收结果后，再准备下一轮</text>
<text x="52" y="195" font-size="17" fill="#475569" font-weight="600">CPU 规划 / 提交</text>
<path d="M206 188L1064 188" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>
<text x="52" y="286" font-size="17" fill="#475569" font-weight="600">NPU 执行</text>
<path d="M206 279L1064 279" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>
<text x="52" y="377" font-size="17" fill="#475569" font-weight="600">输出回收</text>
<path d="M206 370L1064 370" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="208" y="161" width="150" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="283.0" y="196.5" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="middle">安排并提交 n</text>
<path d="M360 190L748 190" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5"/>
<text x="535" y="184" font-size="17" fill="#b45309" font-weight="600" text-anchor="middle">等待结果</text>
<rect x="754" y="161" width="142" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="825.0" y="196.5" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="middle">安排 n+1</text>
<rect x="370" y="252" width="248" height="58" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="494.0" y="287.5" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">前向 + 采样 n</text>
<rect x="624" y="252" width="290" height="58" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="769" y="277" font-size="17" fill="#b45309" font-weight="600" text-anchor="middle">设备可能出现空泡</text>
<text x="769" y="300" font-size="16" fill="#b45309" font-weight="400" text-anchor="middle">取决于可用的其他工作</text>
<rect x="920" y="252" width="144" height="58" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="992.0" y="287.5" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">前向 n+1</text>
<rect x="624" y="343" width="122" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="685.0" y="378.5" font-size="16" fill="#172b4d" font-weight="600" text-anchor="middle">D2H / 处理 n</text>
<path d="M358 219L370 248" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M618 314L630 338" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>
<path d="M746 338L755 223" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-orange)"/>
<path d="M896 219L920 248" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="32" y="465" width="1056" height="380" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="501" font-size="21" fill="#0f766e" font-weight="700">异步示意 · 准备与回收，尽量覆盖在设备计算期间</text>
<text x="52" y="557" font-size="17" fill="#475569" font-weight="600">CPU 规划 / 提交</text>
<path d="M206 550L1064 550" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>
<text x="52" y="660" font-size="17" fill="#475569" font-weight="600">NPU 执行</text>
<path d="M206 653L1064 653" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>
<text x="52" y="763" font-size="17" fill="#475569" font-weight="600">输出回收</text>
<path d="M206 756L1064 756" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="208" y="523" width="150" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="283.0" y="558.5" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="middle">安排并提交 n</text>
<rect x="394" y="523" width="260" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
<text x="524.0" y="558.5" font-size="17" fill="#1d4ed8" font-weight="600" text-anchor="middle">提前安排并提交 n+1</text>
<text x="524" y="609" font-size="16" fill="#475569" font-weight="400" text-anchor="middle">计划可先行，真实输入尚未就绪</text>
<rect x="370" y="626" width="284" height="58" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="512.0" y="661.5" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">前向 + 采样 n</text>
<rect x="666" y="626" width="140" height="58" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="736.0" y="661.5" font-size="16" fill="#b45309" font-weight="600" text-anchor="middle">接续真实输入</text>
<rect x="818" y="626" width="246" height="58" rx="10" fill="#e6f4f1" stroke="#99c9bf"/>
<text x="941.0" y="661.5" font-size="17" fill="#0f766e" font-weight="600" text-anchor="middle">前向 + 采样 n+1</text>
<rect x="666" y="729" width="256" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="794.0" y="764.5" font-size="17" fill="#172b4d" font-weight="600" text-anchor="middle">D2H / 处理结果 n</text>
<path d="M358 581L370 622" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M654 655L661 655" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<path d="M806 655L813 655" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
<path d="M654 686L666 724" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>
<path d="M654 552L735 620" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-blue)"/>
<text x="52" y="815" font-size="18" fill="#172b4d" font-weight="600">下一轮只是在途更早：设备执行次序与自回归依赖仍然成立。</text>
<rect x="32" y="865" width="1056" height="239" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="52" y="901" font-size="22" fill="#172b4d" font-weight="700">源码里要分清的三个边界</text>
<text x="52" y="940" font-size="19" fill="#1d4ed8" font-weight="700">占位记账</text>
<text x="242" y="940" font-size="17" fill="#172b4d" font-weight="400">让 Scheduler 记录尚未回收的输出；占位符不能当作真实 Token 输入。</text>
<text x="52" y="983" font-size="19" fill="#0f766e" font-weight="700">在途 batch</text>
<text x="242" y="983" font-size="17" fill="#172b4d" font-weight="400">指已提交、尚未回收的迭代；队列深度不是用户并发数。</text>
<text x="52" y="1026" font-size="19" fill="#b45309" font-weight="700">metadata 同步</text>
<text x="242" y="1026" font-size="17" fill="#172b4d" font-weight="400">若提前回读设备计数，CPU 可能重新等待，截断这条流水。</text>
<text x="52" y="1071" font-size="17" fill="#475569" font-weight="400">启用非阻塞调用还不够：继续追到下一次 schedule() 与 future.result() 的先后。</text>
<text x="32" y="1141" font-size="17" fill="#475569" font-weight="400">示意图，无实测时长；输出回收可由后台线程承担，具体重叠方式取决于执行器。</text>
<text x="32" y="1174" font-size="16" fill="#475569" font-weight="400">图中的“接续真实输入”可能是设备侧 Token / metadata 更新，不代表一次 Host 往返。</text>
</svg>
