<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
<title id="title">两份 KV、两个块池：拉取交接的生命周期</title><desc id="desc">拉取式教学地址示意，非实测block IDs。上层P和D各自预分配KV池并向Transfer Engine注册背后的内存区域，这些区域可以服务多个请求。下层同一请求的逻辑块0、1映射为P物理块7、9和D物理块2、11，传输复制内容，不迁移P的物理块身份。交接期间P保留源引用，D预留目标块并等待写入。数据完成后的D调度资格与P引用解除经过两支独立完成协议；D在生成期间继续持有目标块。请求释放不等于注销TE内存，也不等于进程归还整个KV池。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="1110" fill="#f8fafc"/>
<text x="32" y="46" font-size="27" fill="#172b4d" font-weight="700" text-anchor="start">两份 KV、两个块池：拉取交接的生命周期</text>
<text x="32" y="80" font-size="19" fill="#475569" font-weight="400" text-anchor="start">拉取式教学地址 · 同一逻辑块的内容，映射到两套不同的物理 block ID</text>
<rect x="32" y="112" width="440" height="184" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="52" y="148" font-size="23" fill="#1d4ed8" font-weight="700" text-anchor="start">P 的 KV 块池</text>
<text x="52" y="180" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">底层张量 / backing storage</text>
<text x="52" y="213" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">TE 注册区域覆盖实际内存</text>
<text x="52" y="269" font-size="19" fill="#475569" font-weight="400" text-anchor="start">跨请求存续，由引擎管理</text>
<rect x="528" y="112" width="440" height="184" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="548" y="148" font-size="23" fill="#0f766e" font-weight="700" text-anchor="start">D 的 KV 块池</text>
<text x="548" y="180" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">底层张量 / backing storage</text>
<text x="548" y="213" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">TE 注册区域覆盖实际内存</text>
<text x="548" y="269" font-size="19" fill="#475569" font-weight="400" text-anchor="start">跨请求存续，由引擎管理</text>
<text x="32" y="338" font-size="22" fill="#172b4d" font-weight="600" text-anchor="start">请求 R：复制 KV 内容，不把 P 的块号拿到 D 直接使用</text>
<rect x="32" y="366" width="440" height="152" rx="8" fill="#fff7ed" stroke="#d7ae63" stroke-width="1.5"/>
<text x="52" y="399" font-size="21" fill="#92400e" font-weight="600" text-anchor="start">P：源 KV 已算好，保留请求引用</text>
<rect x="52" y="422" width="184" height="64" rx="8" fill="#fff" stroke="#d7ae63" stroke-width="1.5"/>
<text x="68" y="449" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">逻辑块 0 → P7</text>
<text x="68" y="474" font-size="17" fill="#475569" font-weight="400" text-anchor="start">P 的物理地址</text>
<rect x="252" y="422" width="200" height="64" rx="8" fill="#fff" stroke="#d7ae63" stroke-width="1.5"/>
<text x="268" y="449" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">逻辑块 1 → P9</text>
<text x="268" y="474" font-size="17" fill="#475569" font-weight="400" text-anchor="start">P 的物理地址</text>
<rect x="528" y="366" width="440" height="152" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="548" y="399" font-size="21" fill="#0f766e" font-weight="600" text-anchor="start">D：先预留目标块，随后才写入</text>
<rect x="548" y="422" width="184" height="64" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
<text x="564" y="449" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">逻辑块 0 → D2</text>
<text x="564" y="474" font-size="17" fill="#475569" font-weight="400" text-anchor="start">D 的物理地址</text>
<rect x="748" y="422" width="200" height="64" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
<text x="764" y="449" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">逻辑块 1 → D11</text>
<text x="764" y="474" font-size="17" fill="#475569" font-weight="400" text-anchor="start">D 的物理地址</text>
<path d="M252 518V568H748V518" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#teal)"/>
<text x="348" y="554" font-size="19" fill="#0f766e" font-weight="600" text-anchor="start">descriptor：本地地址 + 远端地址 + 字节数</text>
<text x="32" y="610" font-size="22" fill="#92400e" font-weight="600" text-anchor="start">传输期间：P 的源引用和 D 的目标容量同时占用</text>
<rect x="32" y="634" width="936" height="78" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="52" y="664" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">D 目标状态：已预留 → 传输写入中 → 所有本地 pulls / 必要重排完成</text>
<text x="52" y="692" font-size="19" fill="#475569" font-weight="400" text-anchor="start">“已分配”只证明有位置；还要等实际数据完成及各 rank 完成结果聚合。</text>
<path d="M500 712V740H252V768" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 740H748V768" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#teal)"/>
<rect x="32" y="780" width="440" height="136" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="52" y="813" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">源端分支：P 何时能放手？</text>
<text x="52" y="846" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">收到 DONE，各 rank 完成结果聚合</text>
<text x="52" y="876" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">Scheduler 解除 R 的源块引用</text>
<text x="52" y="902" font-size="18" fill="#475569" font-weight="400" text-anchor="start">块回池后仍按引用、缓存和驱逐规则复用</text>
<rect x="528" y="780" width="440" height="136" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="548" y="813" font-size="22" fill="#0f766e" font-weight="700" text-anchor="start">目标端分支：D 何时能消费？</text>
<text x="548" y="846" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">各 rank 接收完成结果聚合</text>
<text x="548" y="876" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">Scheduler 恢复 R 的可调度资格</text>
<text x="548" y="902" font-size="18" fill="#475569" font-weight="400" text-anchor="start">目标块随 Decode 保留，直至引用释放</text>
<rect x="32" y="954" width="936" height="116" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="986" font-size="21" fill="#172b4d" font-weight="600" text-anchor="start">池生命周期：分配底层内存 → TE 注册 → 服务多次请求 → 另行注销 / 销毁</text>
<text x="52" y="1020" font-size="21" fill="#172b4d" font-weight="400" text-anchor="start">请求生命周期：分配 / 引用块 → 生产或接收 KV → 消费 → 解除引用</text>
<text x="52" y="1052" font-size="19" fill="#475569" font-weight="400" text-anchor="start">P 的 DONE 处理解除请求引用；不会逐请求注销整个 TE 区域或归还整个 KV 池。</text>
</svg>