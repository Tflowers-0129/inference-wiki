<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Prefill 与 Decode 分离的请求流水线</title>
  <desc id="desc">请求依次经过 Prefill 排队、Prefill 实例、KV 传输、Decode 排队、Decode 实例并输出。吞吐量同时受到 Prefill 算力、传输带宽和 Decode 能力约束，资源配比随输入与输出长度变化。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73859e" stroke-width="1.5"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;fill:#60728d}.title{font-size:27px;font-weight:750}.sub{font-size:14px;fill:#60728d}.name{font-size:16px;font-weight:700}.label{font-size:13px;fill:#60728d}.small{font-size:12px;fill:#60728d}.line{fill:none;stroke:#73859e;stroke-width:1.8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="420" rx="22" fill="#fbfaf7"/>
  <text x="32" y="32" class="eyebrow">请求的旅程 · PD 分离</text>
  <text x="32" y="70" class="title">两类计算之间，还有一段 KV 传输</text>
  <text x="32" y="97" class="sub">Prefill 建立上下文，Decode 逐步生成；队列和网络连接着整条链路。</text>

  <path d="M122 186H145M247 186H270M407 186H430M557 186H580M682 186H705M842 186H865" class="line"/>
  <g>
    <rect x="32" y="130" width="90" height="112" rx="16" fill="#fff" stroke="#dce3ed"/>
    <path d="M64 152h18l7 7v23H64zM82 152v8h7M69 169h14M69 175h10" fill="none" stroke="#60728d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="77" y="208" text-anchor="middle" class="name">请求</text><text x="77" y="229" text-anchor="middle" class="small">输入 token</text>
  </g>
  <g>
    <rect x="152" y="130" width="95" height="112" rx="16" fill="#edf3ff" stroke="#c8dafa"/>
    <rect x="177" y="153" width="8" height="22" rx="3" fill="#8eb7fa"/><rect x="191" y="153" width="8" height="22" rx="3" fill="#5591ee"/><rect x="205" y="153" width="8" height="22" rx="3" fill="#2473ec"/>
    <text x="199.5" y="208" text-anchor="middle" class="name">P 排队</text><text x="199.5" y="229" text-anchor="middle" class="small">等待调度</text>
  </g>
  <g>
    <rect x="277" y="130" width="130" height="112" rx="16" fill="#2473ec"/>
    <path d="M325 153h34v26h-34zM331 159h22v14h-22M321 159h4M321 166h4M321 173h4M359 159h4M359 166h4M359 173h4" fill="none" stroke="#dceaff" stroke-width="1.6"/>
    <text x="342" y="208" text-anchor="middle" class="name" style="fill:#fff">Prefill 实例</text><text x="342" y="229" text-anchor="middle" class="small" style="fill:#e5efff">计算提示词 · 建立 KV</text>
  </g>
  <g>
    <rect x="437" y="130" width="120" height="112" rx="16" fill="#fff4de" stroke="#edcf93"/>
    <path d="M476 158h39m-7-5 7 5-7 5M518 173h-39m7-5-7 5 7 5" fill="none" stroke="#d98b21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="497" y="208" text-anchor="middle" class="name">KV 传输</text><text x="497" y="229" text-anchor="middle" class="small">搬运上下文状态</text>
  </g>
  <g>
    <rect x="587" y="130" width="95" height="112" rx="16" fill="#e8f6f3" stroke="#b4ded7"/>
    <rect x="612" y="153" width="8" height="22" rx="3" fill="#8bcfc5"/><rect x="626" y="153" width="8" height="22" rx="3" fill="#51b8aa"/><rect x="640" y="153" width="8" height="22" rx="3" fill="#159c91"/>
    <text x="634.5" y="208" text-anchor="middle" class="name">D 排队</text><text x="634.5" y="229" text-anchor="middle" class="small">等待接续</text>
  </g>
  <g>
    <rect x="712" y="130" width="130" height="112" rx="16" fill="#159c91"/>
    <path d="M759 158h11v20h-11zM773 153h11v25h-11zM787 165h11v13h-11z" fill="none" stroke="#d7f5ef" stroke-width="1.6"/>
    <text x="777" y="208" text-anchor="middle" class="name" style="fill:#fff">Decode 实例</text><text x="777" y="229" text-anchor="middle" class="small" style="fill:#e0f6f2">逐 token 生成</text>
  </g>
  <g>
    <rect x="872" y="130" width="96" height="112" rx="16" fill="#fff" stroke="#dce3ed"/>
    <path d="M902 154h36v23h-15l-8 7v-7h-13zM909 162h22M909 168h15" fill="none" stroke="#60728d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="920" y="208" text-anchor="middle" class="name">输出</text><text x="920" y="229" text-anchor="middle" class="small">流式 token</text>
  </g>

  <path d="M342 251v15M497 251v15M777 251v15" stroke="#b9c7d9" stroke-width="1.5"/>
  <text x="342" y="285" text-anchor="middle" class="label">P 的处理能力</text><text x="497" y="285" text-anchor="middle" class="label">传输带宽 / 时延</text><text x="777" y="285" text-anchor="middle" class="label">D 的生成能力</text>
  <rect x="32" y="313" width="936" height="79" rx="15" fill="#eef2f8"/>
  <circle cx="56" cy="337" r="4" fill="#2473ec"/><text x="70" y="342" style="font-size:15px;font-weight:700">整条链路的吞吐，由 P、KV 传输和 D 共同约束。</text>
  <text x="56" y="369" class="sub">配比不是固定值：长输入增加 P 压力，长输出增加 D 压力；还需结合队列、网络和批处理测量。</text>
</svg>
