<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title id="title">A5 实测：MC2 与 CANN MegaMoe 的外部设备轨迹</title>
<desc id="desc">真实 profiling 的单次执行快照。条件为 EP2、每 rank 32 tokens、8 专家、top-k 2、hidden 和 intermediate 均为 1024、W4A8MXFP、SiLU、eager。选取 rank 0 的 iteration 2，两种实现各自以第一个设备任务归零，统一按 0 到 500 微秒绘制。MC2 的 stream 61 依次有 dispatch、GMM1、SwiGLU 量化、GMM2、combine 五个任务；CANN MegaMoe 的 stream 61 有一个外部融合任务。所有条宽严格按设备时间比例绘制。空白区间的原因未归因。没有跨 rank 对齐，也没有展开融合 kernel 内部阶段；该快照不能用于计算稳态加速比。精确数据与源 trace 校验值见 a5-moe-swimlane.json。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style></defs>
<rect width="1100" height="640" fill="#f8fafc"/>
<text x="32" y="44" font-size="28" fill="#172b4d" font-weight="700" text-anchor="start">A5 实测：MC2 与 CANN MegaMoe 的外部设备轨迹</text>
<text x="32" y="78" font-size="19" fill="#475569" font-weight="400" text-anchor="start">实测快照 · tokens/rank 32 · EP2 · W4A8MXFP · eager · rank 0 / iteration 2</text>
<text x="32" y="110" font-size="20" fill="#475569" font-weight="400" text-anchor="start">两种实现独立归零，共用 0～500 µs 刻度；条宽保持真实比例。</text>
<rect x="32" y="132" width="1036" height="278" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="250" y="162" font-size="18" fill="#475569" font-weight="400" text-anchor="start">设备局部时间 / µs</text>
