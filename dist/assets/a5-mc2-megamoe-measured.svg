<text x="570" y="187" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">200</text>
<path d="M730 194V394" stroke="#cbd5e1" stroke-dasharray="3 5" fill="none"/>
<text x="730" y="187" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">300</text>
<path d="M890 194V394" stroke="#cbd5e1" stroke-dasharray="3 5" fill="none"/>
<text x="890" y="187" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">400</text>
<path d="M1050 194V394" stroke="#cbd5e1" stroke-dasharray="3 5" fill="none"/>
<text x="1050" y="187" font-size="18" fill="#475569" font-weight="400" text-anchor="middle">500</text>
<text x="52" y="246" font-size="22" fill="#172b4d" font-weight="700" text-anchor="start">MC2</text>
<text x="52" y="274" font-size="18" fill="#475569" font-weight="400" text-anchor="start">rank 0 · stream 61</text>
<rect id="MC2-1" x="250" y="222" width="19.1998" height="36" fill="#0f766e" data-start-us="0.000" data-duration-us="11.999875"><title>1 MoeDistributeDispatchV3; physical stream 61; 0.000 to 11.999875 us; duration 11.999875 us</title></rect>
