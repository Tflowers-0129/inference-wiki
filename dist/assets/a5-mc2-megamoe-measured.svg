<text x="52" y="356" font-size="22" fill="#172b4d" font-weight="700" text-anchor="start">CANN MegaMoe</text>
<text x="52" y="384" font-size="18" fill="#475569" font-weight="400" text-anchor="start">rank 0 · stream 61</text>
<rect id="MegaMoe-M" x="250" y="332" width="52.0301" height="36" fill="#475569" data-start-us="0.000" data-duration-us="32.5188125"><title>M MegaMoe; physical stream 61; 0.000 to 32.5188125 us; duration 32.5188125 us</title></rect>
<text x="276.01505" y="322" font-size="20" fill="#475569" font-weight="700" text-anchor="middle">M</text>
<text x="1048" y="390" font-size="18" fill="#475569" font-weight="400" text-anchor="end">末任务结束 32.52 µs</text>
<text x="326" y="356" font-size="20" fill="#475569" font-weight="400" text-anchor="start">一个外部设备任务，内部未展开</text>
<rect x="52" y="419" width="25" height="25" rx="3" fill="#0f766e"/>
<text x="64.5" y="438" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="89" y="438" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">Dispatch</text>
<rect x="350" y="419" width="25" height="25" rx="3" fill="#1d4ed8"/>
<text x="362.5" y="438" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="387" y="438" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">GMM1</text>
<rect x="640" y="419" width="25" height="25" rx="3" fill="#b45309"/>
<text x="652.5" y="438" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="677" y="438" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">SwiGLU + 量化</text>
<rect x="52" y="459" width="25" height="25" rx="3" fill="#1d4ed8"/>
<text x="64.5" y="478" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="89" y="478" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">GMM2</text>
<rect x="350" y="459" width="25" height="25" rx="3" fill="#0f766e"/>
<text x="362.5" y="478" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="387" y="478" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">Combine</text>
<rect x="640" y="459" width="25" height="25" rx="3" fill="#475569"/>
<text x="652.5" y="478" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">M</text>
<text x="677" y="478" font-size="20" fill="#172b4d" font-weight="400" text-anchor="start">MegaMoe（融合任务）</text>
<text x="32" y="528" font-size="19" fill="#475569" font-weight="400" text-anchor="start">空白表示此 stream 无已采集任务，原因未归因。</text>
<text x="32" y="558" font-size="19" fill="#475569" font-weight="400" text-anchor="start">各实现独立归零；未对齐其他 rank，也未绘制 Host→NPU 微秒延迟。</text>
<text x="32" y="588" font-size="19" fill="#475569" font-weight="400" text-anchor="start">本图含采集扰动，不用于计算稳态加速比；融合算子的内部流水未展开。</text>
<text x="32" y="620" font-size="16" fill="#475569" font-weight="400" text-anchor="start">采集：2026-11-04 · 可复算数据：experiments/results/a5-moe-swimlane.json</text>
