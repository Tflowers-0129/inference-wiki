<svg xmlns="http://www.w3.org/2000/svg" width="960" height="970" viewBox="0 0 960 970" role="img" aria-labelledby="title desc">
<title id="title">ModelRunnerV2 的 KV 管理闭环</title><desc id="desc">EngineCore 规划页池；Scheduler 管理请求到页号和引用；V2 按页表计算本轮KV写入位置，并交给后端读写；完成或抢占在安全边界归还引用。无时间比例。</desc>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#18334e;font-size:16px} .title{font-size:21px;font-weight:650}.head{font-size:18px;font-weight:600}.small{font-size:14px;fill:#435c70}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.line{fill:none;stroke:#526f86;stroke-width:2;marker-end:url(#arrow)}.box{stroke:#7890a3;stroke-width:1.5;rx:12}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526f86"/></marker></defs>
<rect width="960" height="970" fill="#f8fbfd"/>
<text x="32" y="43" class="title">KV 页怎样分配、使用和归还</text>
<text x="32" y="75" class="small">Scheduler 管理页号；Worker 在设备上保存和读写实际 KV。流程不表示实测耗时。</text>
<rect x="40" y="104" width="880" height="122" class="box" fill="#eaf2ff"/>
<text x="60" y="136" class="head">启动：确定各层缓存规格和可用内存，再制定分配方案</text>
<text x="60" y="170" class="">按后端要求确定页大小、页数和底层存储布局</text>
<text x="60" y="199" class="">Worker 分配设备存储；Scheduler 建立页管理器</text>
<path d="M 400 226 L 400 274" class="line"/>
<path d="M 880 226 L 880 274" class="line"/>
<text x="58" y="264" class="small">Scheduler / KVCacheManager</text>
<text x="538" y="264" class="small">worker / ModelRunnerV2</text>
<rect x="40" y="282" width="400" height="200" class="box" fill="#eaf7f3"/>
<text x="60" y="315" class="head">分配并保留请求使用的页</text>
<text x="60" y="350" class="">查找能复用的前缀页</text>
<text x="60" y="381" class="">引用命中页，按需追加新页</text>
<text x="60" y="412" class="">按请求、缓存组保存页号</text>
<text x="60" y="443" class="">空间不足 → 抢占并重新排队</text>
<rect x="520" y="282" width="400" height="200" class="box" fill="#edf4ff"/>
<text x="540" y="315" class="head">准备本轮各请求的页表</text>
<text x="540" y="350" class="">新请求接收整表，已有请求追加页号</text>
<text x="540" y="381" class="">idx_mapping 找到各请求状态</text>
<text x="540" y="412" class="">按位置计算 slot_mapping</text>
<text x="540" y="443" class="">为各层准备读写所需的 metadata</text>
<path d="M 440 385 L 520 385" class="line"/>
<text x="448" y="369" class="small">页号</text>
<path d="M 720 482 L 720 542" class="line"/>
<text x="736" y="518" class="small">层视图 ＋ metadata</text>
<rect x="520" y="550" width="400" height="178" class="box" fill="#fff3e8"/>
<text x="540" y="583" class="head">后端执行本轮读写</text>
<text x="540" y="618" class="">写本轮 KV / 压缩记录 / 状态</text>
<text x="540" y="649" class="">按表、长度和选择范围读取</text>
<text x="540" y="680" class="">计算和传输都须遵守就绪条件</text>
<rect x="40" y="550" width="400" height="178" class="box" fill="#f0f4f7"/>
<text x="60" y="583" class="head">完成、取消或抢占后的清理</text>
<text x="60" y="618" class="">解除请求引用；需要时延迟归还</text>
<text x="60" y="649" class="">等待尚未完成的设备操作或传输</text>
<text x="60" y="680" class="">引用数归零后，页可供后续分配</text>
<path d="M 520 652 L 440 652" class="line"/>
<text x="451" y="637" class="small">安全</text>
<text x="451" y="682" class="small">边界</text>
<path d="M 240 728 L 240 782" class="line"/>
<rect x="40" y="790" width="880" height="135" class="box" fill="#fff"/>
<text x="60" y="825" class="head">归还引用 ≠ 立即抹除缓存内容</text>
<text x="60" y="860" class="">空闲页可保留前缀数据；其他请求命中后重新增加引用</text>
<text x="60" y="889" class="">改存新数据时移除旧 hash；页清零和共享页复制由调度结果指定。</text>
<text x="40" y="953" class="small">各缓存组保留的数据范围可以不同；预留的空间不一定已有有效 KV。</text>
</svg>
