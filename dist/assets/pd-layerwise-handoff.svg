<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110" role="img" aria-labelledby="title desc">
<title id="title">逐层推送：D 先占位，P 按层发送，D 等待必要来源全部完成</title>
<desc id="desc">源码机制示意，不是实测时间线。请求先选D，由D分配目标KV块，并把块号和端点经MetaServer交给随后选择的P。P的每层KV写入记录事件，后台发送线程等待该事件后写目标地址，可与后续计算重叠。本来源最后层、最后所需chunk发送成功后，各必要来源发送DONE，D收齐映射要求的来源后报告接收完成，才能重新进入调度。此实现没有D逐层边收边Decode的就绪协议。源块归还须单独核对，不由wait_for_save保证。</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
.title{font-size:28px;font-weight:700}.sub{font-size:19px;fill:#475569}.h{font-size:22px;font-weight:700}.b{font-size:20px}.s{font-size:18px;fill:#475569}.blue{fill:#1d4ed8}.teal{fill:#0f766e}.orange{fill:#9a4b08}
.arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.dep{fill:none;stroke:#1d4ed8;stroke-width:2;marker-end:url(#bluearrow)}
</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#475569" stroke-width="1.7"/></marker>
<marker id="bluearrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#1d4ed8" stroke-width="1.7"/></marker>
</defs>
<rect width="1120" height="1110" fill="#f8fafc"/>
<text x="32" y="48" class="title">逐层推送：先给 KV 一个落点，再让 P 开始计算</text>
<text x="32" y="82" class="sub">源码机制示意 · 同一请求 · 只画必要依赖，位置与框宽均不表示实测耗时</text>

<rect x="32" y="112" width="320" height="176" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="52" y="148" class="h teal">① 先选 D，分配目标块</text>
<text x="52" y="186" class="b">D Scheduler 持有块号</text>
<text x="52" y="222" class="b">WAITING_FOR_REMOTE_KVS</text>
<text x="52" y="260" class="s">容量已占用；内容尚未就绪</text>
<rect x="400" y="112" width="280" height="176" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="420" y="148" class="h orange">② MetaServer 再选 P</text>
<text x="420" y="186" class="b">转交原请求与 D 信息</text>
<text x="420" y="222" class="b">目标块号、并行布局</text>
<text x="420" y="260" class="s">控制信息，不中转 KV 字节</text>
<rect x="728" y="112" width="360" height="176" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="748" y="148" class="h blue">③ P 分配本地块，运行 Prefill</text>
<text x="748" y="186" class="b">握手取得 D 的层地址信息</text>
<text x="748" y="222" class="b">逻辑块相同，物理块号可不同</text>
<text x="748" y="260" class="s">P / D 的 KV 池事先完成内存注册</text>
<path d="M356 200H392" class="arrow"/>
<path d="M684 200H720" class="arrow"/>

<text x="32" y="338" class="h">P 的计算与后台发送怎样接起来？</text>
<text x="32" y="374" class="s">这里只画两层；非最后 chunk 只发完整块，最后 chunk 才可包含尾部未满块。</text>
<rect x="32" y="402" width="496" height="392" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="592" y="402" width="496" height="392" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="56" y="440" class="h blue">P 计算流</text>
<text x="616" y="440" class="h teal">P 后台发送线程</text>
<rect x="56" y="466" width="448" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="76" y="492" class="b">第 0 层写入 KV</text>
<text x="76" y="516" class="s">记录 cache-write event 0</text>
<rect x="56" y="552" width="448" height="62" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="76" y="579" class="b">继续第 0 层余下计算与后续层</text>
<text x="76" y="603" class="s">与已满足写入依赖的传输可能重叠</text>
<rect x="616" y="502" width="448" height="100" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="636" y="533" class="b">等待 event 0 完成</text>
<text x="636" y="568" class="b">按目标地址 write 第 0 层 KV</text>
<text x="636" y="592" class="s">sync_write 同步的是该发送线程</text>
<path d="M504 496H552V532H608" class="dep"/>
<path d="M280 532V544" class="arrow"/>
<rect x="56" y="646" width="448" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="76" y="673" class="b">第 1 层写入 KV</text>
<text x="76" y="697" class="s">记录 cache-write event 1</text>
<path d="M280 618V638" class="arrow"/>
<rect x="616" y="646" width="448" height="100" rx="6" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="636" y="677" class="b">等待 event 1，write 第 1 层</text>
<text x="636" y="712" class="b">同一线程按发送队列顺序处理</text>
<text x="636" y="736" class="s">本来源最后层／chunk 完成后发 DONE</text>
<path d="M504 677H608" class="dep"/>
<path d="M840 606V638" class="arrow"/>
<text x="56" y="756" class="s">缺少早期 hook 时采用较晚事件，</text>
<text x="56" y="782" class="s">重叠窗口也会改变。</text>

<path d="M840 798V832" class="arrow"/>
<rect x="32" y="840" width="1056" height="124" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
<text x="56" y="876" class="h teal">④ 各 D rank 收齐映射要求的必要来源 DONE，才报告接收完成</text>
<text x="56" y="914" class="b">D Scheduler 解除等待 → 重新调度；完整 prompt 命中时仍需重算末 token 来采样。</text>
<text x="56" y="945" class="s">“逐层”是 P 的发送组织；此路径没有让 D 逐层边收边 Decode。</text>
<rect x="32" y="990" width="1056" height="84" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="52" y="1024" class="b orange">P 的源块何时归还池中，必须单独核对请求释放与传输完成。</text>
<text x="52" y="1056" class="s">不能从“逐层推送”推定源块已安全释放；此 connector 的 wait_for_save 本身不等待发送队列。</text>
</svg>
