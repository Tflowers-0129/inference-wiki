<section class="lb-lab" id="dplb-lab" aria-labelledby="dplb-heading">
  <header><span class="lb-eyebrow">请求入口 / 固定遥测快照</span><h4 id="dplb-heading">下一条请求会去哪个 DP rank？</h4><p>先按请求数评分，再试试把 KV 使用率也考虑进去。每次切换都从同一组数据开始。每送入一条请求，观察入口如何更新预计等待的请求数，以及下一条请求会分给谁。</p></header>
  <div class="lb-controls"><div class="lb-modes" role="group" aria-label="DPLB 评分方式"><button type="button" id="lb-count" aria-pressed="false">仅按请求数</button><button type="button" id="lb-kv" aria-pressed="true">计数＋KV 压力</button></div><button type="button" id="lb-send">送入下一条请求 →</button><button type="button" id="lb-reset">重置快照</button></div>
  <p class="lb-result" id="lb-route-result" aria-live="polite"></p><div class="lb-ranks" id="lb-ranks"></div><p class="lb-history" id="lb-route-history"></p>
  <p class="lb-note">本例只有一个 API client（C=1），只演示普通新请求的分发。操作期间沿用同一份遥测快照，已有请求都未结束，KV 使用率保持不变。分数只用于选择 rank。最多送入 8 条，重置后可继续比较。</p>
  <noscript>启用 JavaScript 可演示请求到达；上表列出了初始评分和选定目标。</noscript>
</section>
